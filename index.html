<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Craig/McDowell/Hopkins Cup — End of Season 2025/26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;600;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --green:  #00C853;
  --yellow: #FFEB3B;
  --pink:   #FF1493;
  --purple: #6A1B9A;
  --orange: #FF6F00;
  --cyan:   #00BCD4;
  --lime:   #C6FF00;
  --paper:  #F4F1EA;
  --ink:    #0A0A0A;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; background: var(--ink); color: var(--paper); font-family: 'Inter', system-ui, sans-serif; }
body { font-size: 16px; line-height: 1.3; -webkit-font-smoothing: antialiased; }

#scroller {
  height: 100vh; height: 100dvh;
  width: 100vw;
  overflow-y: scroll; overflow-x: hidden;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
}
#scroller::-webkit-scrollbar { display: none; }
#scroller { scrollbar-width: none; }

.card {
  height: 100vh; height: 100dvh;
  width: 100vw;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.card > div { flex: 1; min-height: 0; width: 100%; }

/* Typography */
.display { font-family: 'Anton', 'Bebas Neue', Impact, sans-serif; letter-spacing: -0.005em; line-height: 0.9; text-transform: uppercase; font-weight: 400; }
.mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 800; letter-spacing: -0.02em; }
.body-txt { font-family: 'Inter', sans-serif; font-weight: 600; line-height: 1.3; }
.caption { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; font-size: clamp(10px, 1.4vw, 13px); }
.label { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; font-size: clamp(10px, 1.2vw, 12px); opacity: 0.75; }

/* Loading */
#loading {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--ink); color: var(--paper); z-index: 9999;
  transition: opacity 400ms ease;
}
#loading.gone { opacity: 0; pointer-events: none; }
#loading .lt { font-family: 'Anton', sans-serif; font-size: clamp(32px, 6vw, 48px); letter-spacing: 0.02em; }
#loading .ls { font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.2em; font-size: 11px; opacity: 0.6; margin-top: 12px; text-transform: uppercase; }
#loading .lb { width: 180px; height: 3px; background: rgba(255,255,255,0.1); margin-top: 24px; overflow: hidden; }
#loading .lb i { display: block; width: 30%; height: 100%; background: var(--lime); animation: lb 1.4s ease-in-out infinite; }
@keyframes lb { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }

/* Animation primitives — gated by .in on the card */
.anim { opacity: 0; transition-timing-function: cubic-bezier(.2,.7,.2,1); }
.fade { transition: opacity 600ms ease; }
.up   { transform: translateY(28px); transition: opacity 700ms ease, transform 800ms cubic-bezier(.2,.7,.2,1); }
.left { transform: translateX(-40px); transition: opacity 700ms ease, transform 800ms cubic-bezier(.2,.7,.2,1); }
.right{ transform: translateX(40px);  transition: opacity 700ms ease, transform 800ms cubic-bezier(.2,.7,.2,1); }
.scale{ transform: scale(0.78); transition: opacity 500ms ease, transform 600ms cubic-bezier(.34,1.4,.5,1); }
.card.in .anim { opacity: 1; transform: translate(0,0) scale(1); }

/* Side-scroll nav progress */
#nav { position: fixed; right: 6px; top: 50%; transform: translateY(-50%); z-index: 30; display: flex; flex-direction: column; gap: 3px; pointer-events: none; }
.nav-dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.25); transition: background .2s, height .2s; }
.nav-dot.dark { background: rgba(0,0,0,0.2); }
.nav-dot.active { background: var(--yellow); height: 14px; border-radius: 2px; }

/* ============================================================
   CARD 1: COLD OPEN
   ============================================================ */
.c-open {
  background: linear-gradient(160deg, #FF1493 0%, #FF6F00 100%);
  color: var(--paper);
  padding: clamp(24px, 5vw, 56px);
  display: flex; flex-direction: column; justify-content: space-between;
}
.c-open .marker { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 0.3em; font-size: 11px; opacity: 0.9; text-transform: uppercase; }
.c-open .stack {
  flex: 1;
  display: flex; flex-direction: column; justify-content: center;
}
.c-open .stack .line {
  font-family: 'Anton', sans-serif;
  font-size: clamp(72px, 18vw, 200px);
  line-height: 0.88;
  letter-spacing: -0.012em;
  text-transform: uppercase;
}
.c-open .stack .line .slash { color: rgba(0,0,0,0.55); margin-right: 6px; }
.c-open .stack .line.l3 { color: var(--ink); }
.c-open .sub { display: flex; align-items: baseline; gap: 16px; justify-content: space-between; flex-wrap: wrap; }
.c-open .sub .right-block { text-align: right; }
.c-open .sub .right-block b { font-family: 'Anton', sans-serif; font-size: clamp(24px, 4vw, 38px); display: block; letter-spacing: 0.01em; line-height: 1; }
.c-open .sub .right-block s { text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
/* per-line entry */
.c-open .stack .line { opacity: 0; transform: translateY(40px); transition: opacity 700ms ease, transform 900ms cubic-bezier(.2,.7,.2,1); }
.card.in .c-open .stack .line { opacity: 1; transform: none; }
.card.in .c-open .stack .l1 { transition-delay: 200ms; }
.card.in .c-open .stack .l2 { transition-delay: 500ms; }
.card.in .c-open .stack .l3 { transition-delay: 800ms; }

/* ============================================================
   INTERSTITIAL
   ============================================================ */
.c-intro {
  display: flex; align-items: center; justify-content: center;
  padding: clamp(20px, 5vw, 48px);
  text-align: center;
}
.c-intro .text {
  font-family: 'Anton', sans-serif;
  font-size: clamp(48px, 11vw, 130px);
  line-height: 0.92;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  max-width: 920px;
}
.c-intro .tag { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 0.2em; font-size: 11px; text-transform: uppercase; margin-bottom: 18px; opacity: 0.75; }

/* ============================================================
   CARD 3: FINAL TABLE (scoreboard)
   ============================================================ */
.c-table {
  background: var(--ink);
  color: var(--paper);
  display: flex; flex-direction: column;
  padding: clamp(20px, 5vw, 56px);
}
.c-table .topline { display: flex; align-items: baseline; justify-content: space-between; }
.c-table .topline h2 { font-family: 'Anton', sans-serif; font-size: clamp(40px, 8vw, 90px); line-height: 1; }
.scoreboard {
  flex: 1; margin-top: clamp(16px, 3vh, 30px);
  display: flex; flex-direction: column;
  border-top: 4px solid var(--green);
  border-bottom: 4px solid var(--green);
}
.scoreboard .hdr {
  display: grid;
  grid-template-columns: 70px 1fr 56px 56px 56px 96px;
  align-items: center;
  padding: 10px 12px;
  background: var(--green);
  color: var(--ink);
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 0.16em; font-size: clamp(10px, 1.3vw, 13px); text-transform: uppercase;
}
.scoreboard .hdr .l { text-align: left; }
.scoreboard .hdr .r { text-align: right; }
.scoreboard .row {
  display: grid;
  grid-template-columns: 70px 1fr 56px 56px 56px 96px;
  align-items: center;
  padding: clamp(10px, 2.4vh, 22px) 12px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  opacity: 0;
  transform: translateX(-30px);
  transition: opacity 500ms ease, transform 600ms cubic-bezier(.2,.7,.2,1);
}
.scoreboard .row:last-child { border-bottom: 0; }
.card.in .scoreboard .row { opacity: 1; transform: none; }
.card.in .scoreboard .row:nth-child(2) { transition-delay: 100ms; }
.card.in .scoreboard .row:nth-child(3) { transition-delay: 250ms; }
.card.in .scoreboard .row:nth-child(4) { transition-delay: 400ms; }
.card.in .scoreboard .row:nth-child(5) { transition-delay: 550ms; }
.card.in .scoreboard .row:nth-child(6) { transition-delay: 700ms; }
.card.in .scoreboard .row:nth-child(7) { transition-delay: 850ms; }
.scoreboard .pos { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: clamp(36px, 7vw, 64px); letter-spacing: -0.04em; line-height: 1; color: var(--paper); }
.scoreboard .row.champ .pos, .scoreboard .row.champ .total { color: var(--yellow); }
.scoreboard .mgr { display: flex; flex-direction: column; }
.scoreboard .mgr .nm { font-family: 'Anton', sans-serif; font-size: clamp(20px, 4.4vw, 32px); line-height: 1; }
.scoreboard .mgr .tm { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(10px, 1.5vw, 13px); opacity: 0.6; margin-top: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
.scoreboard .wdl { font-family: 'Anton', sans-serif; font-size: clamp(18px, 3.6vw, 28px); text-align: right; opacity: 0.85; }
.scoreboard .total { font-family: 'Anton', sans-serif; font-size: clamp(30px, 6vw, 52px); text-align: right; line-height: 1; }
.c-table .foot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; }
.c-table .foot .left, .c-table .foot .right { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.5; }

/* ============================================================
   CARD 5: RACE CHART
   ============================================================ */
.c-race { background: var(--ink); color: var(--paper); padding: clamp(20px, 5vw, 56px); display: flex; flex-direction: column; }
.c-race h2 { font-family: 'Anton', sans-serif; font-size: clamp(34px, 7vw, 64px); line-height: 1; margin-top: 6px; }
.c-race .race-wrap { flex: 1; margin: 14px 0; display: flex; min-height: 0; }
.race-svg { width: 100%; height: 100%; display: block; }
.race-svg .gw-label { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; fill: rgba(255,255,255,0.45); }
.race-svg .pos-label { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 22px; fill: rgba(255,255,255,0.32); }
.race-svg path.race-line { fill: none; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4500; stroke-dashoffset: 4500; }
.card.in .race-svg path.race-line { animation: draw 600ms ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.race-svg .endpoint { opacity: 0; transition: opacity 400ms ease; }
.race-svg .endpoint.in { opacity: 1; }
.race-svg .annot-line { stroke: rgba(255,255,255,0.25); stroke-width: 1; stroke-dasharray: 3 4; }
.race-svg .annot { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; fill: rgba(255,255,255,0.85); }
.c-race .race-caption { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(13px, 1.8vw, 16px); opacity: 0.85; }

/* ============================================================
   CARD 6: TIMELINE
   ============================================================ */
.c-timeline { background: var(--paper); color: var(--ink); padding: clamp(20px, 4vw, 56px); display: flex; flex-direction: column; }
.c-timeline h2 { font-family: 'Anton', sans-serif; font-size: clamp(36px, 7vw, 72px); line-height: 1; margin-top: 4px; }
.c-timeline .tl-wrap { flex: 1; margin-top: 16px; position: relative; overflow: hidden; min-height: 0; display: flex; }
.tl-svg { width: 100%; height: 100%; display: block; flex: 1; }
.tl-svg .axis { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2000; stroke-dashoffset: 2000; }
.card.in .tl-svg .axis { animation: draw 1500ms ease-out forwards; animation-delay: 200ms; }
.tl-svg .gw-mark { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 12px; fill: var(--ink); opacity: 0.55; }
.tl-svg .ev { opacity: 0; transition: opacity 350ms ease; }
.tl-svg .ev.in { opacity: 1; }
.tl-svg .ev-dot { stroke-width: 2; }
.tl-svg .ev-line { stroke: rgba(0,0,0,0.18); stroke-width: 1; stroke-dasharray: 2 3; }
.tl-svg .ev-label { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 10px; fill: var(--ink); }
.tl-svg .ev-label.pl { fill: var(--purple); }
.tl-svg .track-lbl { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; fill: var(--ink); }

/* ============================================================
   CARD 8: HANDS-OFF (3 giant numbers)
   ============================================================ */
.c-handsoff { background: var(--green); color: var(--ink); padding: clamp(20px, 5vw, 56px); display: flex; flex-direction: column; }
.c-handsoff .ho-stack {
  flex: 1; display: grid;
  grid-template-rows: 1fr 1fr 1fr;
  gap: clamp(8px, 1.6vh, 18px);
  margin-top: 14px;
}
.c-handsoff .ho-row { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; padding-bottom: 8px; border-bottom: 2px solid rgba(0,0,0,0.3); }
.c-handsoff .ho-row:last-child { border-bottom: 0; }
.c-handsoff .ho-num { font-family: 'Anton', sans-serif; font-size: clamp(110px, 24vw, 260px); line-height: 0.82; letter-spacing: -0.02em; }
.c-handsoff .ho-lbl { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 0.12em; font-size: clamp(12px, 1.6vw, 16px); text-transform: uppercase; max-width: 180px; text-align: right; }
.c-handsoff .ho-cap { font-family: 'Anton', sans-serif; font-size: clamp(22px, 4.5vw, 38px); line-height: 1.05; max-width: 720px; }

/* ============================================================
   TRADE CARDS
   ============================================================ */
.c-trade { padding: clamp(20px, 4vw, 56px); display: flex; flex-direction: column; color: var(--ink); }
.c-trade .topline { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
.c-trade .topline h2 { font-family: 'Anton', sans-serif; font-size: clamp(32px, 6.5vw, 56px); line-height: 1; }
.c-trade .swap {
  flex: 1; margin-top: 18px; min-height: 0;
  display: grid; grid-template-columns: 1fr 56px 1fr; gap: 12px; align-items: stretch;
}
.c-trade .col-side { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: rgba(0,0,0,0.07); border-radius: 14px; }
.c-trade.dark .col-side { background: rgba(255,255,255,0.10); }
.c-trade .col-mgr { font-family: 'Anton', sans-serif; font-size: clamp(20px, 4.4vw, 30px); line-height: 1; }
.c-trade .col-tag { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.16em; opacity: 0.7; text-transform: uppercase; }
.c-trade .player { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: rgba(255,255,255,0.55); border-radius: 8px; }
.c-trade.dark .player { background: rgba(0,0,0,0.30); }
.c-trade .player .pname { font-family: 'Anton', sans-serif; font-size: clamp(18px, 3.5vw, 24px); line-height: 1; }
.c-trade .player .pteam { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 10px; opacity: 0.6; letter-spacing: 0.06em; }
.c-trade .player .ppts { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: clamp(18px, 3.8vw, 26px); }
.c-trade .arrow { display: flex; align-items: center; justify-content: center; }
.c-trade .arrow svg { width: 100%; max-width: 56px; height: auto; opacity: 0; transition: opacity 600ms ease; }
.card.in .c-trade .arrow svg { opacity: 1; transition-delay: 700ms; }
.c-trade .col-total { margin-top: auto; font-family: 'Anton', sans-serif; font-size: clamp(22px, 5.2vw, 36px); text-align: right; }
.c-trade .verdict {
  margin-top: 16px;
  display: flex; justify-content: flex-end; align-items: center; gap: 14px;
}
.c-trade .stamp {
  font-family: 'Anton', sans-serif;
  font-size: clamp(28px, 6.2vw, 42px);
  padding: 6px 14px;
  border: 4px solid currentColor;
  letter-spacing: 0.08em;
  transform: rotate(-6deg) scale(0.6);
  opacity: 0;
  transition: opacity 400ms ease, transform 500ms cubic-bezier(.34, 1.6, .4, 1);
}
.card.in .c-trade .stamp { opacity: 1; transform: rotate(-6deg) scale(1); transition-delay: 1500ms; }
.c-trade .verdict-line { font-family: 'Space Grotesk', sans-serif; font-style: italic; font-weight: 700; font-size: clamp(13px, 1.8vw, 17px); max-width: 360px; text-align: right; }
.c-trade .col-side.left  { opacity: 0; transform: translateX(-20px); transition: opacity 600ms ease, transform 700ms cubic-bezier(.2,.7,.2,1); }
.c-trade .col-side.right { opacity: 0; transform: translateX(20px);  transition: opacity 600ms ease, transform 700ms cubic-bezier(.2,.7,.2,1); }
.card.in .c-trade .col-side.left  { opacity: 1; transform: none; transition-delay: 200ms; }
.card.in .c-trade .col-side.right { opacity: 1; transform: none; transition-delay: 1000ms; }

/* ============================================================
   MANAGER CARDS
   ============================================================ */
.c-mgr { padding: clamp(20px, 4vw, 56px); display: flex; flex-direction: column; position: relative; overflow: hidden; }
.c-mgr .watermark {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  right: -6vw;
  font-family: 'Anton', sans-serif;
  font-size: clamp(260px, 56vw, 700px);
  line-height: 0.78;
  opacity: 0.10;
  pointer-events: none;
  letter-spacing: -0.06em;
}
.c-mgr.light .watermark { color: rgba(0,0,0,0.16); }
.c-mgr.dark .watermark { color: rgba(255,255,255,0.18); }
.c-mgr .head { position: relative; z-index: 2; }
.c-mgr .head .role { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 0.16em; font-size: 11px; text-transform: uppercase; opacity: 0.75; }
.c-mgr .head .first { font-family: 'Anton', sans-serif; font-size: clamp(60px, 12vw, 120px); line-height: 0.95; letter-spacing: -0.01em; margin-top: 4px; }
.c-mgr .head .team { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(14px, 2vw, 20px); margin-top: 6px; letter-spacing: 0.04em; }
.c-mgr .head .record { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: clamp(14px, 1.8vw, 18px); margin-top: 10px; opacity: 0.85; }
.c-mgr .stats { position: relative; z-index: 2; margin-top: clamp(14px, 3vh, 28px); display: flex; flex-direction: column; gap: clamp(6px, 1.4vh, 14px); }
.c-mgr .srow { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid currentColor; border-bottom-color: rgba(0,0,0,0.18); }
.c-mgr.dark .srow { border-bottom-color: rgba(255,255,255,0.18); }
.c-mgr .srow .l { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.7; }
.c-mgr .srow .v { font-family: 'Anton', sans-serif; font-size: clamp(20px, 3.6vw, 28px); line-height: 1; }
.c-mgr .srow .sub { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px; opacity: 0.65; text-align: right; }
.c-mgr .verdict {
  position: relative; z-index: 2; margin-top: auto; padding-top: 14px;
  font-family: 'Space Grotesk', sans-serif; font-style: italic; font-weight: 700;
  font-size: clamp(16px, 2.2vw, 21px); line-height: 1.3;
  max-width: 720px;
}
/* stagger */
.c-mgr .head, .c-mgr .srow, .c-mgr .verdict { opacity: 0; transform: translateY(18px); transition: opacity 600ms ease, transform 600ms cubic-bezier(.2,.7,.2,1); }
.card.in .c-mgr .head { opacity: 1; transform: none; transition-delay: 100ms; }
.card.in .c-mgr .verdict { opacity: 1; transform: none; transition-delay: 1500ms; }
.card.in .c-mgr .srow:nth-child(1) { opacity: 1; transform: none; transition-delay: 400ms; }
.card.in .c-mgr .srow:nth-child(2) { opacity: 1; transform: none; transition-delay: 520ms; }
.card.in .c-mgr .srow:nth-child(3) { opacity: 1; transform: none; transition-delay: 640ms; }
.card.in .c-mgr .srow:nth-child(4) { opacity: 1; transform: none; transition-delay: 760ms; }
.card.in .c-mgr .srow:nth-child(5) { opacity: 1; transform: none; transition-delay: 880ms; }
.card.in .c-mgr .srow:nth-child(6) { opacity: 1; transform: none; transition-delay: 1000ms; }
.card.in .c-mgr .srow:nth-child(7) { opacity: 1; transform: none; transition-delay: 1120ms; }

/* ============================================================
   CHAMPION CARD — victory lap
   ============================================================ */
.c-champ { background: linear-gradient(180deg, #FFEB3B 0%, #FFC400 100%); color: var(--ink); padding: clamp(20px, 5vw, 56px); display: flex; flex-direction: column; }
.c-champ .crown-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.c-champ .crown { width: clamp(80px, 12vw, 130px); height: auto; opacity: 0; transform: translateY(-20px); transition: opacity 500ms ease, transform 600ms cubic-bezier(.2,.7,.2,1); }
.card.in .c-champ .crown { opacity: 1; transform: none; transition-delay: 200ms; }
.c-champ .gname { font-family: 'Anton', sans-serif; font-size: clamp(90px, 22vw, 260px); line-height: 0.88; letter-spacing: -0.02em; }

}

.c-gittens .head .w { display: inline-block; opacity: 0; transform: translateY(8px); transition: opacity 300ms ease, transform 300ms ease; margin-right: 0.15em; }

}

.c-gittens .stamp {
  position: absolute;
  display: inline-block;

}

.c-asleep .verdict { margin-top: 16px; font-family: 'Anton', sans-serif; font-size: clamp(28px, 5.2vw, 44px); line-height: 1.05; }

/* ============================================================

.c-howler { background: var(--ink); color: var(--paper); padding: clamp(20px, 5vw, 56px); display: flex; flex-direction: column; }
.c-howler .head { font-family: 'Anton', sans-serif; color: var(--cyan); font-size: clamp(40px, 8vw, 80px); line-height: 1; margin-top: 6px; }
.c-howler .who { font-family: 'Anton', sans-serif; color: var(--paper); font-size: clamp(28px, 6vw, 50px); line-height: 1; margin-top: 12px; }

/* ============================================================

.c-phantom .player {

/* ============================================================
   MICRO: THREE STRIKES
   ============================================================ */

   ============================================================ */

.c-agg .cell s { text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.14em; line-height: 1.2; margin-top: 6px; text-transform: uppercase; }

/* ============================================================
   CLOSING
   ============================================================ */
.c-close { background: linear-gradient(160deg, #6A1B9A 0%, #FF1493 100%); color: var(--paper); padding: clamp(24px, 5vw, 56px); display: flex; flex-direction: column; }
.c-close .top { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 0.22em; font-size: 11px; text-transform: uppercase; opacity: 0.9; }
.c-close .stack { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.c-close .stack .line { font-family: 'Anton', sans-serif; font-size: clamp(78px, 18vw, 200px); line-height: 0.9; letter-spacing: -0.01em; text-transform: uppercase; opacity: 0; transform: translateY(40px); transition: opacity 700ms ease, transform 900ms cubic-bezier(.2,.7,.2,1); }
.card.in .c-close .stack .line { opacity: 1; transform: none; }
.card.in .c-close .stack .l1 { transition-delay: 400ms; }
.card.in .c-close .stack .l2 { transition-delay: 1000ms; }
.card.in .c-close .stack .l3 { transition-delay: 1600ms; }
.c-close .sub { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(13px, 1.8vw, 17px); max-width: 720px; opacity: 0; transition: opacity 600ms ease; }
.card.in .c-close .sub { opacity: 1; transition-delay: 2400ms; }

/* === Body utility text on dark bg === */
.text-paper { color: var(--paper); }

/* === Mobile adjustments === */
@media (max-width: 540px) {
  .scoreboard .hdr, .scoreboard .row { grid-template-columns: 48px 1fr 36px 36px 36px 70px; gap: 4px; }
  .scoreboard .hdr .h-wdl { display: none; }
  .c-mgr .watermark { font-size: 110vw; right: -20vw; }
  .c-mgr .srow { grid-template-columns: 90px 1fr auto; }
  .c-trade .swap { grid-template-columns: 1fr 36px 1fr; gap: 8px; }
  .cf-row { grid-template-columns: 26px 1fr 60px 50px 36px; gap: 6px; }
  .c-agg .grid { grid-template-columns: 1fr; }
  .c-agg .cell b { font-size: clamp(40px, 14vw, 80px); }
  .c-handsoff .ho-row { gap: 12px; }
  .c-handsoff .ho-lbl { max-width: 110px; font-size: 11px; }
}

/* Crown svg colours */
svg.crown path { fill: var(--ink); }

<body>
<div id="loading">
  <div class="lt">CRAIG / McDOWELL / HOPKINS</div>
  <div class="ls">Counting the trophies</div>
  <div class="lb"><i></i></div>
</div>
<div id="nav"></div>
<div id="scroller"></div>

<script>
// ============================================================
// CONSTANTS
// ============================================================
const MAX_GW = 37;
const MANAGERS = [
  { le: 73835, eid: 76226, first: 'Geraint',     last: 'Hopkins',  team: '🏴󠁧󠁢󠁷󠁬󠁳󠁿',                color: '#FFEB3B', short: 'GH' },
  { le: 73788, eid: 76178, first: 'Mark',        last: 'Craig',    team: 'Carrying Timber',     color: '#00BCD4', short: 'MC' },
  { le: 73827, eid: 76218, first: 'Steven',      last: 'McDowell', team: '✨',                  color: '#FF1493', short: 'SM' },
  { le: 73858, eid: 76250, first: 'christopher', last: 'craig',    team: 'The Masterplan',      color: '#C6FF00', short: 'CC' },
  { le: 73847, eid: 76238, first: 'Michael',     last: 'Craig',    team: 'Jota win again *20',  color: '#FF6F00', short: 'MI' },
  { le: 73822, eid: 76213, first: 'Peter',       last: 'Craig',    team: 'MaxPoints',           color: '#6A1B9A', short: 'PC' },
];
const MGR_BY_LE  = Object.fromEntries(MANAGERS.map(m => [m.le, m]));
const MGR_BY_EID = Object.fromEntries(MANAGERS.map(m => [m.eid, m]));

// Premier League events researched from the 2025-26 season (for the timeline card)
const PL_EVENTS = [
  { gw: 4,  date: 'Sep 8',  text: 'Nuno sacked at Forest' },
  { gw: 6,  date: 'Sep 27', text: 'Potter sacked at West Ham' },
  { gw: 8,  date: 'Oct 18', text: 'Postecoglou out at Forest' },
  { gw: 10, date: 'Nov 2',  text: 'Pereira out at Wolves' },
  { gw: 20, date: 'Jan 5',  text: 'Amorim sacked at Utd' },
  { gw: 26, date: 'Feb 11', text: 'Frank sacked at Spurs' },
  { gw: 33, date: 'Apr 22', text: 'Rosenior out at Chelsea' },
];

// ============================================================
// LOAD
// ============================================================
async function loadAll() {
  const j = (p) => fetch(p).then(r => r.json());
  const [league, bs, draft, trans, trades, estatus, game] = await Promise.all([
    j('./data/league_details.json'),
    j('./data/bootstrap_static.json'),
    j('./data/draft_choices.json'),
    j('./data/transactions.json'),
    j('./data/trades.json'),
    j('./data/element_status.json'),
    j('./data/game.json'),
  ]);
  const owned = new Set();
  draft.choices.forEach(c => owned.add(c.element));
  trans.transactions.forEach(t => { owned.add(t.element_in); owned.add(t.element_out); });
  trades.trades.forEach(t => t.tradeitem_set.forEach(ti => { owned.add(ti.element_in); owned.add(ti.element_out); }));

  const picks = {};
  await Promise.all(MANAGERS.flatMap(m =>
    Array.from({length: MAX_GW}, (_, i) => i + 1).map(gw =>
      j(`./data/picks/${m.eid}_gw${gw}.json`).then(d => {
        picks[`${m.eid}_${gw}`] = d;
        d.picks.forEach(p => owned.add(p.element));
      }).catch(() => {})
    )
  ));
  const phist = {};
  await Promise.all([...owned].map(pid =>
    j(`./data/player_history/${pid}.json`).then(d => { phist[pid] = d; }).catch(() => {})
  ));
  return { league, bs, draft, trans, trades, estatus, game, picks, phist };
}

// ============================================================
// STATE
// ============================================================
function compute(d) {
  const players = {}, teams = {}, ptypes = {};
  d.bs.elements.forEach(e => players[e.id] = e);
  d.bs.teams.forEach(t => teams[t.id] = t);
  d.bs.element_types.forEach(t => ptypes[t.id] = t);

  const pname = pid => players[pid] ? players[pid].web_name : `#${pid}`;
  const ppos  = pid => players[pid] ? ptypes[players[pid].element_type].singular_name_short : '';
  const pteam = pid => players[pid] ? teams[players[pid].team].short_name : '';

  const pidByName = (n, requireTeam) => {
    for (const id in players) {
      if (players[id].web_name === n && (!requireTeam || teams[players[id].team].short_name === requireTeam)) return +id;
    }
    return null;
  };

  // per-gw points
  const pts = {}, mins = {};
  for (const pid in d.phist) {
    pts[pid] = {}; mins[pid] = {};
    d.phist[pid].history.forEach(h => {
      pts[pid][h.event] = (pts[pid][h.event] || 0) + h.total_points;
      mins[pid][h.event] = (mins[pid][h.event] || 0) + h.minutes;
    });
  }
  const getPts = (pid, gw) => pts[pid]?.[gw] || 0;
  const getMins = (pid, gw) => mins[pid]?.[gw] || 0;

  // gw scores
  const gwPts = {};
  for (let g = 1; g <= MAX_GW; g++) gwPts[g] = {};
  d.league.matches.forEach(m => {
    if (!m.finished) return;
    gwPts[m.event][m.league_entry_1] = m.league_entry_1_points;
    gwPts[m.event][m.league_entry_2] = m.league_entry_2_points;
  });

  // ownership per gw (from picks files = state at start of GW)
  const ownByGw = {};
  for (const m of MANAGERS) {
    for (let g = 1; g <= MAX_GW; g++) {
      const pk = d.picks[`${m.eid}_${g}`];
      if (!pk) continue;
      pk.picks.forEach(p => {
        ownByGw[p.element] = ownByGw[p.element] || {};
        ownByGw[p.element][g] = m.le;
      });
    }
  }
  const tenureWindow = (pid, le, fromGw = 1) => {
    const own = ownByGw[pid] || {};
    const arr = [];
    for (let g = fromGw; g <= MAX_GW; g++) if (own[g] === le) arr.push(g);
    return arr;
  };
  const tenurePts = (pid, le, fromGw = 1) =>
    tenureWindow(pid, le, fromGw).reduce((s, g) => s + getPts(pid, g), 0);

  // standings
  const standings = d.league.standings.slice().sort((a, b) => a.rank - b.rank);

  // rank by GW
  function rankAfter(gwLim) {
    const w = {};
    MANAGERS.forEach(m => w[m.le] = [0, 0, 0, 0, 0]);
    d.league.matches.forEach(m => {
      if (!m.finished || m.event > gwLim) return;
      const a = m.league_entry_1, b = m.league_entry_2;
      const ap = m.league_entry_1_points, bp = m.league_entry_2_points;
      if (ap > bp) { w[a][0]++; w[b][2]++; }
      else if (bp > ap) { w[b][0]++; w[a][2]++; }
      else { w[a][1]++; w[b][1]++; }
      w[a][3] += ap; w[a][4] += bp;
      w[b][3] += bp; w[b][4] += ap;
    });
    const rows = MANAGERS.map(m => ({ le: m.le, pts: w[m.le][0] * 3 + w[m.le][1], pf: w[m.le][3] }));
    rows.sort((x, y) => (y.pts - x.pts) || (y.pf - x.pf));
    const out = {}; rows.forEach((r, i) => out[r.le] = i + 1); return out;
  }
  const posByGw = {};
  for (let g = 1; g <= MAX_GW; g++) posByGw[g] = rankAfter(g);

  // high/low GW
  const hl = {};
  MANAGERS.forEach(m => {
    let hi = { gw: 1, pts: -1 }, lo = { gw: 1, pts: 999 };
    for (let g = 1; g <= MAX_GW; g++) {
      const p = gwPts[g][m.le];
      if (p > hi.pts) hi = { gw: g, pts: p };
      if (p < lo.pts) lo = { gw: g, pts: p };
    }
    hl[m.le] = { hi, lo };
  });

  // accepted transactions
  const accepted = d.trans.transactions.filter(t => t.result === 'a')
    .slice().sort((a, b) => a.event - b.event || a.added.localeCompare(b.added));

  // transfer eval
  const transferEval = accepted.map(t => {
    const le = MGR_BY_EID[t.entry].le;
    const inP = t.element_in, outP = t.element_out, gw = t.event;
    const win = tenureWindow(inP, le, gw);
    const inPts = win.reduce((s, g) => s + getPts(inP, g), 0);
    const outPts = win.reduce((s, g) => s + getPts(outP, g), 0);
    return { le, gw, inP, outP, inPts, outPts, delta: inPts - outPts, winLen: win.length };
  });

  const bwTr = {};
  MANAGERS.forEach(m => {
    const mine = transferEval.filter(t => t.le === m.le && t.winLen >= 1);
    if (!mine.length) { bwTr[m.le] = { best: null, worst: null }; return; }
    bwTr[m.le] = {
      best: mine.reduce((a, b) => a.delta > b.delta ? a : b),
      worst: mine.reduce((a, b) => a.delta < b.delta ? a : b),
    };
  });

  // transaction counts
  const transCount = {};
  MANAGERS.forEach(m => transCount[m.le] = 0);
  accepted.forEach(t => transCount[MGR_BY_EID[t.entry].le]++);

  // dormant
  const dormant = {};
  MANAGERS.forEach(m => {
    const evs = accepted.filter(t => MGR_BY_EID[t.entry].le === m.le).map(t => t.event).sort((a, b) => a - b);
    const padded = [0, ...evs, MAX_GW + 1];
    let longest = { len: 0, from: 1, to: 1 };
    for (let i = 0; i < padded.length - 1; i++) {
      const len = padded[i + 1] - padded[i] - 1;
      if (len > longest.len) longest = { len, from: padded[i] + 1, to: padded[i + 1] - 1 };
    }
    dormant[m.le] = { longest, total: evs.length, lastEvent: evs.length ? evs[evs.length - 1] : 0, allEvents: evs };
  });

  // nemesis
  const lossesTo = {}, lossGws = {};
  MANAGERS.forEach(m => { lossesTo[m.le] = {}; lossGws[m.le] = {}; MANAGERS.forEach(n => { if (n.le !== m.le) { lossesTo[m.le][n.le] = 0; lossGws[m.le][n.le] = []; } }); });
  d.league.matches.forEach(m => {
    if (!m.finished) return;
    const a = m.league_entry_1, b = m.league_entry_2, ap = m.league_entry_1_points, bp = m.league_entry_2_points;
    if (ap > bp) { lossesTo[b][a]++; lossGws[b][a].push(m.event); }
    else if (bp > ap) { lossesTo[a][b]++; lossGws[a][b].push(m.event); }
  });
  const nemesis = {};
  MANAGERS.forEach(m => {
    let max = -1, who = null;
    for (const ole in lossesTo[m.le]) if (lossesTo[m.le][ole] > max) { max = lossesTo[m.le][ole]; who = +ole; }
    nemesis[m.le] = { le: who, count: max, gws: lossGws[m.le][who] };
  });

  // optimal XI
  function optimalXi(squad, gw) {
    const by = { GKP: [], DEF: [], MID: [], FWD: [] };
    squad.forEach(pid => {
      const pos = ppos(pid); if (!by[pos]) return; by[pos].push(getPts(pid, gw));
    });
    for (const k in by) by[k].sort((a, b) => b - a);
    if (!by.GKP.length) return 0;
    const gk = by.GKP[0]; let best = 0;
    for (const nd of [3, 4, 5]) for (const nf of [1, 2, 3]) {
      const nm = 10 - nd - nf; if (nm < 3 || nm > 5) continue;
      if (by.DEF.length < nd || by.MID.length < nm || by.FWD.length < nf) continue;
      let t = gk;
      for (let i = 0; i < nd; i++) t += by.DEF[i];
      for (let i = 0; i < nm; i++) t += by.MID[i];
      for (let i = 0; i < nf; i++) t += by.FWD[i];
      if (t > best) best = t;
    }
    return best;
  }

  // counterfactual: everyone plays Pete
  const PETE = 73822;
  function cfPete() {
    const w = {}; MANAGERS.forEach(m => w[m.le] = [0, 0, 0, 0, 0]);
    for (let g = 1; g <= MAX_GW; g++) {
      const pete = gwPts[g][PETE];
      const others = MANAGERS.filter(m => m.le !== PETE).map(m => gwPts[g][m.le]);
      const avg = others.reduce((a, b) => a + b, 0) / others.length;
      MANAGERS.forEach(m => {
        const my = gwPts[g][m.le], opp = m.le === PETE ? avg : pete;
        w[m.le][3] += my; w[m.le][4] += opp;
        if (my > opp) w[m.le][0]++; else if (my < opp) w[m.le][2]++; else w[m.le][1]++;
      });
    }
    return w;
  }
  function cfOptimal() {
    const optGw = {};
    for (let g = 1; g <= MAX_GW; g++) {
      optGw[g] = {};
      MANAGERS.forEach(m => {
        const pk = d.picks[`${m.eid}_${g}`];
        optGw[g][m.le] = pk ? optimalXi(pk.picks.map(p => p.element), g) : 0;
      });
    }
    const w = {}; MANAGERS.forEach(m => w[m.le] = [0, 0, 0, 0, 0]);
    d.league.matches.forEach(m => {
      if (!m.finished) return;
      const a = m.league_entry_1, b = m.league_entry_2;
      const ap = optGw[m.event][a], bp = optGw[m.event][b];
      w[a][3] += ap; w[a][4] += bp; w[b][3] += bp; w[b][4] += ap;
      if (ap > bp) { w[a][0]++; w[b][2]++; }
      else if (bp > ap) { w[b][0]++; w[a][2]++; }
      else { w[a][1]++; w[b][1]++; }
    });
    return { w, optGw };
  }
  function cfNoTransfer() {
    const sq = {};
    MANAGERS.forEach(m => { sq[m.le] = d.picks[`${m.eid}_1`].picks.map(p => p.element); });
    const ng = {};
    for (let g = 1; g <= MAX_GW; g++) {
      ng[g] = {};
      MANAGERS.forEach(m => { ng[g][m.le] = optimalXi(sq[m.le], g); });
    }
    const w = {}; MANAGERS.forEach(m => w[m.le] = [0, 0, 0, 0, 0]);
    d.league.matches.forEach(m => {
      if (!m.finished) return;
      const a = m.league_entry_1, b = m.league_entry_2;
      const ap = ng[m.event][a], bp = ng[m.event][b];
      w[a][3] += ap; w[a][4] += bp; w[b][3] += bp; w[b][4] += ap;
      if (ap > bp) { w[a][0]++; w[b][2]++; }
      else if (bp > ap) { w[b][0]++; w[a][2]++; }
      else { w[a][1]++; w[b][1]++; }
    });
    return w;
  }

  return {
    d, players, teams, ptypes, pname, ppos, pteam, pidByName,
    getPts, getMins, gwPts, ownByGw, tenureWindow, tenurePts,
    standings, posByGw, hl, accepted, transferEval, bwTr,
    transCount, dormant, nemesis, optimalXi, cfPete, cfOptimal, cfNoTransfer
  };
}

// ============================================================
// HELPERS
// ============================================================
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in props) {
    if (k === 'class') e.className = props[k];
    else if (k === 'html') e.innerHTML = props[k];
    else if (k === 'style') e.setAttribute('style', props[k]);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), props[k]);
    else if (props[k] != null) e.setAttribute(k, props[k]);
  }
  const add = k => {
    if (k == null || k === false) return;
    if (Array.isArray(k)) { k.forEach(add); return; }
    if (typeof k === 'string' || typeof k === 'number') e.appendChild(document.createTextNode(k));
    else e.appendChild(k);
  };
  for (const k of kids) add(k);
  return e;
}

function sortedFromWld(w) {
  return MANAGERS.map(m => {
    const [W, D, L, PF, PA] = w[m.le];
    return { le: m.le, w: W, d: D, l: L, pf: PF, pa: PA, pts: W * 3 + D };
  }).sort((a, b) => (b.pts - a.pts) || (b.pf - a.pf));
}

// ============================================================
// CARD BUILDERS — one per card, each producing a unique hero
// ============================================================
function buildAll(S) {
  const root = document.getElementById('scroller');
  const cards = [];
  const add = (cls, attrs, builder, isDark = false) => {
    const c = el('section', { class: 'card', 'data-cls': cls });
    if (isDark) c.classList.add('dark'); else c.classList.add('light');
    const inner = el('div', { class: cls, ...attrs });
    builder(inner);
    c.appendChild(inner);
    cards.push({ el: c, isDark });
    root.appendChild(c);
    return c;
  };
  const intro = (text, bg, fg = 'var(--paper)', tag = null) => {
    add('c-intro', { style: `background: ${bg}; color: ${fg};` }, (n) => {
      if (tag) n.appendChild(el('div', { class: 'tag anim up' }, tag));
      n.appendChild(el('div', { class: 'text anim up' }, text));
    }, fg === 'var(--paper)');
  };

  // -------- 1. COLD OPEN --------
  add('c-open', {}, (n) => {
    n.appendChild(el('div', { class: 'marker' }, 'Craig/McDowell/Hopkins Cup'));
    n.appendChild(el('div', { class: 'stack' },
      el('div', { class: 'line l1' }, el('span', { class: 'slash' }, '/'), 'Craig'),
      el('div', { class: 'line l2' }, el('span', { class: 'slash' }, '/'), 'McDowell'),
      el('div', { class: 'line l3' }, el('span', { class: 'slash' }, '/'), 'Hopkins'),
    ));
    n.appendChild(el('div', { class: 'sub' },
      el('div', { class: 'right-block' },
        el('s', {}, 'Season'),
        el('b', {}, '2025/26')
      ),
      el('div', { class: 'right-block', style: 'text-align: left;' },
        el('s', {}, 'End of season review'),
        el('b', {}, 'Card 1 of 39')
      )
    ));
  }, true);

  // -------- 2. INTERSTITIAL --------
  intro('Right. The final table.', 'var(--paper)', 'var(--ink)');

  // -------- 3. FINAL TABLE --------
  add('c-table', {}, (n) => {
    n.appendChild(el('div', { class: 'topline' },
      el('div', {},
        el('div', { class: 'caption anim fade' }, 'Final standings · 37 GW'),
        el('h2', { class: 'anim up' }, 'The Table'),
      ),
      el('div', { class: 'caption anim fade', style: 'text-align: right;' }, '6 managers · 114 matches · GW38 not contested')
    ));
    const sb = el('div', { class: 'scoreboard' });
    sb.appendChild(el('div', { class: 'hdr' },
      el('div', { class: 'l' }, '#'),
      el('div', { class: 'l' }, 'Manager'),
      el('div', { class: 'r h-wdl' }, 'W'),
      el('div', { class: 'r h-wdl' }, 'D'),
      el('div', { class: 'r h-wdl' }, 'L'),
      el('div', { class: 'r' }, 'Pts')
    ));
    S.standings.forEach((s, i) => {
      const m = MGR_BY_LE[s.league_entry];
      const tr = el('div', { class: 'row' + (i === 0 ? ' champ' : '') },
        el('div', { class: 'pos' }, String(s.rank)),
        el('div', { class: 'mgr' },
          el('div', { class: 'nm' }, m.first),
          el('div', { class: 'tm' }, m.team)
        ),
        el('div', { class: 'wdl' }, String(s.matches_won)),
        el('div', { class: 'wdl' }, String(s.matches_drawn)),
        el('div', { class: 'wdl' }, String(s.matches_lost)),
        el('div', { class: 'total' }, String(s.total))
      );
      sb.appendChild(tr);
    });
    n.appendChild(sb);
    n.appendChild(el('div', { class: 'foot' },
      el('div', { class: 'left' }, 'Geraint by 13'),
      el('div', { class: 'right' }, 'Peter by, well, a lot')
    ));
  }, true);

  // -------- 4. INTERSTITIAL --------
  intro('How we got here.', '#0A0A0A', 'var(--paper)');

  // -------- 5. RACE CHART --------
  add('c-race', {}, (n) => {
    n.appendChild(el('div', { class: 'caption anim fade' }, 'The Race'));
    n.appendChild(el('h2', { class: 'anim up' }, 'League position by gameweek'));

        <g class="endpoint" id="ep-${m.le}" transform="translate(${xFor(MAX_GW) + 8}, ${yFor(last) + 4})">

// ============================================================
// SCROLL OBSERVER + ANIMATIONS
// ============================================================
function setupObserver(cards) {
  const cardEls = cards.map(c => c.el);
  const dots = document.querySelectorAll('.nav-dot');
  const seen = new Set();
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const i = cardEls.indexOf(en.target);
      if (en.isIntersecting && en.intersectionRatio > 0.55) {
        if (!seen.has(en.target)) {
          en.target.classList.add('in');
          seen.add(en.target);
          // run counters and per-card on-enter triggers
          en.target.querySelectorAll('[data-count]').forEach(node => {
            const final = node.getAttribute('data-count');
            animateCounter(node, final);
          });
          // Trigger race chart endpoint reveals after lines finish
          const race = en.target.querySelector('.race-svg');
          if (race) {
            const endpoints = race.querySelectorAll('.endpoint');
            endpoints.forEach((ep, idx) => setTimeout(() => ep.classList.add('in'), 400 * idx + 600));
          }
          // Trigger timeline event pops
          const tl = en.target.querySelector('.tl-svg');
          if (tl) {
            const evs = tl.querySelectorAll('.ev');
            evs.forEach((e, idx) => setTimeout(() => e.classList.add('in'), 1700 + idx * 55));
          }
        }
        dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
      }
    });
  }, { threshold: [0, 0.3, 0.55, 0.85, 1] });
  cardEls.forEach(c => io.observe(c));
  // Activate first card immediately
  if (cardEls[0]) {
    cardEls[0].classList.add('in');
    seen.add(cardEls[0]);
    cardEls[0].querySelectorAll('[data-count]').forEach(node => animateCounter(node, node.getAttribute('data-count')));
  }
}

function animateCounter(node, finalStr) {
  // Detect prefix and number
  const m = /^([+-]?)(\d+)(.*)$/.exec(finalStr);
  if (!m) { node.textContent = finalStr; return; }
  const sign = m[1], target = parseInt(m[2], 10), suffix = m[3] || '';
  // For very small numbers, count slowly. Larger numbers, faster.
  let duration;
  if (target <= 20) duration = 1500 + target * 100;
  else duration = 1800;
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const val = Math.round(target * eased);
    node.textContent = (sign || '') + val + suffix;
    if (t < 1) requestAnimationFrame(tick);
    else node.textContent = finalStr;
  }
  requestAnimationFrame(tick);
}

function setupKeyboard() {
  const sc = document.getElementById('scroller');
  let busy = false;
  document.addEventListener('keydown', e => {
    if (busy) return;
    const h = window.innerHeight;
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
      busy = true; sc.scrollBy({ top: h, behavior: 'smooth' }); e.preventDefault();
      setTimeout(() => busy = false, 600);
    } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
      busy = true; sc.scrollBy({ top: -h, behavior: 'smooth' }); e.preventDefault();
      setTimeout(() => busy = false, 600);
    }
  });
}

// ============================================================
// MAIN
// ============================================================
(async () => {
  try {
    const d = await loadAll();
    const S = compute(d);
    const cards = buildAll(S);
    setupObserver(cards);
    setupKeyboard();
    document.getElementById('loading').classList.add('gone');
    setTimeout(() => document.getElementById('loading').remove(), 500);
  } catch (e) {
    console.error(e);
    document.getElementById('loading').innerHTML = '<div class="lt">Couldn\'t load. Check the console.</div>';
  }
})();

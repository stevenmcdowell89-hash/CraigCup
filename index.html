<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Craig Cup — End of Season 2025/26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00C853;
  --yellow:#FFEB3B;
  --pink:#FF1493;
  --purple:#6A1B9A;
  --orange:#FF6F00;
  --cyan:#00BCD4;
  --lime:#C6FF00;
  --offwhite:#F4F1EA;
  --black:#0A0A0A;
  --display:'Anton','Bebas Neue',sans-serif;
  --bebas:'Bebas Neue',sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --grotesk:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow-x:hidden;background:#0A0A0A;color:#F4F1EA;font-family:var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{scroll-snap-type:y mandatory;overflow-y:auto;-webkit-overflow-scrolling:touch}
#deck{width:100%}
.card{
  position:relative;
  min-height:100vh;
  min-height:100svh;
  width:100%;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
  padding:clamp(24px,5vw,80px);
}
.card.tight{justify-content:flex-start;padding-top:clamp(48px,10vh,120px)}
.card-inner{width:100%;max-width:1180px;margin:0 auto;position:relative;z-index:2}
.card-bg{position:absolute;inset:0;z-index:1;pointer-events:none}

/* Reveal helpers */
.r{opacity:0;transform:translateY(40px);transition:opacity 700ms cubic-bezier(.2,.7,.2,1),transform 700ms cubic-bezier(.2,.7,.2,1)}
.r.in{opacity:1;transform:translateY(0)}
.r-l{opacity:0;transform:translateX(-50px);transition:opacity 700ms cubic-bezier(.2,.7,.2,1),transform 700ms cubic-bezier(.2,.7,.2,1)}
.r-l.in{opacity:1;transform:translateX(0)}
.r-s{opacity:0;transform:scale(.9);transition:opacity 600ms cubic-bezier(.2,.7,.2,1),transform 600ms cubic-bezier(.34,1.56,.64,1)}
.r-s.in{opacity:1;transform:scale(1)}
.r-up{opacity:0;transform:translateY(-30px);transition:opacity 600ms cubic-bezier(.2,.7,.2,1),transform 600ms cubic-bezier(.2,.7,.2,1)}
.r-up.in{opacity:1;transform:translateY(0)}

/* COLD OPEN */
.cold-open .title{
  font-family:var(--display);
  font-size:clamp(80px,22vw,260px);
  line-height:.85;
  letter-spacing:-.01em;
  color:#0A0A0A;
  text-align:center;
}
.cold-open .title span{display:block}
.cold-open .sub{
  font-family:var(--body);
  font-weight:700;
  letter-spacing:.3em;
  font-size:clamp(11px,1.6vw,18px);
  text-align:center;
  margin-top:clamp(24px,4vh,48px);
  color:#0A0A0A;
}

/* INTERSTITIAL */
.interstitial{justify-content:center;align-items:center;text-align:center}
.interstitial h2{
  font-family:var(--display);
  font-size:clamp(56px,12vw,160px);
  line-height:.95;
  letter-spacing:-.005em;
  max-width:1000px;
}

/* AWARD CARDS - shared */
.award-tag{
  font-family:var(--body);
  font-weight:800;
  font-size:clamp(10px,1.4vw,13px);
  letter-spacing:.32em;
  text-transform:uppercase;
  opacity:.7;
  margin-bottom:clamp(8px,1.2vh,14px);
}
.award-name{
  font-family:var(--display);
  font-size:clamp(48px,9vw,120px);
  line-height:.92;
  letter-spacing:-.005em;
  margin-bottom:clamp(10px,1.4vh,16px);
}
.award-explain{
  font-family:var(--body);
  font-weight:500;
  font-size:clamp(15px,2.2vw,22px);
  line-height:1.35;
  max-width:660px;
  margin-bottom:clamp(20px,4vh,40px);
  opacity:.85;
}
.recipient{
  font-family:var(--bebas);
  font-size:clamp(28px,4.6vw,52px);
  letter-spacing:.02em;
  line-height:1;
}
.recipient .team{opacity:.55;margin-left:.5em;font-size:.65em}
.closer{
  font-family:var(--body);
  font-weight:500;
  font-size:clamp(14px,2vw,20px);
  line-height:1.4;
  margin-top:clamp(20px,3vh,32px);
  opacity:.75;
  max-width:560px;
}
.hero-number{
  font-family:var(--display);
  font-size:clamp(140px,30vw,340px);
  line-height:.85;
  letter-spacing:-.02em;
}

/* FINAL TABLE */
.final-table{display:grid;gap:clamp(4px,.8vh,10px);width:100%}
.ft-row{
  display:grid;
  grid-template-columns:clamp(48px,7vw,86px) 1fr auto;
  align-items:center;
  gap:clamp(12px,2vw,24px);
  padding:clamp(6px,1.1vh,14px) clamp(10px,1.6vw,18px);
  border-bottom:1px solid rgba(244,241,234,.16);
}
.ft-pos{
  font-family:var(--display);
  font-size:clamp(40px,6.5vw,80px);
  line-height:.9;
  letter-spacing:-.01em;
}
.ft-row.rank-1 .ft-pos{color:var(--green)}
.ft-name{
  font-family:var(--bebas);
  font-size:clamp(18px,2.8vw,32px);
  letter-spacing:.01em;
  line-height:1;
}
.ft-team{
  font-family:var(--body);
  font-weight:500;
  font-size:clamp(11px,1.3vw,14px);
  opacity:.65;
  margin-top:3px;
  letter-spacing:.04em;
}
.ft-stats{text-align:right;font-family:var(--grotesk);font-weight:600}
.ft-wdl{font-size:clamp(10px,1.2vw,13px);opacity:.65;margin-bottom:3px;letter-spacing:.06em}
.ft-pts{font-family:var(--display);font-size:clamp(26px,4vw,44px);line-height:1}
.ft-header{
  display:grid;
  grid-template-columns:clamp(58px,9vw,110px) 1fr auto;
  gap:clamp(12px,2vw,28px);
  padding:0 clamp(12px,2vw,24px) clamp(8px,1.2vh,12px) clamp(12px,2vw,24px);
  border-bottom:2px solid var(--green);
  font-family:var(--body);
  font-weight:700;
  letter-spacing:.18em;
  font-size:clamp(10px,1.3vw,12px);
  text-transform:uppercase;
  opacity:.8;
}
.ft-header > div:last-child{text-align:right}

/* RACE CHART */
.race-wrap{width:100%;height:clamp(360px,60vh,560px);position:relative}
.race-svg{width:100%;height:100%}
.race-caption{
  font-family:var(--body);
  font-weight:500;
  font-size:clamp(14px,1.8vw,18px);
  text-align:center;
  margin-top:clamp(16px,2vh,24px);
  opacity:.75;
}

/* HEADER */
.h-eyebrow{
  font-family:var(--body);
  font-weight:800;
  letter-spacing:.32em;
  font-size:clamp(11px,1.5vw,13px);
  text-transform:uppercase;
  opacity:.7;
  margin-bottom:clamp(14px,2vh,22px);
}
.h-title{
  font-family:var(--display);
  font-size:clamp(48px,8vw,108px);
  line-height:.92;
  letter-spacing:-.005em;
  margin-bottom:clamp(14px,2vh,22px);
}

/* TIMELINE */
.timeline{position:relative;padding:clamp(60px,10vh,100px) 100px clamp(60px,10vh,100px) 100px;min-height:clamp(280px,42vh,420px)}
@media (max-width:720px){
  .timeline{padding-left:0;padding-right:0}
}
.tl-track{
  position:absolute;
  top:50%;
  left:100px;
  right:100px;
  height:4px;
  transform:scaleX(0);
  transform-origin:left;
  transition:transform 800ms cubic-bezier(.2,.7,.2,1);
}
.timeline.in .tl-track{transform:scaleX(1)}
.tl-event{
  position:absolute;
  top:50%;
  transform:translate(-50%,-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  width:160px;
  text-align:center;
}
.tl-dot{
  width:22px;
  height:22px;
  border-radius:50%;
  background:var(--accent,#fff);
  margin:0 auto;
  opacity:0;
  transform:scale(0);
  transition:opacity 300ms,transform 400ms cubic-bezier(.34,1.56,.64,1);
  z-index:2;
}
.tl-event.in .tl-dot{opacity:1;transform:scale(1)}
.tl-label{
  position:absolute;
  width:160px;
  font-family:var(--body);
  font-weight:600;
  font-size:clamp(11px,1.3vw,13px);
  letter-spacing:.02em;
  opacity:0;
  transition:opacity 400ms;
  line-height:1.25;
}
.tl-event.in .tl-label{opacity:1}
.tl-event.above .tl-label{bottom:calc(50% + 24px)}
.tl-event.below .tl-label{top:calc(50% + 24px)}
.tl-gw{
  font-family:var(--display);
  font-size:clamp(15px,1.9vw,20px);
  letter-spacing:.04em;
  display:block;
  margin-bottom:2px;
}
.tl-text{
  font-family:var(--body);
  font-weight:500;
  font-size:clamp(11px,1.3vw,13px);
  opacity:.85;
  display:block;
}

/* MOBILE timeline = vertical */
@media (max-width:720px){
  .timeline{padding:0;min-height:520px}
  .tl-track{height:auto;width:3px;top:0;bottom:0;left:50%;right:auto;transform:scaleY(0);transform-origin:top;transition:transform 800ms cubic-bezier(.2,.7,.2,1)}
  .timeline.in .tl-track{transform:scaleY(1)}
  .tl-event{top:auto;left:50% !important;transform:translateX(-50%);position:absolute;flex-direction:row;align-items:center;width:auto}
  .tl-event.above .tl-label,.tl-event.below .tl-label{position:absolute;top:50%;transform:translateY(-50%);text-align:left;width:160px;bottom:auto}
  .tl-event.above .tl-label{right:calc(50% + 22px);text-align:right}
  .tl-event.below .tl-label{left:calc(50% + 22px);text-align:left}
}

/* TRADE CARD */
.trade-grid{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:clamp(12px,3vw,36px);
  align-items:center;
  margin:clamp(20px,4vh,40px) 0;
}
@media (max-width:720px){
  .trade-grid{grid-template-columns:1fr;gap:24px}
  .trade-grid .arrow{transform:rotate(90deg)}
}
.trade-side{
  padding:clamp(14px,2.5vh,24px) 0;
}
.trade-side-head{
  font-family:var(--body);
  font-weight:800;
  font-size:clamp(10px,1.3vw,12px);
  letter-spacing:.28em;
  text-transform:uppercase;
  opacity:.7;
  margin-bottom:clamp(10px,1.5vh,14px);
}
.trade-mgr{
  font-family:var(--bebas);
  font-size:clamp(20px,3vw,28px);
  letter-spacing:.02em;
  margin-bottom:clamp(12px,2vh,20px);
  opacity:.8;
}
.trade-pl{
  font-family:var(--display);
  font-size:clamp(28px,4.5vw,52px);
  line-height:1;
  margin-bottom:6px;
}
.trade-pts{
  font-family:var(--grotesk);
  font-weight:600;
  font-size:clamp(13px,1.6vw,16px);
  opacity:.7;
  margin-bottom:clamp(8px,1.2vh,14px);
}
.arrow{
  font-family:var(--display);
  font-size:clamp(40px,6vw,80px);
  opacity:.4;
}
.stamp{
  display:inline-block;
  font-family:var(--display);
  font-size:clamp(36px,6.5vw,76px);
  line-height:.9;
  padding:clamp(8px,1.4vh,16px) clamp(16px,2.5vw,28px);
  border:4px solid currentColor;
  letter-spacing:.04em;
  transform:rotate(-3deg) scale(.7);
  opacity:0;
  transition:transform 600ms cubic-bezier(.34,1.56,.64,1),opacity 400ms;
}
.in .stamp{transform:rotate(-3deg) scale(1);opacity:1}

/* MANAGER CARD */
.mgr-card{position:relative;height:100%;display:flex;align-items:center}
.mgr-watermark{
  position:absolute;
  font-family:var(--display);
  font-size:clamp(220px,38vw,520px);
  line-height:.8;
  opacity:.09;
  pointer-events:none;
  letter-spacing:-.03em;
  z-index:1;
}
.mgr-watermark.right{right:-6vw;bottom:-10vh}
.mgr-grid{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:clamp(20px,4vw,56px);
  width:100%;
  align-items:start;
  position:relative;
  z-index:2;
}
@media (max-width:720px){
  .mgr-grid{grid-template-columns:1fr;gap:32px}
  .mgr-watermark{font-size:clamp(200px,60vw,360px);right:-5vw;bottom:-3vh}
}
.mgr-name{
  font-family:var(--display);
  font-size:clamp(60px,12vw,140px);
  line-height:.86;
  letter-spacing:-.01em;
  margin-bottom:clamp(4px,.6vh,8px);
}
.mgr-team{
  font-family:var(--bebas);
  font-size:clamp(22px,3vw,32px);
  letter-spacing:.02em;
  opacity:.7;
  margin-bottom:clamp(14px,2vh,22px);
}
.mgr-verdict{
  font-family:var(--body);
  font-weight:500;
  font-size:clamp(15px,2.2vw,22px);
  line-height:1.4;
  margin-top:clamp(16px,2.5vh,28px);
  padding-top:clamp(16px,2.5vh,28px);
  border-top:1px solid rgba(0,0,0,.15);
  max-width:480px;
}
.stat-list{display:grid;gap:clamp(10px,1.5vh,16px)}
.stat-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline}
.stat-lbl{
  font-family:var(--body);
  font-weight:600;
  font-size:clamp(11px,1.4vw,13px);
  letter-spacing:.18em;
  text-transform:uppercase;
  opacity:.7;
}
.stat-val{
  font-family:var(--bebas);
  font-size:clamp(18px,2.4vw,26px);
  letter-spacing:.01em;
  text-align:right;
}
.stat-val .small{display:block;font-family:var(--body);font-weight:500;font-size:.55em;opacity:.65;letter-spacing:.04em;margin-top:2px;line-height:1.2}

/* COUNTERFACTUAL */
.cf-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,3vw,40px);margin-top:clamp(20px,3vh,32px)}
@media (max-width:720px){.cf-grid{grid-template-columns:1fr}}
.cf-tbl{font-family:var(--grotesk);font-weight:600;font-size:clamp(13px,1.8vw,17px)}
.cf-tbl-head{
  font-family:var(--body);
  font-weight:800;
  font-size:clamp(10px,1.2vw,12px);
  letter-spacing:.24em;
  text-transform:uppercase;
  opacity:.7;
  margin-bottom:clamp(8px,1.2vh,14px);
  padding-bottom:8px;
  border-bottom:2px solid currentColor;
}
.cf-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:clamp(8px,1.5vw,16px);align-items:center;padding:clamp(8px,1.2vh,12px) 0;border-bottom:1px solid rgba(255,255,255,.08)}
.cf-rank{font-family:var(--display);font-size:clamp(22px,3vw,28px);line-height:1;width:clamp(28px,3.5vw,40px)}
.cf-name{font-family:var(--bebas);font-size:clamp(15px,1.9vw,19px);letter-spacing:.02em}
.cf-wdl{opacity:.6;font-size:.85em}
.cf-pts{font-family:var(--display);font-size:clamp(20px,2.8vw,28px)}
.cf-arrow{font-family:var(--body);font-weight:800;font-size:clamp(12px,1.6vw,15px);width:24px}
.cf-arrow.up{color:var(--green)}
.cf-arrow.dn{color:#FF6B6B}
.cf-arrow.eq{opacity:.4}

/* STORIES OF THE SEASON */
.story-card{padding-top:clamp(60px,12vh,140px) !important;justify-content:flex-start !important}
.story-grid{
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:clamp(24px,4vw,56px);
  align-items:start;
  margin-top:clamp(16px,2vh,28px);
}
@media (max-width:720px){.story-grid{grid-template-columns:1fr}}
.story-title{
  font-family:var(--display);
  font-size:clamp(40px,7vw,84px);
  line-height:.92;
  letter-spacing:-.005em;
  margin-bottom:clamp(8px,1.2vh,14px);
}
.story-tag{
  font-family:var(--body);
  font-weight:700;
  font-size:clamp(11px,1.4vw,13px);
  letter-spacing:.18em;
  text-transform:uppercase;
  opacity:.6;
  margin-bottom:clamp(20px,3vh,32px);
}
.story-prose p{
  font-family:var(--body);
  font-weight:400;
  font-size:clamp(16px,2.2vw,22px);
  line-height:1.5;
  margin-bottom:1em;
  max-width:540px;
}
.story-prose p:last-child{margin-bottom:0}

/* SPARKLINE */
.sparkline{width:100%;height:clamp(120px,22vh,200px)}

/* AGGREGATE STATS */
.agg-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:clamp(20px,3vw,40px);
  margin-top:clamp(20px,4vh,40px);
}
.agg-cell{padding:clamp(14px,2vh,22px) 0}
.agg-val{
  font-family:var(--display);
  font-size:clamp(56px,10vw,120px);
  line-height:.88;
  margin-bottom:8px;
  letter-spacing:-.01em;
}
.agg-lbl{
  font-family:var(--body);
  font-weight:600;
  font-size:clamp(11px,1.3vw,13px);
  letter-spacing:.2em;
  text-transform:uppercase;
  opacity:.7;
}

/* PHANTOM XI HERO */
.xi-pitch{
  display:grid;
  grid-template-rows:repeat(4,auto);
  gap:clamp(10px,1.5vh,18px);
  width:100%;
  max-width:560px;
}
.xi-row{display:flex;justify-content:center;gap:clamp(8px,1.5vw,16px);flex-wrap:wrap}
.xi-player{
  font-family:var(--bebas);
  font-size:clamp(13px,1.6vw,18px);
  letter-spacing:.02em;
  padding:clamp(6px,1vh,10px) clamp(10px,1.5vw,14px);
  border:2px solid currentColor;
  border-radius:8px;
  background:rgba(255,255,255,.06);
  position:relative;
}
.xi-player.zero{
  text-decoration:line-through;
  text-decoration-thickness:3px;
  opacity:.5;
  transition:opacity 400ms;
}

/* SWAP DIAGRAM (Hot Potato) */
.hp-graph{
  position:relative;
  width:100%;
  aspect-ratio:1.4 / 1;
  margin:clamp(20px,4vh,40px) 0 0;
  max-width:600px;
}
.hp-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(40px,6vw,72px);text-align:center;line-height:.9}
.hp-mgr{position:absolute;font-family:var(--bebas);font-size:clamp(14px,1.8vw,18px);letter-spacing:.02em}

/* REVOLVING DOOR LIST */
.rev-list{display:grid;gap:clamp(10px,1.6vh,18px);margin-top:clamp(16px,2vh,28px)}
.rev-row{display:grid;grid-template-columns:auto 1fr auto;gap:clamp(12px,2vw,20px);align-items:baseline;padding:clamp(8px,1.2vh,14px) 0;border-bottom:1px solid rgba(255,255,255,.12)}
.rev-name{font-family:var(--display);font-size:clamp(28px,4.5vw,52px);line-height:1;letter-spacing:-.005em}
.rev-team{font-family:var(--body);font-weight:600;font-size:clamp(11px,1.3vw,13px);letter-spacing:.16em;text-transform:uppercase;opacity:.55}
.rev-count{font-family:var(--display);font-size:clamp(32px,5vw,60px);line-height:1;color:currentColor}
.rev-count .x{font-size:.5em;opacity:.6;margin-left:.1em}

/* BEATING / SCOREBOARD */
.scoreboard{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:clamp(8px,2vw,28px);
  margin:clamp(20px,3vh,40px) 0;
  width:100%;
}
.sb-side{text-align:center}
.sb-mgr{
  font-family:var(--bebas);
  font-size:clamp(28px,4.5vw,48px);
  letter-spacing:.02em;
  margin-bottom:clamp(4px,1vh,8px);
}
.sb-score{
  font-family:var(--display);
  font-size:clamp(80px,15vw,200px);
  line-height:.88;
  letter-spacing:-.02em;
}
.sb-dash{font-family:var(--display);font-size:clamp(60px,10vw,140px);opacity:.4}

/* CLOSING */
.closing{justify-content:center;text-align:center}
.closing .one-last{font-family:var(--body);font-weight:800;font-size:clamp(11px,1.5vw,13px);letter-spacing:.36em;opacity:.6;margin-bottom:clamp(32px,5vh,56px)}
.closing .fact{font-family:var(--display);font-size:clamp(40px,7.5vw,96px);line-height:1;letter-spacing:-.005em;max-width:900px;margin:0 auto;text-align:center}

<body>
<div id="loading">LOADING…</div>
<main id="deck"></main>

<script>
// ============================================================
// CRAIG CUP — End of Season 2025/26
// ============================================================

const MANAGER_COLOURS = {
  '76213': 'var(--purple)',  // Peter
  '76238': 'var(--orange)',  // Michael
  '76250': 'var(--lime)',    // Christopher
  '76218': 'var(--pink)',    // Steven
  '76178': 'var(--cyan)',    // Mark
  '76226': 'var(--yellow)',  // Geraint
};
const MANAGER_HEX = {
  '76213': '#6A1B9A',
  '76238': '#FF6F00',
  '76250': '#C6FF00',
  '76218': '#FF1493',
  '76178': '#00BCD4',
  '76226': '#FFEB3B',
};

let DATA = null;
const cards = [];

function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function mgr(eid){ return DATA.managers[String(eid)]; }
function mgrFull(eid){ const m = mgr(eid); return m.first_name + ' · ' + m.team_name; }
function mgrShort(eid){
  const fn = mgr(eid).first_name;
  // Normalise lowercase "christopher" to capitalised
  return fn.charAt(0).toUpperCase() + fn.slice(1);
}
function teamEmoji(eid){
  const m = mgr(eid);
  return m.team_name;
}
function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ============================================================
// ANIMATION SYSTEM
// ============================================================
function countUp(el, target, duration=2500, easeFn){
  const start = performance.now();
  const isFloat = String(target).includes('.');
  const decimals = isFloat ? 1 : 0;
  const targetNum = parseFloat(target);
  function frame(t){
    const elapsed = t - start;
    const p = Math.min(1, elapsed / duration);
    // ease-out cubic
    const e = easeFn ? easeFn(p) : (1 - Math.pow(1 - p, 3));
    const v = targetNum * e;
    el.textContent = isFloat ? v.toFixed(decimals) : Math.floor(v);
    if (p < 1) requestAnimationFrame(frame);
    else el.textContent = isFloat ? targetNum.toFixed(decimals) : targetNum;
  }
  requestAnimationFrame(frame);
}

function delay(ms){ return new Promise(r => setTimeout(r, ms)); }

function reveal(node, classToAdd='in'){
  node.classList.add(classToAdd);
}

// ============================================================
// CARD BUILDERS
// ============================================================

// ---------- 1. COLD OPEN ----------
function buildColdOpen(){
  const c = el('section', 'card cold-open');
  c.style.background = 'linear-gradient(135deg, var(--pink) 0%, var(--orange) 100%)';
  c.innerHTML = `
    <div class="card-inner" style="text-align:center">
      <h1 class="title">
        <span class="r" data-w1>CRAIG</span>
        <span class="r" data-w2>CUP</span>
      </h1>
      <p class="sub r" data-sub>END OF SEASON 2025/26</p>
    </div>`;
  c._animate = async () => {
    await delay(120);
    reveal(c.querySelector('[data-w1]'));
    await delay(420);
    reveal(c.querySelector('[data-w2]'));
    await delay(620);
    reveal(c.querySelector('[data-sub]'));
  };
  return c;
}

// ---------- INTERSTITIAL ----------
function buildInterstitial(text, opts={}){
  const c = el('section', 'card interstitial');
  c.style.background = opts.bg || 'var(--black)';
  c.style.color = opts.fg || 'var(--offwhite)';
  c.innerHTML = `<div class="card-inner"><h2 class="r">${text}</h2></div>`;
  c._animate = async () => {
    await delay(80);
    reveal(c.querySelector('h2'));
  };
  return c;
}

// ---------- 3. FINAL TABLE ----------
function buildFinalTable(){
  const c = el('section', 'card tight');
  c.style.background = 'var(--black)';
  const rows = DATA.final_order.map((eid,i) => {
    const m = mgr(eid);
    return `
      <div class="ft-row rank-${i+1} r-l" data-row="${i}">
        <div class="ft-pos" data-pos="${i+1}">0</div>
        <div>
          <div class="ft-name">${escapeHTML(m.first_name.toUpperCase())} ${escapeHTML((m.last_name || '').toUpperCase())}</div>
          <div class="ft-team">${escapeHTML(m.team_name)}</div>
        </div>
        <div class="ft-stats">
          <div class="ft-wdl">${m.w}W &nbsp;${m.d}D &nbsp;${m.l}L &nbsp; • &nbsp; PF ${m.pf}</div>
          <div class="ft-pts" data-pts="${m.pts}">0</div>
        </div>
      </div>`;
  }).join('');
  c.innerHTML = `
    <div class="card-inner">
      <div class="h-eyebrow r">FINAL STANDINGS · 37 GWs PLAYED</div>
      <h2 class="h-title r" style="color:var(--green)">THE TABLE.</h2>
      <div class="ft-header">
        <div>POS</div><div>MANAGER</div><div>PTS</div>
      </div>
      <div class="final-table">${rows}</div>
    </div>`;
  c._animate = async () => {
    await delay(80);
    reveal(c.querySelector('.h-eyebrow'));
    await delay(120);
    reveal(c.querySelector('.h-title'));
    await delay(220);
    const rs = c.querySelectorAll('[data-row]');
    rs.forEach((r,i) => {
      setTimeout(() => {
        reveal(r);
        const pos = r.querySelector('[data-pos]');
        const pts = r.querySelector('[data-pts]');
        countUp(pos, parseInt(pos.dataset.pos), 600);
        countUp(pts, parseInt(pts.dataset.pts), 900);
      }, i * 150);
    });
  };
  return c;
}

// ---------- 5. RACE CHART ----------
function buildRace(){
  const c = el('section', 'card tight');
  c.style.background = 'var(--black)';
  const W = 1100, H = 460, PAD = 80, PADR = 200, PADT = 40, PADB = 60;
  const gws = DATA.last_gw;
  const order = DATA.final_order; // 1st to 6th
  // But spec says draw Peter first, then up... reverse
  const drawOrder = ['76213','76238','76250','76218','76178','76226']; // Peter -> Geraint

  const xStep = (W - PAD - PADR) / (gws - 1);
  const yStep = (H - PADT - PADB) / 5; // 6 ranks

  function rankToY(r){ return PADT + (r-1) * yStep; }

  const lines = drawOrder.map((eid, idx) => {
    const m = mgr(eid);
    const pts = [];
    for (let i = 0; i < m.position_history.length; i++){
      const rank = m.position_history[i];
      const x = PAD + i * xStep;
      const y = rankToY(rank);
      pts.push(`${x},${y}`);
    }
    return {eid, idx, path: 'M ' + pts.join(' L '), endX: PAD + (gws-1) * xStep, endY: rankToY(m.position_history[gws-1])};
  });

  c.innerHTML = `
    <div class="card-inner">
      <div class="h-eyebrow r">THE SEASON RACE</div>
      <h2 class="h-title r">HOW IT MOVED.</h2>
      <div class="race-wrap r">
        <svg class="race-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
          <g class="race-grid">
            ${[1,2,3,4,5,6].map(r => `<line x1="${PAD}" y1="${rankToY(r)}" x2="${W-PADR}" y2="${rankToY(r)}" stroke="rgba(244,241,234,.08)" stroke-width="1"/><text x="${PAD-12}" y="${rankToY(r)+4}" font-family="var(--body)" font-size="12" fill="rgba(244,241,234,.5)" text-anchor="end" font-weight="700">${r}</text>`).join('')}
            <text x="${PAD}" y="${H-PADB+24}" font-family="var(--body)" font-size="11" fill="rgba(244,241,234,.5)" font-weight="700" letter-spacing="2">GW1</text>
            <text x="${W-PADR}" y="${H-PADB+24}" font-family="var(--body)" font-size="11" fill="rgba(244,241,234,.5)" font-weight="700" letter-spacing="2" text-anchor="end">GW${gws}</text>
          </g>
          ${lines.map(l => `
            <path d="${l.path}" stroke="${MANAGER_HEX[l.eid]}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" class="race-line" data-eid="${l.eid}" opacity="0"/>
            <text x="${l.endX+10}" y="${l.endY+5}" font-family="var(--bebas)" font-size="20" fill="${MANAGER_HEX[l.eid]}" class="race-label" data-eid="${l.eid}" opacity="0" letter-spacing="1">${mgrShort(l.eid).toUpperCase()}</text>
          `).join('')}
        </svg>
      </div>
      <p class="race-caption r" data-cap>Geraint led for 33 of 37 gameweeks. Mark briefly led four times. After GW16 the leadership was set.</p>
    </div>`;

  c._animate = async () => {
    await delay(80);
    reveal(c.querySelector('.h-eyebrow'));
    await delay(120);
    reveal(c.querySelector('.h-title'));
    await delay(160);
    reveal(c.querySelector('.race-wrap'));
    await delay(400);

    // Prep: compute lengths, hide every line via dashoffset = length
    const lineEls = lines.map(l => c.querySelector(`.race-line[data-eid="${l.eid}"]`));
    const labelEls = lines.map(l => c.querySelector(`.race-label[data-eid="${l.eid}"]`));
    const lengths = lineEls.map(el => el.getTotalLength());
    lineEls.forEach((el, i) => {
      el.style.transition = 'none';
      el.style.strokeDasharray = lengths[i] + ' ' + lengths[i];
      el.style.strokeDashoffset = lengths[i];
      el.style.opacity = '1';
    });
    // Force layout so the hidden state commits before we re-enable transitions
    void c.querySelector('svg').getBoundingClientRect();
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    // Sequential draw
    const DRAW_MS = 750;
    for (let i = 0; i < lines.length; i++){
      const line = lineEls[i];
      const label = labelEls[i];

      // Emphasis: bring up stroke width + draw the line
      line.style.transition = `stroke-dashoffset ${DRAW_MS}ms cubic-bezier(.4,.2,.2,1), stroke-width 200ms ease, opacity 200ms ease`;
      line.setAttribute('stroke-width', '6');
      // trigger reflow before changing offset
      void line.getBoundingClientRect();
      line.style.strokeDashoffset = '0';

      await delay(DRAW_MS - 100);

      // Settle this line (fade behind)
      line.style.transition = 'stroke-width 350ms ease, opacity 350ms ease';
      line.setAttribute('stroke-width', '2.5');
      line.style.opacity = '.35';

      // Reveal label
      label.style.transition = 'opacity 300ms ease';
      label.style.opacity = '1';

      await delay(120);
    }

    // Final settle — every line back to uniform contrast
    lineEls.forEach(el => {
      el.style.transition = 'opacity 500ms ease, stroke-width 500ms ease';
      el.setAttribute('stroke-width', '3.5');
      el.style.opacity = '.92';
    });
    await delay(600);
    reveal(c.querySelector('[data-cap]'));
  };
  return c;
}

// ---------- 6a/6b. TIMELINE ----------
function buildTimeline(label, events, opts={}){
  const c = el('section', 'card tight');
  c.style.background = opts.bg || 'var(--offwhite)';
  c.style.color = opts.fg || 'var(--black)';

  // Spread events along GW1-37 (or 0-1 normalized)
  const minGW = 1, maxGW = DATA.last_gw;
  const isDark = opts.bg === 'var(--black)' || opts.bg === '#0A0A0A';
  const trackBg = isDark ? 'rgba(244,241,234,.25)' : 'rgba(10,10,10,.22)';
  const eventHTML = events.map((e,i) => {
    const x = ((e.gw - minGW) / (maxGW - minGW)) * 100;
    const pos = i % 2 === 0 ? 'above' : 'below';
    return `
      <div class="tl-event r-s ${pos}" data-i="${i}" style="left:${x}%">
        <div class="tl-dot" style="background:${opts.accent||'#FF1493'}"></div>
        <div class="tl-label">
          <span class="tl-gw" style="color:${opts.accent||'#FF1493'}">GW${e.gw}</span>
          <span class="tl-text">${escapeHTML(e.label)}</span>
        </div>
      </div>`;
  }).join('');

  c.innerHTML = `
    <div class="card-inner">
      <div class="h-eyebrow r" style="color:${opts.accent||'#000'}">${label}</div>
      <h2 class="h-title r">${opts.title || ''}</h2>
      <div class="timeline">
        <div class="tl-track" style="background:${trackBg}"></div>
        ${eventHTML}
      </div>
      ${opts.caption ? `<p class="closer r" data-cap>${opts.caption}</p>` : ''}
    </div>`;
  // Note: tl-track needs class .in on parent to animate
  c._animate = async () => {
    await delay(80);
    reveal(c.querySelector('.h-eyebrow'));
    reveal(c.querySelector('.h-title'));
    await delay(200);
    c.querySelector('.timeline').classList.add('in');
    await delay(600);
    const evs = c.querySelectorAll('.tl-event');
    evs.forEach((e,i) => setTimeout(() => reveal(e), i * 220));
    if (opts.caption){
      await delay(evs.length * 220 + 400);
      reveal(c.querySelector('[data-cap]'));
    }
  };
  return c;
}

// ---------- 8. GERAINT TITLE NARRATIVE ----------
function buildHandsOff(){
  const c = el('section', 'card');
  c.style.background = 'var(--green)';
  c.style.color = '#0A0A0A';
  const geraint = mgr('76226');
  const tx = geraint.tx_count;
  const pts = geraint.pts;
  const margin = DATA.title_margin;

  c.innerHTML = `
    <div class="card-inner">
      <div class="award-tag r">HEADLINE</div>
      <h2 class="award-name r">THE HANDS-OFF CHAMPION.</h2>
      <p class="award-explain r">Geraint won the league with the second-fewest transactions in the field. Then panicked anyway.</p>
      <div class="tri-stats">
        <div class="tri-stat r">
          <div class="tri-num" data-num="${tx}">0</div>
          <div class="tri-lbl">Transactions all season</div>
        </div>
        <div class="tri-stat r">
          <div class="tri-num" data-num="${pts}">0</div>
          <div class="tri-lbl">League points</div>
        </div>
        <div class="tri-stat r">
          <div class="tri-num" data-num="${margin}" data-prefix="+">0</div>
          <div class="tri-lbl">Margin over 2nd</div>
        </div>
      </div>
      <p class="closer r" data-c>Geraint barely looked at his team. Then made nine transactions in three weeks during the title run-in, with the league already won.</p>
    </div>`;
  c._animate = async () => {
    await delay(80);
    reveal(c.querySelector('.award-tag'));
    await delay(150);
    reveal(c.querySelector('.award-name'));
    await delay(200);
    reveal(c.querySelector('.award-explain'));
    await delay(300);
    const tris = c.querySelectorAll('.tri-stat');
    tris.forEach((t,i) => setTimeout(() => {
      reveal(t);
      const numEl = t.querySelector('[data-num]');
      const prefix = numEl.dataset.prefix || '';
      const target = parseInt(numEl.dataset.num);
      const start = performance.now();
      const dur = 1400;
      function frame(now){
        const p = Math.min(1, (now-start)/dur);
        const e = 1 - Math.pow(1-p, 3);
        numEl.textContent = prefix + Math.floor(target*e);
        if (p < 1) requestAnimationFrame(frame);
        else numEl.textContent = prefix + target;
      }
      requestAnimationFrame(frame);
    }, i * 600));
    await delay(tris.length * 600 + 800);
    reveal(c.querySelector('[data-c]'));
  };
  return c;
}

// ---------- 10-12. TRADE CARDS ----------
function buildTrade(trade, index){
  const c = el('section', 'card');
  const colours = ['var(--cyan)', 'var(--orange)', 'var(--pink)'];
  const fgs = ['#0A0A0A', '#0A0A0A', '#F4F1EA'];
  c.style.background = colours[index];
  c.style.color = fgs[index];

  // Verdict closers per spec example
  let closer = '';
  const off = mgrShort(trade.offered_entry);
  const rec = mgrShort(trade.received_entry);
  if (trade.verdict === 'MUCH ADO ABOUT NOTHING'){
    const offNames = trade.offered_gain.map(x => x.name).join(', ');
    const recNames = trade.received_gain.map(x => x.name).join(', ');
    closer = `${off} took ${offNames} off ${rec} for ${recNames} that never landed. Neither of them benefited.`;
  } else if (trade.verdict === 'WIN'){
    const winner = trade.offered_total > trade.received_total ? off : rec;
    const loser = trade.offered_total > trade.received_total ? rec : off;
    const winnerPts = Math.max(trade.offered_total, trade.received_total);
    const loserPts = Math.min(trade.offered_total, trade.received_total);
    closer = `${winner} edges ${loser} by ${winnerPts - loserPts} tenure-adjusted points. Both sides got something real.`;
  } else if (trade.verdict === 'NEITHER BENEFITED'){
    const winner = trade.offered_total > trade.received_total ? off : rec;
    closer = `${winner} got the bigger half of a trade that barely mattered. The other half got nothing.`;
  } else if (trade.verdict === 'FAIR'){
    closer = `A fair swap. Both sides walked away with similar value.`;
  } else if (trade.verdict === 'STEAL'){
    closer = `One-sided. The points told the story.`;
  } else {
    closer = `Both sides got something.`;
  }

  c.innerHTML = `
    <div class="card-inner">
      <div class="award-tag r">TRADE ${index+1} OF 3 · GW${trade.gw}</div>
      <h2 class="award-name r" style="font-size:clamp(36px,7vw,84px)">${off.toUpperCase()} &times; ${rec.toUpperCase()}</h2>
      <p class="award-explain r">Tenure-adjusted points = scored only during each side's ownership of the player.</p>
      <div class="trade-grid">
        <div class="trade-side r-l" data-side="offered">
          <div class="trade-side-head">${off} got</div>
          ${trade.offered_gain.map(g => `
            <div class="trade-pl">${escapeHTML(g.name)}</div>
            <div class="trade-pts">+${g.pts} pts · ${g.gws_held} GWs held</div>

    // slow counter — ~250ms per number = 250 * count ms
    const counterEl = c.querySelector('[data-counter]');
    const dur = Math.max(2500, 250 * count);
    const start = performance.now();
    function frame(now){
      const t = Math.min(1, (now-start)/dur);
      const e = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
      counterEl.textContent = Math.floor(count*e);
      if (t < 1) requestAnimationFrame(frame); else counterEl.textContent = count;
    }
    requestAnimationFrame(frame);
    await delay(dur + 200);
    reveal(c.querySelector('[data-c]'));
  };
  return c;
}

// THE CLIFF (Dewsbury-Hall)
function buildCliff(){
  const c = el('section', 'card');
  c.style.background = '#0A0A0A';
  c.style.color = '#F4F1EA';
  // Find Dewsbury-Hall data
  const dPid = DATA.dewsbury_pid;
  const pts = DATA.player_pts_by_gw[String(dPid)] || {};
  const signGW = 16;
  const W = 600, H = 220, PAD = 40;
  const gws = DATA.last_gw;
  const xs = i => PAD + (i/(gws-1)) * (W - PAD*2);
  const maxPt = Math.max(15, ...Object.values(pts));
  const ys = v => H - PAD - (v/maxPt) * (H - PAD*2);
  let pathPts = [];
  for (let i = 1; i <= gws; i++){
    const v = pts[String(i)] || 0;
    pathPts.push(`${xs(i-1)},${ys(v)}`);
  }

  c.innerHTML = `
    <div class="card-inner">
      <div class="award-tag r">MICRO-STORY AWARD</div>
      <h2 class="award-name r">THE CLIFF.</h2>

      <div style="font-family:var(--display);font-size:clamp(36px,6vw,68px);margin-top:clamp(12px,2vh,18px)" class="r" data-pl>KIERAN DEWSBURY-HALL</div>
      <div class="cliff-wrap">
        <svg class="cliff-svg" viewBox="0 0 ${W} ${H}">
          <line x1="${PAD}" y1="${H-PAD}" x2="${W-PAD}" y2="${H-PAD}" stroke="rgba(244,241,234,.2)" stroke-width="1"/>
          <line x1="${xs(signGW-1)}" y1="${PAD/2}" x2="${xs(signGW-1)}" y2="${H-PAD}" stroke="#FF1493" stroke-width="2" stroke-dasharray="4,4" opacity=".7"/>
          <text x="${xs(signGW-1)}" y="${PAD/2-4}" font-family="var(--body)" font-weight="700" font-size="11" fill="#FF1493" text-anchor="middle">SIGNED GW${signGW}</text>
          <path class="cliff-path" d="M ${pathPts.join(' L ')}" stroke="var(--cyan)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
        </svg>
      </div>
      <p class="closer r" data-c>Four weeks before: 9.8 pts per game. Four weeks after: 0.2.</p>
    </div>`;
  c._animate = async () => {
    await delay(80);
    reveal(c.querySelector('.award-tag'));
    await delay(180);
    reveal(c.querySelector('.award-name'));
    await delay(200);
    reveal(c.querySelector('.award-explain'));
    await delay(280);
    reveal(c.querySelector('[data-r]'));
    await delay(200);
    reveal(c.querySelector('[data-pl]'));
    await delay(500);
    const path = c.querySelector('.cliff-path');
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.style.transition = 'stroke-dashoffset 2200ms cubic-bezier(.4,.2,.2,1)';
    path.style.opacity = '1';
    void path.getBoundingClientRect();
    path.style.strokeDashoffset = '0';
    await delay(2400);
    reveal(c.querySelector('[data-c]'));
  };
  return c;
}

// Helper: small sparkline of W/L
function wlSparkline(eid, highlights){
  const m = mgr(eid);
  const W = 360, H = 70, gws = DATA.last_gw;
  const xStep = W / gws;
  let bars = '';
  for (let i = 0; i < m.h2h.length; i++){
    const h = m.h2h[i];
    const myH = h.my_score; const opH = h.opp_score;
    const baseH = Math.max(myH, opH);
    const myY = H/2 - (myH/baseH)*(H/2-4);
    let col = h.result === 'W' ? '#00C853' : (h.result === 'L' ? '#FF1493' : '#FFEB3B');
    let height = h.result === 'W' ? 20 : (h.result === 'L' ? 20 : 10);
    let opacity = 0.95;
    // Highlight runs
    if (highlights){
      const inHL = highlights.some(hl => h.gw >= hl[0] && h.gw <= hl[1]);
      if (!inHL) opacity = 0.25;
    }
    bars += `<rect x="${i*xStep}" y="${h.result==='W'?H/2-height:H/2}" width="${xStep-2}" height="${height}" fill="${col}" opacity="${opacity}"/>`;
  }
  // Highlight ranges as background bars
  let hlBg = '';
  if (highlights){
    highlights.forEach(hl => {
      const x = (hl[0]-1) * xStep;
      const w = (hl[1]-hl[0]+1) * xStep;
      hlBg += `<rect x="${x}" y="0" width="${w}" height="${H}" fill="rgba(0,0,0,.06)"/>`;
    });
  }
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:480px">
      ${hlBg}
      <line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
      ${bars}
    </svg>
    <div style="font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-top:8px">GW1 → GW${gws} · WINS ABOVE, LOSSES BELOW</div>
  `;
}

// Player points line chart
function pointsLine(pid, signGWs){
  const pts = DATA.player_pts_by_gw[String(pid)] || {};
  const W = 420, H = 160, PAD = 24;
  const gws = DATA.last_gw;
  const maxV = Math.max(15, ...Object.values(pts));
  const xs = i => PAD + (i/(gws-1)) * (W - PAD*2);
  const ys = v => H - PAD - (v/maxV) * (H - PAD*2);
  let pathPts = [];
  for (let i = 1; i <= gws; i++){
    const v = pts[String(i)] || 0;
    pathPts.push(`${xs(i-1)},${ys(v)}`);
  }
  let signLines = (signGWs||[]).map(g => `<line x1="${xs(g-1)}" y1="${PAD/2}" x2="${xs(g-1)}" y2="${H-PAD}" stroke="#FF1493" stroke-width="2" stroke-dasharray="3,3" opacity=".7"/><text x="${xs(g-1)}" y="${PAD/2-2}" font-family="var(--body)" font-weight="700" font-size="10" fill="#FF1493" text-anchor="middle">GW${g}</text>`).join('');
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:500px">
      <line x1="${PAD}" y1="${H-PAD}" x2="${W-PAD}" y2="${H-PAD}" stroke="rgba(0,0,0,.2)" stroke-width="1"/>
      ${signLines}
      <path class="story-line" d="M ${pathPts.join(' L ')}" stroke="#0A0A0A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  `;
}

// Lacroix/Mukiele timeline
function signingTimeline(history){
  const gws = DATA.last_gw;
  const W = 480, H = 110;
  let evs = '';
  history.forEach((h, i) => {
    const x = ((h.gw - 1)/(gws-1)) * (W - 40) + 20;
    const eid = h.to || h.from;
    const col = MANAGER_HEX[String(eid)] || '#0A0A0A';
    const sym = h.kind === 'sign' || h.kind === 'draft' || h.kind === 'trade-in' ? '+' : '–';
    const isPos = sym === '+';
    const y = isPos ? 40 : 80;
    evs += `<line x1="${x}" y1="${y}" x2="${x}" y2="55" stroke="${col}" stroke-width="2" opacity=".4"/>`;
    evs += `<circle cx="${x}" cy="${y}" r="11" fill="${col}"/>`;
    evs += `<text x="${x}" y="${y+4}" font-family="var(--display)" font-size="13" fill="#0A0A0A" text-anchor="middle">${sym}</text>`;
    evs += `<text x="${x}" y="${y + (isPos?-16:24)}" font-family="var(--body)" font-weight="700" font-size="9" fill="${col}" text-anchor="middle">GW${h.gw}</text>`;
  });
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:520px">
      <line x1="20" y1="55" x2="${W-20}" y2="55" stroke="rgba(0,0,0,.25)" stroke-width="2"/>
      ${evs}
    </svg>
  `;
}

// Bar chart of squad changes per gw (Michael)
function barChart(data, accent){
  const gws = DATA.last_gw;
  const W = 460, H = 160;
  const xStep = (W - 40) / gws;
  const maxV = Math.max(...Object.values(data), 1);
  let bars = '';
  for (let g = 1; g <= gws; g++){
    const v = data[String(g)] || 0;
    const h = (v/maxV) * (H - 40);
    bars += `<rect x="${20 + (g-1)*xStep}" y="${H - 20 - h}" width="${xStep-2}" height="${h}" fill="${accent||'#0A0A0A'}"/>`;
  }
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:520px">
      <line x1="20" y1="${H-20}" x2="${W-20}" y2="${H-20}" stroke="rgba(0,0,0,.2)" stroke-width="1"/>
      ${bars}
    </svg>
  `;
}

// Position #1 stacked bar
function weeksAtOneChart(){
  const data = DATA.weeks_at_one;
  const W = 460, H = 140;
  const entries = Object.keys(data).sort((a,b) => data[b] - data[a]);
  const maxV = Math.max(...Object.values(data));
  const barH = 28;
  let bars = '';
  entries.forEach((eid, i) => {
    const w = (data[eid]/maxV) * (W - 130);
    bars += `<rect x="120" y="${i*36+10}" width="${w}" height="${barH}" fill="${MANAGER_HEX[eid]}"/>`;
    bars += `<text x="115" y="${i*36+10+barH-8}" font-family="var(--bebas)" font-size="15" fill="#0A0A0A" text-anchor="end">${mgrShort(eid).toUpperCase()}</text>`;
    bars += `<text x="${130+w}" y="${i*36+10+barH-8}" font-family="var(--display)" font-size="18" fill="#0A0A0A">${data[eid]}</text>`;
  });
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:500px">
      ${bars}
    </svg>
  `;
}

    ],

  }));

  // Story 9: Twenty Wins, Two Draws
  list.push(buildStory({
    bg: '#0A0A0A', fg: '#F4F1EA', accent: 'var(--cyan)',

    prose: [
      'Mark and Steven won exactly the same number of H2H matches — 20 each. Identical W column.',

    visual: `<div style="display:grid;grid-template-columns:1fr;gap:24px;max-width:280px">

      <div>${wdlGrid('76218', 'Steven — 20W · 0D · 17L')}</div>

  }));

  // Story 10: Mukiele Migration
  list.push(buildStory({

    tag: 'MICHAEL → CHRISTOPHER → GERAINT → MARK',

    prose: [
      'Nordi Mukiele was signed by four different managers across the season. Michael first, then Christopher, then Geraint, then Mark.',
      'Less of a hot potato than Lacroix, more of a regifted Christmas present. Four signings, four theories about Sunderland\'s defence.',
    ],
    visual: signingTimeline(DATA.mukiele_history),

  // 47.
  list.push(buildInterstitial('BY THE NUMBERS.', {bg:'var(--lime)', fg:'#0A0A0A'}));

  // 49.

  list.forEach(card => {
    deck.appendChild(card);
    cards.push(card);
  });
}

// ============================================================
// INTERSECTION OBSERVER
// ============================================================
function setupObserver(){
  const fired = new WeakSet();
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && entry.intersectionRatio > 0.3 && !fired.has(entry.target)){
        fired.add(entry.target);
        if (entry.target._animate){
          entry.target._animate();
        } else {
          // Default: reveal all .r elements
          entry.target.querySelectorAll('.r, .r-l, .r-s, .r-up').forEach((e, i) => {
            setTimeout(() => e.classList.add('in'), i*100);
          });
        }
      }
    });
  }, {threshold: [0.3, 0.5]});
  cards.forEach(c => obs.observe(c));
}

// ============================================================
// BOOT
// ============================================================
async function boot(){
  try {
    const resp = await fetch('./data/computed.json');
    DATA = await resp.json();
  } catch(e){
    document.getElementById('loading').textContent = 'LOAD FAILED';
    console.error(e);
    return;
  }
  buildDeck();
  setupObserver();
  await delay(200);
  document.getElementById('loading').classList.add('hidden');
}

boot();

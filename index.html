<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Craig Cup — End of Season 2025/26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;600;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0A0A0A; --off:#F4F1EA;
  --yellow:#FFEB3B; --lime:#C6FF00;
  --pink:#FF1493; --purple:#6A1B9A;
  --orange:#FF6F00; --cyan:#00BCD4;
  --green:#00C853;
  --gold:#FFD400;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--black);color:var(--off);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif}
.deck{height:100vh;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none;}
.deck::-webkit-scrollbar{display:none}
.card{height:100vh;height:100dvh;width:100vw;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;padding:24px;isolation:isolate}
/* Light sweep across each card on enter — adapts to bg via blend mode */
.card::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;
  background:linear-gradient(105deg, transparent 38%, rgba(255,255,255,.35) 50%, transparent 62%);
  transform:translateX(-110%);
  mix-blend-mode:overlay;
  will-change:transform,opacity;
}
.card.in-view::after{animation:cardShine 1.6s cubic-bezier(.22,.8,.32,1) .2s forwards}
@keyframes cardShine{0%{transform:translateX(-110%);opacity:0}15%{opacity:1}100%{transform:translateX(110%);opacity:0}}
.card-inner{width:100%;max-width:1100px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:2}
@media (max-width: 480px){.card{padding:18px} .card-inner{gap:10px}}

/* Type — award-name is the dominant element on award cards (spec rule #7).
   Hero numerals and hero names are deliberately kept SMALLER than award-name so
   the reader's eye lands on the award name first. */
.display{font-family:'Anton','Bebas Neue',sans-serif;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.headline{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(40px,9vw,96px);line-height:1.0;letter-spacing:.005em;text-transform:uppercase;overflow-wrap:anywhere}
.award-name{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(56px,10vw,148px);line-height:.98;text-transform:uppercase;letter-spacing:.005em;overflow-wrap:anywhere}
.hero-numeral{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(70px,12vh,140px);line-height:.85;font-variant-numeric:tabular-nums}
.hero-name{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(40px,7vw,100px);line-height:.95;text-transform:uppercase;overflow-wrap:anywhere}
.recipient{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(18px,2.6vw,28px);letter-spacing:.01em}
.explainer{font-family:'Inter',sans-serif;font-weight:400;font-size:clamp(14px,1.9vw,20px);line-height:1.4;max-width:46ch;opacity:.92}
.body-text{font-family:'Inter',sans-serif;font-weight:400;font-size:clamp(15px,2vw,22px);line-height:1.45}
.caption{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(11px,1.2vw,15px);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.zinger{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(14px,1.9vw,22px);line-height:1.35;font-style:italic;opacity:.95}

/* Animations: arrival = .ani-up, scale = .ani-pop, draw=.ani-draw */
.ani{opacity:0;will-change:transform,opacity}
.card.in-view .ani-up{animation:slideUp .8s cubic-bezier(.18,.8,.25,1) forwards}
.card.in-view .ani-pop{animation:popIn .6s cubic-bezier(.18,.8,.25,1) forwards}
.card.in-view .ani-fade{animation:fadeUp .6s ease-out forwards}
.card.in-view .ani-left{animation:slideLeft .6s cubic-bezier(.18,.8,.25,1) forwards}
.card.in-view .ani-right{animation:slideRight .6s cubic-bezier(.18,.8,.25,1) forwards}
.card.in-view .ani-stamp{animation:stamp .55s cubic-bezier(.18,.8,.25,1) forwards}
.card.in-view .ani-drop{animation:dropIn .6s cubic-bezier(.18,.8,.25,1) forwards}
@keyframes slideUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(-38px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(38px)}to{opacity:1;transform:translateX(0)}}
@keyframes popIn{0%{opacity:0;transform:scale(.92) translateY(8px)}60%{transform:scale(1.02) translateY(0)}100%{opacity:1;transform:scale(1)}}
@keyframes stamp{0%{opacity:0;transform:scale(.7) rotate(-8deg)}60%{transform:scale(1.05) rotate(-2deg);opacity:1}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
@keyframes dropIn{0%{opacity:0;transform:translateY(-28px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

/* delays */
.d1{animation-delay:.15s !important}.d2{animation-delay:.35s !important}.d3{animation-delay:.55s !important}
.d4{animation-delay:.8s !important}.d5{animation-delay:1.05s !important}.d6{animation-delay:1.35s !important}
.d7{animation-delay:1.7s !important}.d8{animation-delay:2.1s !important}.d9{animation-delay:2.5s !important}
.d10{animation-delay:3.0s !important}

/* Backgrounds */
.bg-black{background:var(--black);color:var(--off)}
.bg-off{background:var(--off);color:var(--black)}
.bg-yellow{background:var(--yellow);color:var(--black)}
.bg-lime{background:var(--lime);color:var(--black)}
.bg-pink{background:var(--pink);color:var(--off)}
.bg-purple{background:var(--purple);color:var(--off)}
.bg-orange{background:var(--orange);color:var(--black)}
.bg-cyan{background:var(--cyan);color:var(--black)}
.bg-green{background:var(--green);color:var(--off)}
.bg-grad-po{background:linear-gradient(135deg,#FF1493 0%,#FF6F00 100%);color:var(--black)}
.bg-grad-py{background:linear-gradient(160deg,#6A1B9A 0%,#FFEB3B 100%);color:var(--off)}

/* Cold open */
.cold-open .cup{font-family:'Anton',sans-serif;font-size:clamp(80px,20vw,260px);line-height:.9;text-transform:uppercase}
.cold-open .sub{margin-top:24px;letter-spacing:.4em;font-size:clamp(12px,1.5vw,16px)}

/* Interstitial */
.interstitial{display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.interstitial::before{
  content:'';position:absolute;inset:-20% -20%;
  background-image:repeating-linear-gradient(-45deg, transparent 0 32px, currentColor 32px 33px);
  opacity:.07;pointer-events:none;z-index:0;
  transform:translateX(-100%);
  transition:transform 1.2s cubic-bezier(.18,.8,.25,1);
}
.card.in-view .interstitial::before, .interstitial.in-view::before{transform:translateX(0)}
.interstitial .card-inner{position:relative;z-index:1}
.interstitial .text{font-family:'Anton',sans-serif;font-size:clamp(56px,10vw,150px);line-height:.95;text-transform:uppercase;max-width:14ch;margin:0 auto}

/* Verdict stamp polish — drop shadow lands with the stamp */
.verdict{display:inline-block;font-family:'Anton',sans-serif;font-size:clamp(28px,4vw,52px);padding:8px 18px;border:3px solid currentColor;letter-spacing:.04em;align-self:start;justify-self:start;text-transform:uppercase;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.22))}

/* Confetti for the Champion card */
.confetti-piece{position:absolute;top:-24px;width:8px;height:14px;opacity:0;pointer-events:none;z-index:0;border-radius:1px}
@keyframes confetti-fall{
  0%{opacity:0;transform:translateY(-20px) rotate(0deg)}
  10%{opacity:1}
  100%{opacity:0;transform:translateY(110vh) rotate(720deg)}
}
.card.in-view .confetti-piece{animation:confetti-fall 4.2s cubic-bezier(.36,.07,.55,1) forwards}

/* Scroll-progress dots on the right edge */
#scroll-dots{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;z-index:50;pointer-events:none;opacity:0;transition:opacity .3s ease}
#scroll-dots.show{opacity:1}
.sd-dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.28;transition:transform .25s ease, opacity .25s ease}
.sd-dot.active{opacity:1;transform:scale(2.1)}
@media (max-width:600px){#scroll-dots{right:6px}.sd-dot{width:4px;height:4px}}

/* Cold-open letters reveal */
.cup-letter{display:inline-block;opacity:0;transform:translateY(40px) scale(.7) rotate(-8deg);will-change:transform,opacity}
.card.in-view .cup-letter{animation:cupIn .9s cubic-bezier(.18,.8,.25,1) forwards}
@keyframes cupIn{0%{opacity:0;transform:translateY(40px) scale(.7) rotate(-8deg)}60%{opacity:1;transform:translateY(-4px) scale(1.06) rotate(2deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}}

/* Table */
.scoreboard{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px 18px;width:100%;align-items:center}
.scoreboard .row{display:contents}
.scoreboard .rank{font-family:'Anton',sans-serif;font-size:clamp(54px,8vw,100px);line-height:.85;color:var(--green);text-align:right;min-width:1.4em}
.scoreboard .name{font-family:'Anton',sans-serif;font-size:clamp(28px,4.5vw,56px);line-height:1;text-transform:uppercase}
.scoreboard .team{font-family:'Inter',sans-serif;font-size:clamp(12px,1.5vw,17px);opacity:.8;margin-top:4px;font-weight:500}
.scoreboard .wdl{font-family:'Space Grotesk',sans-serif;font-size:clamp(13px,1.7vw,19px);opacity:.85;text-align:right;font-variant-numeric:tabular-nums}
.scoreboard .pts{font-family:'Anton',sans-serif;font-size:clamp(34px,5vw,68px);line-height:.9;color:var(--green);font-variant-numeric:tabular-nums;text-align:right}
.scoreboard .sep{grid-column:1/-1;height:1px;background:rgba(244,241,234,.12)}
.row-anim{opacity:0;transform:translateX(-30px)}
.card.in-view .row-anim{animation:slideLeft .55s cubic-bezier(.18,.8,.25,1) forwards}

/* Race chart */
.race-wrap{display:grid;grid-template-columns:1fr;gap:12px;height:100%;width:100%}
.race-svg{width:100%;height:100%;max-height:74vh}
.race-line{fill:none;stroke-width:3px;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.race-label{font-family:'Anton',sans-serif;font-size:14px;text-transform:uppercase}

/* Key moments */
.km-list{display:flex;flex-direction:column;gap:clamp(10px,2vh,22px);width:100%}
.km-item{display:grid;grid-template-columns:90px 1fr;gap:18px;align-items:baseline;border-top:1px solid currentColor;padding-top:12px;opacity:.92}
.km-item:first-child{border-top:none;padding-top:0}
.km-gw{font-family:'Anton',sans-serif;font-size:clamp(28px,3.6vw,48px);line-height:1;text-transform:uppercase}
.km-text{font-family:'Inter',sans-serif;font-size:clamp(15px,2vw,22px);line-height:1.3}

/* Big-three stats card */
.threestats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:end;width:100%}
@media (max-width:600px){.threestats{grid-template-columns:1fr;gap:16px;text-align:left}}
.ts-num{font-family:'Anton',sans-serif;font-size:clamp(90px,16vw,200px);line-height:.85;font-variant-numeric:tabular-nums}
.ts-label{font-family:'Space Grotesk',sans-serif;font-size:clamp(12px,1.5vw,16px);text-transform:uppercase;letter-spacing:.15em;margin-top:4px;opacity:.85}

/* Trade swap */
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;width:100%}
@media (max-width:600px){.swap{grid-template-columns:1fr;gap:14px}.swap-arrow{justify-self:start;transform:rotate(90deg)}}
.swap-side{display:flex;flex-direction:column;gap:6px}
.swap-side .who{font-family:'Space Grotesk',sans-serif;font-size:clamp(13px,1.6vw,18px);opacity:.85;text-transform:uppercase;letter-spacing:.1em}
.swap-side .players{font-family:'Anton',sans-serif;font-size:clamp(28px,4.2vw,54px);line-height:1.03;text-transform:uppercase}
.swap-side .delta{font-family:'Space Grotesk',sans-serif;font-size:clamp(13px,1.6vw,18px);margin-top:6px;font-variant-numeric:tabular-nums}
.swap-arrow{font-family:'Anton',sans-serif;font-size:clamp(36px,6vw,72px);opacity:.6}

/* Manager card */
/* Manager card layout — text on left, position number on right (no overlap) */
.mgr-card .card-inner{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,0.8fr);gap:28px;align-items:start;align-content:start;padding-top:4px}
@media (max-width:760px){
  .mgr-card .card-inner{grid-template-columns:1fr;gap:14px}
  .mgr-pos-cell{order:-1;text-align:left}
}
.mgr-pos-cell{display:flex;align-items:flex-start;justify-content:flex-end;overflow:hidden}
.mgr-pos{font-family:'Anton',sans-serif;font-size:clamp(140px,28vw,360px);line-height:.8;opacity:.32;pointer-events:none;text-align:right;will-change:transform,opacity}
/* Override default .ani-pop so manager #N drops in from above with a small wobble */
.card.in-view .mgr-pos.ani-pop{animation:mgrPosDrop 1.1s cubic-bezier(.18,.8,.25,1) forwards}
@keyframes mgrPosDrop{
  0%{opacity:0;transform:translateY(-220px) rotate(-10deg)}
  55%{opacity:.32;transform:translateY(22px) rotate(3deg)}
  72%{transform:translateY(-10px) rotate(-1.5deg)}
  86%{transform:translateY(4px) rotate(.8deg)}
  100%{opacity:.32;transform:translateY(0) rotate(0)}
}
@media (max-width:760px){.mgr-pos{font-size:clamp(110px,30vw,180px);opacity:.4}}
.mgr-left{display:flex;flex-direction:column;gap:8px;min-width:0}
.mgr-name{font-family:'Anton',sans-serif;font-size:clamp(56px,9vw,128px);line-height:.92;text-transform:uppercase;overflow-wrap:anywhere}
.mgr-team{font-family:'Space Grotesk',sans-serif;font-size:clamp(16px,2.3vw,26px);font-weight:500;opacity:.92}
.mgr-stats{display:flex;flex-direction:column;gap:clamp(4px,1vh,8px);margin-top:8px}
.mgr-stat{display:grid;grid-template-columns:auto 1fr;gap:10px;border-top:1px solid currentColor;padding-top:5px;opacity:.95;min-width:0}
.mgr-stat:first-child{border-top:none;padding-top:0}
.mgr-stat-label{font-family:'Space Grotesk',sans-serif;font-size:clamp(10px,1.2vw,13px);text-transform:uppercase;letter-spacing:.08em;opacity:.75;align-self:start;white-space:nowrap}
.mgr-stat-val{font-family:'Anton',sans-serif;font-size:clamp(14px,1.9vw,24px);line-height:1.15;text-transform:uppercase;overflow-wrap:anywhere}
.mgr-verdict{font-family:'Space Grotesk',sans-serif;font-style:italic;font-size:clamp(12px,1.5vw,18px);margin-top:10px;opacity:.92;line-height:1.35}

/* Goalkeeping howler hero */
.gk-row{display:flex;gap:30px;align-items:center;justify-content:center;margin:14px 0}
.gk-icon{width:clamp(70px,12vw,120px);height:clamp(86px,15vw,150px);border:5px solid currentColor;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative}
.gk-icon::before{content:'';width:60%;height:60%;border:5px solid currentColor;border-radius:50%}
.gk-icon.good{border-color:#00C853;color:#00C853}
.gk-icon.bad{border-color:#FF1493;color:#FF1493}
.gk-mark{position:absolute;font-size:clamp(36px,6vw,60px);font-family:'Anton',sans-serif;line-height:1}
.gk-howl-num{font-family:'Anton',sans-serif;font-size:clamp(80px,13vh,140px);line-height:.85;font-variant-numeric:tabular-nums;display:inline-block}
.gk-howl-unit{font-family:'Anton',sans-serif;font-size:clamp(22px,3.2vw,44px);line-height:1;display:inline-block;margin-left:14px;text-transform:uppercase;vertical-align:top;margin-top:.6em}

/* Phantom XI hero */
.phantom-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,auto);gap:10px;width:100%;max-width:540px;margin:8px 0}
.phantom-pos{display:flex;align-items:center;justify-content:center;padding:10px 6px;border:2px solid currentColor;border-radius:10px;font-family:'Anton',sans-serif;font-size:clamp(12px,1.5vw,16px);min-height:54px;text-align:center;text-transform:uppercase;line-height:1.05;transition:all .4s ease}
.phantom-pos.zero{opacity:.3;background:rgba(244,241,234,.05);position:relative}
.phantom-pos.zero::after{content:'×';position:absolute;font-size:60px;color:#FF1493;font-family:'Anton',sans-serif;line-height:1}

/* Final reveal stamp */
.stampbox{display:inline-block;padding:10px 22px;border:4px solid currentColor;font-family:'Anton',sans-serif;font-size:clamp(22px,3.2vw,42px);text-transform:uppercase;letter-spacing:.05em;transform:rotate(-3deg);line-height:1}

/* Counter style */
.counter{font-family:'Anton',sans-serif;font-variant-numeric:tabular-nums;line-height:.85}

/* Counterfactual table — compact so card fits at 360x640 */
.cf-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
@media (max-width:700px){
  .cf-grid{grid-template-columns:1fr;gap:10px}
  /* On phone only the counterfactual table is shown; the actual table is on card 3 */
  .cf-grid .cf-actual{display:none}
}
.cf-table{font-family:'Space Grotesk',sans-serif;width:100%;border-collapse:collapse}
.cf-table th{font-family:'Anton',sans-serif;font-size:clamp(11px,1.3vw,15px);text-align:left;padding:3px 6px;border-bottom:1px solid currentColor;text-transform:uppercase;letter-spacing:.05em;opacity:.7}
.cf-table td{font-size:clamp(11px,1.3vw,15px);padding:3px 6px;border-bottom:1px solid rgba(0,0,0,.08);font-variant-numeric:tabular-nums;line-height:1.2}
.cf-table .rank{font-family:'Anton',sans-serif;font-size:clamp(13px,1.7vw,18px);width:1em;color:currentColor;opacity:.8}
.cf-card .cf-title{font-family:'Anton',sans-serif;font-size:clamp(18px,2.5vw,28px);line-height:1;text-transform:uppercase;margin-bottom:6px}

/* Stories */
.story-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:start;width:100%}
@media (max-width:760px){.story-grid{grid-template-columns:1fr;gap:18px}}
.story-title{position:relative;font-family:'Anton',sans-serif;font-size:clamp(40px,6vw,76px);line-height:.95;text-transform:uppercase}
.story-title::after{content:'';position:absolute;left:0;bottom:-12px;width:0;height:5px;background:currentColor;opacity:.7;will-change:width}
.card.in-view .story-title::after{animation:titleUnderline .9s cubic-bezier(.18,.8,.25,1) .8s forwards}
@keyframes titleUnderline{to{width:88px}}
.story-tag{font-family:'Space Grotesk',sans-serif;font-size:clamp(13px,1.5vw,17px);letter-spacing:.1em;text-transform:uppercase;opacity:.78;margin-top:6px}
.story-body{font-family:'Inter',sans-serif;font-size:clamp(15px,1.85vw,21px);line-height:1.5;margin-top:14px;max-width:48ch}
.story-vis{display:flex;align-items:center;justify-content:center;min-height:220px}

/* Sparkline / mini chart shared */
.mini-svg{width:100%;height:auto;max-width:520px}

/* Aggregate stats grid */
.agg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;width:100%}
@media (max-width:720px){.agg-grid{grid-template-columns:repeat(2,1fr);gap:18px}}
.agg-item .agg-num{font-family:'Anton',sans-serif;font-size:clamp(56px,9vw,128px);line-height:.85;font-variant-numeric:tabular-nums}
.agg-item .agg-label{font-family:'Space Grotesk',sans-serif;font-size:clamp(11px,1.3vw,15px);text-transform:uppercase;letter-spacing:.1em;margin-top:6px;opacity:.85;line-height:1.3}

/* Closing card */
.closing .one-last{font-family:'Space Grotesk',sans-serif;font-size:clamp(11px,1.3vw,15px);letter-spacing:.3em;text-transform:uppercase;opacity:.78;margin-bottom:20px}
.closing .fact{font-family:'Anton',sans-serif;font-size:clamp(38px,6vw,80px);line-height:1.05;text-transform:uppercase}
.closing .signoff{font-family:'Inter',sans-serif;font-style:italic;font-size:clamp(13px,1.6vw,18px);margin-top:30px;opacity:.7}

/* Hot potato hero (centered name) — sized SMALLER than .award-name */
.hp-center{font-family:'Anton',sans-serif;font-size:clamp(48px,8vw,110px);text-transform:uppercase;line-height:.95;text-align:center;letter-spacing:.01em}
.hp-arrows{font-family:'Space Grotesk',sans-serif;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:clamp(13px,1.6vw,19px);margin-top:18px;opacity:.92}
.hp-step{padding:4px 10px;border:1px solid currentColor;border-radius:4px;font-weight:500}

/* Beating scoreline */
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;width:100%}
.scoreline .side{display:flex;flex-direction:column;align-items:center;gap:6px}
.scoreline .side-name{font-family:'Anton',sans-serif;font-size:clamp(28px,4vw,52px);line-height:.95;text-transform:uppercase;text-align:center}
.scoreline .side-score{font-family:'Anton',sans-serif;font-size:clamp(64px,11vw,140px);line-height:.85;font-variant-numeric:tabular-nums}
.scoreline .dash{font-family:'Anton',sans-serif;font-size:clamp(44px,7vw,90px);line-height:.85;opacity:.7}

/* Welcome and goodbye */

<body>
<div id="loader"><div class="l1">CRAIG CUP</div><div class="l2">Loading the receipts…</div></div>
<div class="deck" id="deck"></div>
<div id="scroll-dots" aria-hidden="true"></div>
<script>
// ==== Manager data and constants ====
const MGR = {
  73788:{first:"Mark",     team:"Carrying Timber",       short:"Mark"},
  73822:{first:"Peter",    team:"MaxPoints",             short:"Peter"},
  73827:{first:"Steven",   team:"✨",                short:"Steven"},
  73835:{first:"Geraint",  team:"\u{1F3F4}\u{E0067}\u{E0062}\u{E0077}\u{E006C}\u{E0073}\u{E007F}", short:"Geraint"},
  73847:{first:"Michael",  team:"Jota win again *20",     short:"Michael"},
  73858:{first:"christopher",team:"The Masterplan",       short:"christopher"}
};
const COL = {
  73788:"var(--cyan)",
  73822:"var(--purple)",
  73827:"var(--pink)",
  73835:"var(--yellow)",
  73847:"var(--orange)",
  73858:"var(--lime)"
};
const HEX = {
  73788:"#00BCD4",
  73822:"#6A1B9A",
  73827:"#FF1493",
  73835:"#FFEB3B",
  73847:"#FF6F00",
  73858:"#C6FF00"
};

// ==== Counters ====
// Ease-out-back: progress goes slightly past 1.0 then settles. Used for overshoot landing.
function easeOutBack(t){
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t-1, 3) + c1 * Math.pow(t-1, 2);
}
function countUp(el, to, duration=2200, suffix="", prefix=""){
  to = Number(to);
  const start = performance.now();
  function frame(t){
    const k = Math.min(1,(t-start)/duration);
    const e = easeOutBack(k);
    el.textContent = prefix + Math.round(to * e) + suffix;
    if(k<1) requestAnimationFrame(frame);
    else el.textContent = prefix + to + suffix;
  }
  requestAnimationFrame(frame);
}
// Slot-machine roll: scrambles random digits matching the final length, slows down, lands.
// Use sparingly on theatrical reveals (Hands-Off 78, Asleep 9, GK Howler 14).
function slotMachineRoll(el, finalValue, duration=1800, suffix=""){
  const finalStr = String(finalValue);
  const start = performance.now();
  let lastTick = 0;
  function frame(t){
    const elapsed = t - start;
    if (elapsed >= duration){ el.textContent = finalStr + suffix; return; }
    const k = elapsed / duration;
    // Cycle rate: starts ~55hz, slows to ~7hz
    const hz = Math.max(7, 55 * (1 - k*k));
    const interval = 1000 / hz;
    if (t - lastTick >= interval){
      let s = '';
      for (let i = 0; i < finalStr.length; i++){
        const ch = finalStr[i];
        s += (ch >= '0' && ch <= '9') ? Math.floor(Math.random() * 10) : ch;
      }
      el.textContent = s + suffix;
      lastTick = t;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ==== Build cards ====
let A = null; // analysis data, fetched

function mgrName(le){return MGR[le].first}
function mgrTeam(le){return MGR[le].team}
function mgrFull(le){return MGR[le].first + " · " + MGR[le].team}

// Card factory creates a card element
function card(opts){
  const el = document.createElement('section');
  el.className = 'card ' + (opts.cls||'');
  if(opts.id) el.id = opts.id;
  el.innerHTML = `<div class="card-inner">${opts.html}</div>`;
  return el;
}

// Build the entire deck
function buildDeck(){
  const deck = document.getElementById('deck');
  deck.innerHTML = '';
  CARDS.forEach(fn => {
    const el = fn();
    if(el) deck.appendChild(el);
  });
  setupObserver(deck);
}

const CARDS = []; // populated below in card definitions

// ==== Observer + scroll-progress dots ====
function setupScrollDots(cards){
  const wrap = document.getElementById('scroll-dots');
  wrap.innerHTML = '';
  cards.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'sd-dot';
    wrap.appendChild(d);
  });
  // Mirror background contrast: pick text colour based on current card's bg class
  setTimeout(() => wrap.classList.add('show'), 800);
}
function updateScrollDot(activeIdx){
  const wrap = document.getElementById('scroll-dots');
  if(!wrap) return;
  [...wrap.children].forEach((d, i) => d.classList.toggle('active', i === activeIdx));
  // Pick a contrasting dot colour from the active card's background
  const active = document.querySelectorAll('.card')[activeIdx];
  if(active){
    const bg = getComputedStyle(active).backgroundColor;
    const m = bg.match(/(\d+),\s*(\d+),\s*(\d+)/);
    if(m){
      const lum = (parseInt(m[1])*299 + parseInt(m[2])*587 + parseInt(m[3])*114) / 1000;
      wrap.style.color = lum > 140 ? '#0A0A0A' : '#F4F1EA';
    }
  }
}

function setupObserver(deck){
  const cards = document.querySelectorAll('.card');
  setupScrollDots(cards);
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting && entry.intersectionRatio >= 0.35){
        if(!entry.target.classList.contains('in-view')){
          entry.target.classList.add('in-view');
          entry.target.dispatchEvent(new CustomEvent('cardEnter'));
        }
        // Update progress dot for whichever card is most in view
        if(entry.intersectionRatio >= 0.6){
          const idx = [...cards].indexOf(entry.target);
          if(idx >= 0) updateScrollDot(idx);
        }
      }
    });
  }, {threshold: [0, 0.35, 0.6, 1], rootMargin: '0px'});
  cards.forEach(c => observer.observe(c));
  // Trigger first card manually since it's already in view
  setTimeout(() => {
    const first = document.querySelector('.card');
    if(first && !first.classList.contains('in-view')){
      first.classList.add('in-view');
      first.dispatchEvent(new CustomEvent('cardEnter'));
    }
    updateScrollDot(0);
  }, 60);
}

// ==== Fetch and init ====
fetch('./data/analysis.json').then(r=>r.json()).then(data => {
  A = data;
  buildDeck();
  setTimeout(()=>{document.getElementById('loader').classList.add('hide');}, 250);
  setTimeout(()=>{document.getElementById('loader').remove();}, 800);
}).catch(err => {
  document.getElementById('loader').innerHTML = '<div class="l1">Could not load data</div><div class="l2">'+err.message+'</div>';
});

// ===== Card definitions appended via push =====

      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div class="cup">
          <div>${lettersOf('CRAIG', 0.15)}</div>
          <div>${lettersOf('CUP',   0.65)}</div>
        </div>
        <div class="sub ani ani-fade d8">END OF SEASON · 2025/26</div>
      </div>`

});

    A.standings.forEach((s, idx) => {

      wrap.innerHTML = `

// 5. Race chart
CARDS.push(() => {

    cls:'bg-black',

      <div class="race-wrap">
        <svg class="race-svg" id="race-svg" viewBox="0 0 1000 540" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="caption ani ani-fade" id="race-caption" style="opacity:0">Geraint took control by GW17 and never gave it back.</div>`
  });
  el.addEventListener('cardEnter', () => {
    drawRaceChart(el.querySelector('#race-svg'), el.querySelector('#race-caption'));
  });
  return el;

function drawRaceChart(svg, caption){
  const W = 1000, H = 540;
  const PADL=50, PADR=130, PADT=30, PADB=44;
  const xs = (gw) => PADL + (W-PADL-PADR) * (gw-1) / 37;
  const ys = (pos) => PADT + (H-PADT-PADB) * (pos-1) / 5;
  svg.innerHTML = '';
  // Axes / grid
  for(let p=1; p<=6; p++){
    const y = ys(p);
    const ln = document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',PADL); ln.setAttribute('x2',W-PADR);
    ln.setAttribute('y1',y); ln.setAttribute('y2',y);
    ln.setAttribute('stroke','rgba(244,241,234,.08)'); ln.setAttribute('stroke-width','1');
    svg.appendChild(ln);
    const lab = document.createElementNS('http://www.w3.org/2000/svg','text');
    lab.setAttribute('x', PADL-10); lab.setAttribute('y', y+5);
    lab.setAttribute('fill','rgba(244,241,234,.5)');
    lab.setAttribute('font-family','Anton');
    lab.setAttribute('font-size','15');
    lab.setAttribute('text-anchor','end');
    lab.textContent = '#'+p;
    svg.appendChild(lab);
  }
  // GW labels (every 5)
  for(let g=1; g<=38; g+=5){
    const lab = document.createElementNS('http://www.w3.org/2000/svg','text');
    lab.setAttribute('x', xs(g)); lab.setAttribute('y', H-PADB+22);
    lab.setAttribute('fill','rgba(244,241,234,.45)');
    lab.setAttribute('font-family','Space Grotesk');
    lab.setAttribute('font-size','12');
    lab.setAttribute('text-anchor','middle');
    lab.textContent = 'GW'+g;
    svg.appendChild(lab);
  }
  // Build lines per manager
  const order = [73822, 73847, 73858, 73827, 73788, 73835]; // Peter first, Geraint last
  const lines = {};
  order.forEach(le => {
    const pts = [];
    for(let gw=1; gw<=38; gw++){
      pts.push([xs(gw), ys(A.pos_by_gw[le][gw])]);
    }
    const d = 'M ' + pts.map(p=>p[0]+' '+p[1]).join(' L ');
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('class','race-line');
    path.setAttribute('stroke', HEX[le]);
    path.setAttribute('stroke-width','6');
    path.setAttribute('stroke-linecap','round');
    path.setAttribute('stroke-linejoin','round');
    path.setAttribute('opacity','0');
    const length = path.getTotalLength ? 4000 : 4000; // dummy until appended
    svg.appendChild(path);
    const realLen = path.getTotalLength();
    path.style.strokeDasharray = realLen;
    path.style.strokeDashoffset = realLen;
    lines[le] = {path, length: realLen};
  });
  // Animate each in turn
  let t = 200;
  order.forEach((le, idx) => {
    setTimeout(() => {
      const {path, length} = lines[le];
      path.setAttribute('opacity','1');
      path.style.transition = `stroke-dashoffset 750ms cubic-bezier(.22,.7,.32,1), opacity .3s`;
      requestAnimationFrame(()=>{ path.style.strokeDashoffset = 0; });
      // Dim previous lines
      Object.keys(lines).forEach(k => {
        if(+k !== le) {
          lines[k].path.setAttribute('stroke-width','3');
          lines[k].path.style.opacity = '0.32';
        } else {
          lines[k].path.setAttribute('stroke-width','6');
          lines[k].path.style.opacity = '1';
        }
      });
      // Place endpoint label after line completes
      setTimeout(() => {
        const pos = A.pos_by_gw[le][38];
        const lab = document.createElementNS('http://www.w3.org/2000/svg','text');
        lab.setAttribute('x', xs(38)+10); lab.setAttribute('y', ys(pos)+5);
        lab.setAttribute('fill', HEX[le]);
        lab.setAttribute('font-family','Anton');
        lab.setAttribute('font-size','17');
        lab.setAttribute('text-anchor','start');
        lab.style.opacity = '0';
        lab.textContent = `${MGR[le].first} · #${pos}`;
        svg.appendChild(lab);
        requestAnimationFrame(()=>{ lab.style.transition='opacity .35s ease'; lab.style.opacity='1'; });
      }, 700);
    }, t);
    t += 700;
  });
  // Settle: all lines uniform
  setTimeout(() => {
    Object.values(lines).forEach(l => {
      l.path.setAttribute('stroke-width','4');
      l.path.style.opacity = '0.78';
    });
    if(caption){ caption.style.opacity='1'; caption.style.transition='opacity .6s ease'; }
  }, t + 200);
}

// 6. Key moments
CARDS.push(() => {
  const moments = [

});

      <div class="recipient ani ani-fade d2">Geraint · 🏴󠁧󠁢󠁷󠁬󠁳󠁿</div>

  el.addEventListener('cardEnter', () => {

});

}

  return card({
    cls:'bg-purple',

// Counterfactual table renderer
function cfTable(rows, highlightLe){
  return `
    <table class="cf-table">
      <thead><tr><th></th><th>Manager</th><th>W–D–L</th><th>Pts</th></tr></thead>
      <tbody>
        ${rows.map(r=>{
          const cls = (r.le === highlightLe) ? 'style="background:rgba(255,235,59,.12)"' : '';
          return `<tr ${cls}><td class="rank">${rows.indexOf(r)+1}</td><td>${MGR[r.le].first}</td><td>${r.w}–${r.d}–${r.l}</td><td><strong>${r.total}</strong></td></tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

    // Build cumulative league points per GW
    function cumul(le){
      const out = []; let pts = 0;
      for(let gw=1; gw<=38; gw++){
        const r = A.h2h_result[le][gw];
        pts += (r==='W' ? 3 : r==='D'?1:0);
        out.push(pts);
      }
      return out;
    }
    const series = chasers.map(le=>({le, data:cumul(le)}));
    const maxV = Math.max(...series.flatMap(s=>s.data));
    series.forEach((s, idx) => {
      const pts = s.data.map((v,i)=>[10 + i/37 * 360, 200 - (v/maxV * 180)]);
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d','M ' + pts.map(p=>p[0]+' '+p[1]).join(' L '));
      path.setAttribute('stroke', HEX[s.le]); path.setAttribute('stroke-width','3'); path.setAttribute('fill','none');
      svg.appendChild(path);
      const total = path.getTotalLength();
      path.style.strokeDasharray = total; path.style.strokeDashoffset = total;
      path.style.transition = 'stroke-dashoffset 1800ms ease-out';
      setTimeout(()=>{ path.style.strokeDashoffset = 0; }, 600 + idx*350);
    });
    // labels at endpoints
    chasers.forEach((le, idx) => {
      const data = series[idx].data;
      const lab = document.createElementNS('http://www.w3.org/2000/svg','text');
      lab.setAttribute('x', 380); lab.setAttribute('y', 200 - (data[37]/maxV*180) + 4);

      svg.appendChild(lab);
      setTimeout(()=>{ lab.style.transition='opacity .4s ease'; lab.style.opacity='1'; }, 2400);
    });
  });
  return el;
});

// 52. Closing card — fact assembled word-by-word per spec
CARDS.push(() => {
  const factText = "In a season where nobody had transferred, Michael's GW1 squad would have won the league. He ran 103 transactions instead and finished fifth.";
  const words = factText.split(' ');
  const el = card({
    cls:'bg-black closing',
    html:`
      <div class="one-last ani ani-fade d1">One last thing.</div>
      <div class="fact" id="closing-fact">${words.map(w => `<span class="cf-word" style="display:inline-block;opacity:0;transform:translateY(14px)">${w}</span>`).join(' ')}</div>
      <div class="signoff" id="closing-sign" style="opacity:0;transform:translateY(10px)">Draw your own conclusions.</div>`
  });
  el.addEventListener('cardEnter', () => {
    // Hold ~800ms after "One last thing." then assemble fact word by word over ~3s
    const spans = el.querySelectorAll('.cf-word');
    const perWord = Math.max(120, Math.min(280, Math.floor(3000 / spans.length)));
    spans.forEach((s, i) => {
      setTimeout(() => {
        s.style.transition = 'opacity .45s ease-out, transform .45s cubic-bezier(.18,.8,.25,1)';
        s.style.opacity = '1';
        s.style.transform = 'translateY(0)';
      }, 1400 + i * perWord);
    });
    // Sign-off: ~1500ms hold after the last word
    const signOffDelay = 1400 + spans.length * perWord + 1500;
    setTimeout(() => {
      const sign = el.querySelector('#closing-sign');
      sign.style.transition = 'opacity .6s ease-out, transform .6s cubic-bezier(.18,.8,.25,1)';
      sign.style.opacity = '1';
      sign.style.transform = 'translateY(0)';
    }, signOffDelay);
  });
  return el;
});

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRAIG CUP — End of Season 2025/26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --c-black:#0A0A0A; --c-off:#F4F1EA;
  --c-yellow:#FFEB3B; --c-lime:#C6FF00; --c-pink:#FF1493;
  --c-purple:#6A1B9A; --c-orange:#FF6F00; --c-cyan:#00BCD4; --c-green:#00C853;
  --f-display:'Anton','Bebas Neue',Impact,sans-serif;
  --f-body:'Inter','Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;color:var(--c-off);font-family:var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.deck{height:100vh;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.card{height:100vh;height:100dvh;width:100vw;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;position:relative;display:flex;flex-direction:column;padding:max(16px,3.5vmin) max(16px,4vmin);justify-content:center}
@media(min-width:640px){.card{padding:max(24px,4.5vmin) max(24px,5.5vmin)}}

/* Type primitives — conservative ceilings */
.tag{font-family:var(--f-body);font-weight:700;font-size:clamp(11px,1.4vw,14px);letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.explainer{font-family:var(--f-body);font-weight:500;font-size:clamp(13px,2vw,20px);line-height:1.4;max-width:40ch;opacity:.88}
.recipient{font-family:var(--f-body);font-weight:700;font-size:clamp(15px,2.3vw,24px);line-height:1.2}
.closer{font-family:var(--f-body);font-weight:500;font-size:clamp(13px,1.85vw,19px);line-height:1.45;max-width:40ch;opacity:.9}
.award-name{font-family:var(--f-display);font-weight:400;line-height:1.0;letter-spacing:.005em;font-size:clamp(38px,8vw,108px);text-transform:uppercase;word-break:normal;overflow-wrap:anywhere;margin:0}
.hero-name{font-family:var(--f-display);font-weight:400;line-height:.95;font-size:clamp(46px,11vw,160px);overflow-wrap:anywhere;text-transform:uppercase;letter-spacing:.005em;margin:0}
.hero-numeral{font-family:var(--f-display);font-weight:400;line-height:.85;font-size:clamp(120px,22vh,260px);letter-spacing:-.02em;margin:0}
.caption{font-family:var(--f-body);font-weight:500;font-size:clamp(12px,1.5vw,16px);letter-spacing:.05em;opacity:.7;text-transform:uppercase}

/* Animation base */
.fade-up{opacity:0;transform:translateY(28px)}
.fade-in{opacity:0;transform:scale(.97)}
.fade-left{opacity:0;transform:translateX(-30px)}
.fade-right{opacity:0;transform:translateX(28px)}
.scale-in{opacity:0;transform:scale(.92)}
.stamp-in{opacity:0;transform:scale(.65) rotate(-4deg)}
.in-view .fade-up,.in-view .fade-in,.in-view .fade-left,.in-view .fade-right,.in-view .scale-in{transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.in-view .stamp-in{transition:opacity .55s cubic-bezier(.34,1.56,.64,1),transform .55s cubic-bezier(.34,1.56,.64,1)}
.in-view .fade-up,.in-view .fade-in{opacity:1;transform:translate(0,0) scale(1)}
.in-view .fade-left,.in-view .fade-right{opacity:1;transform:translateX(0)}
.in-view .scale-in{opacity:1;transform:scale(1)}
.in-view .stamp-in{opacity:1;transform:scale(1) rotate(-2deg)}
.d-1{transition-delay:.1s}.d-2{transition-delay:.2s}.d-3{transition-delay:.3s}.d-4{transition-delay:.4s}.d-5{transition-delay:.5s}.d-6{transition-delay:.6s}.d-7{transition-delay:.7s}.d-8{transition-delay:.8s}.d-9{transition-delay:.9s}.d-10{transition-delay:1s}.d-12{transition-delay:1.2s}.d-14{transition-delay:1.4s}.d-16{transition-delay:1.6s}.d-18{transition-delay:1.8s}.d-20{transition-delay:2s}.d-22{transition-delay:2.2s}.d-24{transition-delay:2.4s}.d-26{transition-delay:2.6s}.d-28{transition-delay:2.8s}.d-30{transition-delay:3s}.d-34{transition-delay:3.4s}.d-38{transition-delay:3.8s}

/* Background pairings */
.bg-black{background:var(--c-black);color:var(--c-off)}
.bg-off{background:var(--c-off);color:var(--c-black)}
.bg-yellow{background:var(--c-yellow);color:var(--c-black)}
.bg-lime{background:var(--c-lime);color:var(--c-black)}
.bg-pink{background:var(--c-pink);color:var(--c-off)}
.bg-purple{background:var(--c-purple);color:var(--c-off)}
.bg-orange{background:var(--c-orange);color:var(--c-black)}
.bg-cyan{background:var(--c-cyan);color:var(--c-black)}
.bg-green{background:var(--c-green);color:var(--c-off)}
.bg-pinkorange{background:linear-gradient(125deg,#FF1493 0%,#FF6F00 100%);color:var(--c-black)}

/* Cold-open */
.cold{display:grid;place-items:center;align-content:center;text-align:center;gap:2vh}
.cold .title-row{display:flex;flex-direction:column;align-items:center;gap:-.04em;line-height:.85}
.cold .title-word{font-family:var(--f-display);font-size:clamp(78px,24vw,360px);line-height:.85;letter-spacing:.015em;text-transform:uppercase}
.cold .subtitle{font-family:var(--f-body);font-weight:700;letter-spacing:.36em;font-size:clamp(11px,1.5vw,16px);text-transform:uppercase;margin-top:1.5vh}

/* Interstitial */
.interstitial{display:grid;place-items:center;text-align:center;padding:0 4vmin}
.interstitial h2{font-family:var(--f-display);font-size:clamp(40px,10.5vw,150px);line-height:.95;letter-spacing:.005em;margin:0;text-transform:uppercase}

/* Final-table */
.table-card{justify-content:flex-start;padding-top:max(28px,5vmin)}
.table-card h2{font-family:var(--f-display);font-size:clamp(26px,4.4vw,52px);line-height:1;margin:0 0 .5em;letter-spacing:.01em;text-transform:uppercase}
.table-rows{display:grid;grid-template-columns:auto 1fr auto auto;gap:.2em max(14px,2vmin);align-items:baseline;width:100%;max-width:820px;margin:0 auto;flex:1;align-content:center}
.table-rows .row{display:contents}
.row > *{padding-top:.25em;padding-bottom:.25em;border-top:1px solid rgba(244,241,234,.16)}
.row.r1 > *{border-color:var(--c-green);border-width:2px}
.pos{font-family:var(--f-display);font-size:clamp(34px,5.8vw,68px);line-height:.9;text-align:right;min-width:1.4em}
.mgr{font-family:var(--f-display);font-size:clamp(20px,3.5vw,38px);line-height:1.05}
.mgr .team{display:block;font-family:var(--f-body);font-weight:500;font-size:clamp(10px,1.3vw,14px);opacity:.65;letter-spacing:.05em;text-transform:uppercase;margin-top:1px}
.wdl{font-family:var(--f-body);font-weight:500;font-size:clamp(11px,1.5vw,16px);opacity:.7;letter-spacing:.05em;text-align:right}
.t-pts{font-family:var(--f-display);font-size:clamp(26px,4.2vw,48px);line-height:.95;text-align:right;color:var(--c-green)}
.row.r1 .t-pts{color:var(--c-yellow)}

/* Race chart */
.race-wrap{display:flex;flex-direction:column;gap:max(10px,1.6vh);height:100%;justify-content:center}
.race-chart{width:100%;max-width:1100px;margin:0 auto;display:block}
.race-caption{font-family:var(--f-body);font-weight:500;font-size:clamp(13px,1.8vw,17px);text-align:center;opacity:.85;max-width:42ch;margin:0 auto;line-height:1.4}

/* Key moments */
.km-list{display:flex;flex-direction:column;gap:.1em;width:100%;max-width:900px;margin:0 auto;flex:1;justify-content:center}
.km-head{font-family:var(--f-display);font-size:clamp(30px,5vw,60px);margin:0 0 .3em;line-height:1;text-transform:uppercase}
.km-row{display:grid;grid-template-columns:3.6em 1fr;align-items:baseline;gap:max(14px,2.4vmin);padding:.35em 0;border-top:1px solid currentColor;border-color:rgba(0,0,0,.18)}
.bg-black .km-row{border-color:rgba(244,241,234,.18)}
.km-gw{font-family:var(--f-display);font-size:clamp(20px,3.2vw,34px);line-height:1;color:var(--c-pink);text-transform:uppercase}
.bg-off .km-gw{color:var(--c-pink)}
.km-text{font-family:var(--f-display);font-size:clamp(17px,2.5vw,28px);line-height:1.15;letter-spacing:.005em;text-transform:uppercase}

/* Geraint title narrative — three numbers */
.three-numbers{display:grid;grid-template-columns:1fr;gap:max(20px,3vmin);text-align:center;width:100%;max-width:920px;margin:0 auto;align-items:center;flex:1;align-content:center}
@media(min-width:680px){.three-numbers{grid-template-columns:1fr 1fr 1fr;align-items:end}}
.tn-cell{display:flex;flex-direction:column;align-items:center;gap:.4em}
.tn-cell .tn-num{font-family:var(--f-display);font-size:clamp(64px,15vw,180px);line-height:.85;letter-spacing:-.01em}
.tn-cell .tn-lab{font-family:var(--f-body);font-weight:700;letter-spacing:.16em;font-size:clamp(11px,1.4vw,14px);text-transform:uppercase;opacity:.8}
.gz-head{font-family:var(--f-display);font-size:clamp(30px,6.5vw,76px);margin:0;line-height:1;text-transform:uppercase;text-align:center}
.gz-cap{font-family:var(--f-body);font-style:italic;font-size:clamp(14px,2vw,20px);opacity:.85;text-align:center}

/* Trade card */
.trade-card{display:grid;grid-template-rows:auto 1fr auto;gap:max(12px,2.2vmin)}
.trade-head{display:flex;flex-direction:column;gap:.3em}
.trade-head h2{font-family:var(--f-display);font-size:clamp(32px,6.5vw,76px);line-height:.95;margin:0;text-transform:uppercase}
.trade-head .sub{font-family:var(--f-body);font-weight:500;font-size:clamp(13px,1.8vw,17px);opacity:.8;letter-spacing:.04em;text-transform:uppercase}
.trade-swap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:max(12px,2vmin);align-self:center;width:100%}
.trade-side{display:flex;flex-direction:column;gap:.5em;min-width:0}
.trade-side.right{text-align:right;align-items:flex-end}
.trade-side .who{font-family:var(--f-body);font-weight:700;font-size:clamp(12px,1.6vw,16px);letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.trade-side .gave{font-family:var(--f-display);font-size:clamp(20px,3.6vw,40px);line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.trade-side .pts{font-family:var(--f-display);font-size:clamp(24px,3.8vw,42px);line-height:1;letter-spacing:.01em}
.trade-side .pts .small{font-size:.45em;font-family:var(--f-body);font-weight:700;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
.trade-arrow{font-family:var(--f-display);font-size:clamp(40px,6vw,72px);opacity:.8;line-height:1;text-align:center}
.trade-verdict{display:grid;grid-template-columns:1fr auto;align-items:center;gap:max(12px,2vmin);padding-top:.8em;border-top:1.5px solid currentColor;border-color:rgba(0,0,0,.2)}
.bg-purple .trade-verdict,.bg-cyan .trade-verdict{border-color:rgba(0,0,0,.3)}
.bg-pink .trade-verdict,.bg-purple .trade-verdict,.bg-green .trade-verdict{border-color:rgba(244,241,234,.3)}
.verdict-stamp{display:inline-block;font-family:var(--f-display);font-size:clamp(20px,3vw,36px);padding:.18em .55em;border:3px solid currentColor;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.trade-line{font-family:var(--f-body);font-weight:500;font-size:clamp(13px,1.8vw,17px);line-height:1.4;max-width:32ch}

/* Manager card */
.mgr-card{display:grid;grid-template-rows:auto 1fr auto;gap:max(8px,1.5vmin);position:relative;overflow:hidden}
.mgr-pos{position:absolute;top:max(-16px,-2vmin);right:max(0px,1vmin);font-family:var(--f-display);font-size:clamp(140px,38vh,440px);line-height:.78;opacity:.09;pointer-events:none;z-index:0;letter-spacing:-.04em;user-select:none;max-width:80vw;overflow:hidden}
.mgr-head{position:relative;z-index:1;display:flex;flex-direction:column;gap:.15em}
.mgr-name{font-family:var(--f-display);font-size:clamp(36px,9.5vw,120px);line-height:.95;text-transform:uppercase;overflow-wrap:anywhere}
.mgr-team{font-family:var(--f-body);font-weight:700;font-size:clamp(14px,2vw,20px);letter-spacing:.04em;opacity:.85}
.mgr-stats{position:relative;z-index:1;display:flex;flex-direction:column;gap:.25em;justify-content:center;align-self:stretch;min-height:0;font-family:var(--f-body)}
.mgr-row{display:grid;grid-template-columns:9em 1fr;gap:max(6px,1.4vmin);align-items:baseline;border-top:1px solid currentColor;border-color:rgba(0,0,0,.17);padding-top:.3em;font-size:clamp(12px,1.7vw,16px)}
@media(min-width:640px){.mgr-row{grid-template-columns:11em 1fr}}
.bg-black .mgr-row,.bg-pink .mgr-row,.bg-purple .mgr-row,.bg-green .mgr-row{border-color:rgba(244,241,234,.22)}
.mgr-row .k{font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-size:clamp(11px,1.3vw,13px)}
.mgr-row .v{font-family:var(--f-display);font-size:clamp(17px,2.4vw,26px);line-height:1.05;text-transform:uppercase}
.mgr-verdict{position:relative;z-index:1;font-family:var(--f-body);font-weight:700;font-size:clamp(14px,2vw,19px);line-height:1.35;border-top:2px solid currentColor;padding-top:.7em;border-color:rgba(0,0,0,.5)}
.bg-black .mgr-verdict,.bg-pink .mgr-verdict,.bg-purple .mgr-verdict,.bg-green .mgr-verdict{border-color:rgba(244,241,234,.55)}

/* Award generic */
.award-card{display:grid;grid-template-rows:auto 1fr auto;gap:max(8px,1.6vmin);min-height:0}
.award-head{display:flex;flex-direction:column;gap:.35em;min-width:0}

/* Champion card */
.champ-grid{display:grid;grid-template-rows:auto 1fr auto;gap:max(12px,2.2vmin);text-align:center;align-items:center}
.champ-name{font-family:var(--f-display);font-size:clamp(58px,16vw,240px);line-height:.85;text-transform:uppercase}
.champ-trophy{font-size:clamp(70px,14vh,160px);line-height:1}
.champ-tag{font-family:var(--f-display);font-size:clamp(28px,4.8vw,56px);line-height:1;text-transform:uppercase}
.champ-meta{font-family:var(--f-body);font-weight:700;letter-spacing:.14em;font-size:clamp(13px,1.7vw,17px);text-transform:uppercase;opacity:.8;display:flex;justify-content:center;gap:max(16px,3vmin);flex-wrap:wrap}
.champ-meta span{display:inline-block}
.champ-meta b{font-family:var(--f-display);font-weight:400;font-size:1.6em;display:block;line-height:1}

/* GK Howler */
.gk-stage{display:flex;flex-direction:column;align-items:center;gap:max(14px,2.2vmin);text-align:center;justify-content:center;flex:1}
.gk-pair{display:flex;gap:max(28px,7vmin);align-items:flex-start;justify-content:center}
.gk-block{display:flex;flex-direction:column;align-items:center;gap:.5em}
.gk-glove{width:clamp(70px,9vw,110px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(38px,6vw,68px);line-height:1;border:4px solid currentColor;background:transparent}
.gk-glove.bad{border-color:var(--c-pink);color:var(--c-pink)}
.gk-glove.good{border-color:var(--c-green);color:var(--c-green)}
.gk-label{font-family:var(--f-display);font-size:clamp(15px,2vw,22px);letter-spacing:.06em;text-transform:uppercase}
.gk-count{display:flex;align-items:baseline;gap:.25em;justify-content:center}
.gk-count .num{font-family:var(--f-display);font-size:clamp(120px,22vh,240px);line-height:.85;color:var(--c-pink)}
.gk-count .unit{font-family:var(--f-display);font-size:clamp(28px,4.2vw,52px);text-transform:uppercase;letter-spacing:.05em}

/* Most Influential Transfer (Gittens) */
.mit-card{display:grid;grid-template-rows:auto 1fr auto;gap:max(12px,2vmin);text-align:center;align-items:center}
.mit-name{font-family:var(--f-display);font-size:clamp(64px,20vw,280px);line-height:.85;text-transform:uppercase;letter-spacing:.005em;overflow-wrap:anywhere}
.mit-zero{font-family:var(--f-display);font-size:clamp(54px,10vw,140px);line-height:.95;text-transform:uppercase;color:var(--c-black)}
.mit-zero .ptss{font-size:.45em;letter-spacing:.05em;margin-left:.15em}
.mit-by{font-family:var(--f-body);font-weight:700;font-size:clamp(13px,1.8vw,17px);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.mit-foot{font-family:var(--f-body);font-style:italic;font-size:clamp(13px,1.6vw,16px);opacity:.7;margin-top:.4em}

/* Asleep at the Wheel */
.asleep-stage{display:grid;grid-template-columns:1fr;gap:max(14px,2.4vmin);align-items:center;flex:1;align-content:center}
.cal-grid{display:grid;grid-template-columns:repeat(19,1fr);gap:3px;width:100%;max-width:780px;margin:0 auto}
.cal-cell{aspect-ratio:1;border:1.5px solid rgba(0,0,0,.6);display:grid;place-items:center;font-family:var(--f-body);font-weight:700;font-size:clamp(9px,1.1vw,12px)}
.cal-cell.has{background:var(--c-black);color:var(--c-yellow);border-color:var(--c-black)}
.cal-cell.dormant{background:transparent;color:rgba(0,0,0,.5)}
.cal-cell.in-streak{background:var(--c-pink);color:var(--c-off);border-color:var(--c-pink)}
.asleep-num-row{display:flex;align-items:baseline;gap:.25em;justify-content:center}
.asleep-num-row .n{font-family:var(--f-display);font-size:clamp(110px,20vh,230px);line-height:.85}
.asleep-num-row .u{font-family:var(--f-display);font-size:clamp(28px,4vw,48px);text-transform:uppercase;letter-spacing:.05em}

/* Hot potato */
.hp-stage{display:flex;flex-direction:column;align-items:center;gap:max(10px,2vmin);justify-content:center;flex:1}
.hp-name{font-family:var(--f-display);font-size:clamp(64px,15vw,200px);line-height:.85;text-transform:uppercase}
.hp-pills{display:flex;flex-wrap:wrap;gap:.45em;justify-content:center;max-width:840px;margin:0 auto}
.hp-pill{font-family:var(--f-body);font-weight:700;font-size:clamp(11px,1.5vw,15px);padding:.45em .85em;border:2px solid currentColor;border-radius:99px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.hp-pill .gw{opacity:.7;margin-right:.5em}

/* Beating scoreline */
.beat-stage{display:flex;flex-direction:column;align-items:center;gap:max(10px,2vmin);justify-content:center;flex:1;width:100%;min-width:0}
.beat-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:max(6px,1.5vmin);width:100%;max-width:900px;min-width:0}
.beat-side{min-width:0;overflow:hidden}
.beat-side{display:flex;flex-direction:column;align-items:center;gap:.3em}
.beat-name{font-family:var(--f-display);font-size:clamp(18px,4.5vw,56px);line-height:.95;text-transform:uppercase;overflow-wrap:anywhere}
.beat-score{font-family:var(--f-display);font-size:clamp(80px,20vw,240px);line-height:.85;letter-spacing:-.02em}
.beat-dash{font-family:var(--f-display);font-size:clamp(48px,13vw,160px);line-height:.85;opacity:.45}
.beat-meta{font-family:var(--f-body);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:clamp(11px,1.4vw,14px);opacity:.75;text-align:center}

/* Phantom XI */
.xi-pitch{display:grid;grid-template-rows:1fr 1fr 1fr 1fr;gap:max(10px,1.5vmin);width:100%;max-width:560px;margin:0 auto;aspect-ratio:3/4;max-height:54vh}
.xi-row{display:flex;justify-content:center;align-items:center;gap:max(10px,1.8vmin)}
.xi-dot{width:clamp(50px,7vw,76px);aspect-ratio:1;border-radius:50%;background:var(--c-off);color:var(--c-black);display:grid;place-items:center;font-family:var(--f-body);font-weight:700;font-size:clamp(8px,1vw,11px);text-align:center;line-height:1;padding:4px;border:3px solid var(--c-black);position:relative;transition:opacity .5s,background .5s,color .5s}
.xi-dot.phantom{background:transparent;color:rgba(244,241,234,.4);border-color:rgba(244,241,234,.3)}
.xi-dot.phantom::after{content:"";position:absolute;left:8%;right:8%;top:48%;height:3px;background:var(--c-pink);border-radius:2px}

/* Revolving door */
.rd-list{display:flex;flex-direction:column;gap:.45em;width:100%;max-width:520px;margin:0 auto}
.rd-row{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:1em;border-bottom:1.5px solid currentColor;padding-bottom:.3em;border-color:rgba(244,241,234,.3)}
.bg-pink .rd-row{border-color:rgba(244,241,234,.35)}
.rd-name{font-family:var(--f-display);font-size:clamp(22px,3.4vw,38px);line-height:1.02;text-transform:uppercase}
.rd-x{font-family:var(--f-display);font-size:clamp(22px,3.4vw,38px);line-height:1.02;color:var(--c-yellow)}

/* Welcome and goodbye */
.wg-stage{display:flex;flex-direction:column;align-items:center;gap:max(10px,1.8vmin);justify-content:center;flex:1}
.wg-name{font-family:var(--f-display);font-size:clamp(80px,15vw,200px);line-height:.85;text-transform:uppercase}
.wg-tags{display:flex;gap:max(18px,4vmin);justify-content:center;flex-wrap:wrap}
.wg-tag{display:flex;flex-direction:column;align-items:center;gap:.2em}
.wg-tag .lab{font-family:var(--f-body);font-weight:700;font-size:clamp(11px,1.4vw,14px);letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.wg-tag .gw{font-family:var(--f-display);font-size:clamp(40px,6vw,72px);line-height:.95;text-transform:uppercase}

/* Counterfactual */
.cf-card{display:grid;grid-template-rows:auto 1fr auto;gap:max(12px,2.2vmin)}
.cf-tables{display:grid;grid-template-columns:1fr;gap:max(20px,3.5vmin);width:100%;max-width:980px;margin:0 auto;align-self:center;align-content:center;align-items:start}
@media(min-width:760px){.cf-tables{grid-template-columns:1fr 1fr}}
.cf-table h3{font-family:var(--f-display);font-size:clamp(18px,2.6vw,28px);margin:0 0 .4em;text-transform:uppercase;letter-spacing:.03em;opacity:.85}
.cf-rows{display:grid;grid-template-columns:auto 1fr auto auto;gap:.35em max(8px,1.4vmin);align-items:baseline}
.cf-rows .p{font-family:var(--f-display);font-size:clamp(18px,2.5vw,24px);text-align:right;line-height:1}
.cf-rows .n{font-family:var(--f-display);font-size:clamp(16px,2.2vw,22px);line-height:1.05;text-transform:uppercase}
.cf-rows .t{font-family:var(--f-display);font-size:clamp(16px,2.2vw,22px);line-height:1;text-align:right}
.cf-rows .arrow{font-family:var(--f-body);font-weight:700;font-size:clamp(10px,1.3vw,13px);letter-spacing:.04em;text-align:right;min-width:3.5em}
.cf-up{color:var(--c-green)}
.cf-down{color:var(--c-pink)}
.cf-same{opacity:.45}
.cf-foot{font-family:var(--f-body);font-weight:500;font-size:clamp(13px,1.7vw,17px);line-height:1.4;text-align:center;max-width:50ch;margin:0 auto;opacity:.85}

/* Stories */
.story-card{display:grid;grid-template-rows:auto auto 1fr;gap:max(10px,1.8vmin);max-width:1000px;margin:0 auto;width:100%;align-content:center}
.story-title{font-family:var(--f-display);font-size:clamp(34px,7vw,80px);line-height:.95;text-transform:uppercase;letter-spacing:.005em;margin:0;white-space:pre-line}
.story-prot{font-family:var(--f-body);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(12px,1.4vw,15px);opacity:.7}
.story-body{display:grid;grid-template-columns:1fr;gap:max(16px,3vmin);align-items:center}
@media(min-width:760px){.story-body.with-vis{grid-template-columns:1.05fr .95fr}}
.story-text{display:flex;flex-direction:column;gap:.5em}
.story-text p{font-family:var(--f-body);font-weight:500;font-size:clamp(15px,2.05vw,20px);line-height:1.5;margin:0;max-width:38ch}
.story-vis{display:flex;align-items:center;justify-content:center;min-height:0}
.spark{width:100%;max-width:460px;height:auto;display:block}
.timeline-strip{display:flex;flex-direction:column;gap:.4em;width:100%;max-width:460px}
.timeline-strip .ts-line{display:grid;grid-template-columns:repeat(38,1fr);align-items:center;gap:2px;height:max(34px,5vh);position:relative}
.timeline-strip .ts-tick{height:100%;background:rgba(0,0,0,.08);display:grid;place-items:center;font-family:var(--f-body);font-size:9px;color:rgba(0,0,0,.6);position:relative}
.bg-black .timeline-strip .ts-tick{background:rgba(244,241,234,.08);color:rgba(244,241,234,.6)}
.ts-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:max(22px,3vmin);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--f-body);font-weight:700;font-size:clamp(10px,1.3vw,13px);color:var(--c-off);box-shadow:0 0 0 2px currentColor}
.ts-axis{display:flex;justify-content:space-between;font-family:var(--f-body);font-weight:700;font-size:clamp(10px,1.2vw,12px);opacity:.6;letter-spacing:.05em}

/* Aggregate stats */
.agg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:max(20px,3vmin) max(20px,5vmin);width:100%;max-width:960px;margin:0 auto;align-content:center;flex:1;align-items:center}
@media(min-width:760px){.agg-grid{grid-template-columns:repeat(3,1fr)}}
.agg-cell{display:flex;flex-direction:column;gap:.2em;text-align:left}
.agg-num{font-family:var(--f-display);font-size:clamp(48px,9vw,128px);line-height:.85;letter-spacing:-.01em}
.agg-num .small{font-size:.42em;letter-spacing:.02em}
.agg-num.tight{font-size:clamp(34px,5.5vw,80px)}
.agg-lab{font-family:var(--f-body);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(11px,1.3vw,14px);opacity:.78}

/* Closing card */
.close-card{display:grid;place-items:center;text-align:center;gap:max(20px,4vmin);padding:0 8vmin;align-content:center}
.close-fact{font-family:var(--f-display);font-size:clamp(32px,6.5vw,84px);line-height:1.05;letter-spacing:.005em;text-transform:uppercase;max-width:18ch;margin:0 auto}
.close-fact em{font-style:normal;color:var(--c-pink)}
.close-sign{font-family:var(--f-body);font-style:italic;font-size:clamp(14px,1.9vw,19px);opacity:.65}
.close-words{display:inline-block}
.close-words .w{display:inline-block;opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease;margin-right:.25em}
.in-view.reveal-words .close-words .w{opacity:1;transform:translateY(0)}

/* Verdict colors */
.v-win{color:var(--c-green)}
.v-fair{color:var(--c-cyan)}
.v-mada{color:var(--c-orange)}
.v-steal{color:var(--c-pink)}

/* Counter element */
.counter{font-variant-numeric:tabular-nums}

/* Decided in October — bars */
.weeks-bar{display:grid;grid-template-columns:8em 1fr 2.5em;gap:max(8px,1.5vmin);align-items:center;font-family:var(--f-body)}
.weeks-bar .w-name{font-family:var(--f-display);font-size:clamp(16px,2.2vw,24px);line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.weeks-bar .w-fill{height:max(20px,3.2vh);background:rgba(0,0,0,.18);position:relative;overflow:hidden}
.bg-black .weeks-bar .w-fill{background:rgba(244,241,234,.13)}
.weeks-bar .w-fill > i{display:block;height:100%;background:var(--c-pink);width:0;transition:width 1.1s cubic-bezier(.2,.8,.25,1)}
.in-view .weeks-bar .w-fill > i{width:var(--w)}
.weeks-bar .w-num{font-family:var(--f-display);font-size:clamp(18px,2.5vw,26px);text-align:right}

/* GW39 list-style stories */
.tx-bars{display:flex;flex-direction:column;gap:.3em;width:100%;max-width:460px}
.tx-bar-row{display:grid;grid-template-columns:2.6em 1fr 1.6em;gap:.5em;align-items:center;font-family:var(--f-body);font-size:clamp(10px,1.2vw,12px)}
.tx-bar-row .gw{opacity:.6;text-align:right}
.tx-bar-row .bar{height:max(10px,1.5vh);background:rgba(0,0,0,.07);position:relative;overflow:hidden}
.bg-black .tx-bar-row .bar{background:rgba(244,241,234,.1)}
.tx-bar-row .bar > i{display:block;height:100%;background:var(--c-pink);width:0;transition:width .8s cubic-bezier(.2,.8,.25,1)}
.in-view .tx-bar-row .bar > i{width:var(--w)}
.tx-bar-row .n{text-align:right;font-weight:700}

.bullet{font-family:var(--f-body);font-weight:700;font-size:clamp(12px,1.5vw,14px);letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:.5em}
.bullet::before{content:"●";color:var(--c-pink);font-size:1.1em;line-height:1}

</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script src="analysis_data.js"></script>
<script>
(function(){
'use strict';
const D = window.CC; // analysis data
const deck = document.getElementById('deck');

const FN = { mark:'Mark', peter:'Peter', steven:'Steven', geraint:'Geraint', michael:'Michael', christopher:'Christopher' };
const TEAM = { mark:'Carrying Timber', peter:'MaxPoints', steven:'✨', geraint:'🏴\u{E0067}\u{E0062}\u{E0077}\u{E006C}\u{E0073}\u{E007F}', michael:'Jota win again *20', christopher:'The Masterplan' };
const COLOR = { mark:'#00BCD4', peter:'#6A1B9A', steven:'#FF1493', geraint:'#FFEB3B', michael:'#FF6F00', christopher:'#C6FF00' };

function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for (const k in attrs){
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k === 'style') e.style.cssText = attrs[k];
    else if (k.startsWith('data-')) e.setAttribute(k, attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of children){
    if (c == null) continue;
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

function card(bgClass, extraClass=''){
  const c = el('section', {class:`card ${bgClass} ${extraClass}`});
  deck.appendChild(c);
  return c;
}

function interstitial(text, bg='bg-black'){
  const c = card(bg);
  c.appendChild(el('div', {class:'interstitial'}, el('h2', {class:'fade-up'}, text)));
}

function recipientLine(who){
  return `${FN[who]} · ${TEAM[who]}`;
}

// =========================================================================
// CARD 1: Cold open
// =========================================================================
{
  const c = card('bg-pinkorange', 'cold');
  const wrap = el('div', {class:'cold'});
  const titles = el('div', {class:'title-row'});
  titles.appendChild(el('div', {class:'title-word fade-up'}, 'CRAIG'));
  titles.appendChild(el('div', {class:'title-word fade-up d-3'}, 'CUP'));
  wrap.appendChild(titles);
  wrap.appendChild(el('div', {class:'subtitle fade-up d-7'}, 'End of Season — 2025 / 26'));
  c.appendChild(wrap);
}

// =========================================================================
// CARD 2: Interstitial
// =========================================================================
interstitial('Right. The final table.', 'bg-black');

// =========================================================================
// CARD 3: Final table
// =========================================================================
{
  const c = card('bg-black', 'table-card');
  c.appendChild(el('h2', {class:'fade-up'}, 'FINAL TABLE'));
  const rows = el('div', {class:'table-rows'});
  D.final_table.forEach((r, i) => {
    const rEl = el('div', {class:`row r${r.rank} fade-left d-${i+1}`});
    rEl.appendChild(el('div', {class:'pos'}, String(r.rank)));
    const mgr = el('div', {class:'mgr'});
    mgr.appendChild(document.createTextNode(FN[r.who].toUpperCase()));
    mgr.appendChild(el('span', {class:'team'}, TEAM[r.who]));
    rEl.appendChild(mgr);
    rEl.appendChild(el('div', {class:'wdl'}, `${r.w}-${r.d}-${r.l}`));
    rEl.appendChild(el('div', {class:'t-pts counter', 'data-target':String(r.pts), 'data-suffix':''}, '0'));
    rows.appendChild(rEl);
  });
  c.appendChild(rows);
}

// =========================================================================
// CARD 4: Interstitial
// =========================================================================
interstitial('How we got here.', 'bg-purple');

// =========================================================================
// CARD 5: Race chart (theatrical)
// =========================================================================
{
  const c = card('bg-black', '');
  const wrap = el('div', {class:'race-wrap'});
  wrap.appendChild(el('div', {class:'tag fade-up'}, 'CUMULATIVE LEAGUE POINTS — 38 GW'));
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 1100 620');
  svg.setAttribute('class', 'race-chart');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  // Axes
  const PAD = {l:46, r:190, t:30, b:42};
  const W = 1100, H = 620;
  const xs = gw => PAD.l + (W - PAD.l - PAD.r) * (gw - 1) / 37;
  const maxY = 80;
  const ys = p => H - PAD.b - (H - PAD.t - PAD.b) * (p / maxY);
  // grid
  for (let p of [0, 20, 40, 60, 80]){
    const y = ys(p);
    const ln = document.createElementNS(svgNS,'line');
    ln.setAttribute('x1', PAD.l); ln.setAttribute('x2', W - PAD.r);
    ln.setAttribute('y1', y); ln.setAttribute('y2', y);
    ln.setAttribute('stroke', 'rgba(244,241,234,.12)');
    ln.setAttribute('stroke-width', '1');
    svg.appendChild(ln);
    const t = document.createElementNS(svgNS,'text');
    t.setAttribute('x', PAD.l - 8); t.setAttribute('y', y + 4);
    t.setAttribute('text-anchor', 'end');
    t.setAttribute('fill', 'rgba(244,241,234,.55)');
    t.setAttribute('font-family', 'Inter, sans-serif');
    t.setAttribute('font-size', '13');
    t.textContent = p;
    svg.appendChild(t);
  }
  // GW labels
  for (let g of [1, 10, 20, 30, 38]){
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', xs(g)); t.setAttribute('y', H - PAD.b + 22);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('fill', 'rgba(244,241,234,.55)');
    t.setAttribute('font-family', 'Inter, sans-serif');
    t.setAttribute('font-size', '12');
    t.textContent = 'GW' + g;
    svg.appendChild(t);
  }
  // Lines drawn in this order (per spec)
  const drawOrder = ['peter','michael','christopher','steven','mark','geraint'];
  const paths = {};
  drawOrder.forEach(key => {
    const pts = D.race_pts[key];
    let d = '';
    for (let i = 0; i < pts.length; i++){
      d += (i === 0 ? 'M' : 'L') + xs(i+1).toFixed(1) + ',' + ys(pts[i]).toFixed(1) + ' ';
    }
    // path
    const ph = document.createElementNS(svgNS, 'path');
    ph.setAttribute('d', d);
    ph.setAttribute('fill', 'none');
    ph.setAttribute('stroke', COLOR[key]);
    ph.setAttribute('stroke-width', '5');
    ph.setAttribute('stroke-linecap', 'round');
    ph.setAttribute('stroke-linejoin', 'round');
    ph.setAttribute('opacity', '0');
    ph.dataset.key = key;
    svg.appendChild(ph);
    paths[key] = ph;
    // label at endpoint
    const lab = document.createElementNS(svgNS, 'text');
    lab.setAttribute('x', xs(38) + 8);
    lab.setAttribute('y', ys(pts[37]) + 5);
    lab.setAttribute('fill', COLOR[key]);
    lab.setAttribute('font-family', 'Anton, sans-serif');
    lab.setAttribute('font-size', '22');
    lab.setAttribute('opacity', '0');
    lab.dataset.key = key;
    lab.textContent = FN[key].toUpperCase();
    svg.appendChild(lab);
  });
  wrap.appendChild(svg);
  wrap.appendChild(el('div', {class:'race-caption fade-up d-30'}, 'Geraint took the lead at GW17 and never gave it back. Peter never made it off the bottom.'));
  c.appendChild(wrap);

  c.addEventListener('cardEnter', () => {
    drawOrder.forEach((key, i) => {
      const ph = paths[key];
      const len = ph.getTotalLength();
      ph.style.strokeDasharray = len;
      ph.style.strokeDashoffset = len;
      const start = i * 650;
      setTimeout(() => {
        ph.setAttribute('opacity', '1');
        ph.style.transition = `stroke-dashoffset 600ms ease-in-out, stroke-width .3s, opacity .3s`;
        ph.style.strokeDashoffset = '0';
        ph.setAttribute('stroke-width', '6');
        // dim previous lines
        drawOrder.slice(0, i).forEach(prev => {
          paths[prev].setAttribute('opacity', '.35');
          paths[prev].setAttribute('stroke-width', '3');
        });
      }, start);
      setTimeout(() => {
        // show label
        const lab = svg.querySelector(`text[data-key="${key}"]`);
        if (lab){
          lab.setAttribute('opacity', '1');
          lab.style.transition = 'opacity .35s';
        }
      }, start + 580);
    });
    // settle all at end
    setTimeout(() => {
      drawOrder.forEach(k => {
        paths[k].setAttribute('opacity', '.78');
        paths[k].setAttribute('stroke-width', '4');
      });
    }, drawOrder.length * 650 + 200);
  });
}

// =========================================================================
// CARD 6: Key moments
// =========================================================================
{
  const c = card('bg-off', 'table-card');
  const wrap = el('div', {class:'km-list'});
  wrap.appendChild(el('h2', {class:'km-head fade-up'}, 'Key Moments'));
  const moments = [
    {gw:'GW1', text:'Peter loses his opening fixture — first of seven straight defeats'},
    {gw:'GW9', text:'Christopher trades three for three with Michael — six players move'},
    {gw:'GW15', text:`Christopher posts ${D.highest_gw.pts} on Peter — biggest single-week score of the season`},
    {gw:'GW17', text:'Geraint takes the lead. He never gives it back'},
    {gw:'GW18', text:'Mark trades Evanilson for Isak — Isak finishes the season'},
    {gw:'GW28', text:'Peter makes his last transaction of the season'},
    {gw:'GW38', text:'Mark beats Christopher 46-42 — second place sealed on the final day'},
  ];
  moments.forEach((m, i) => {
    const r = el('div', {class:`km-row fade-left d-${i+2}`});
    r.appendChild(el('div', {class:'km-gw'}, m.gw));
    r.appendChild(el('div', {class:'km-text'}, m.text));
    wrap.appendChild(r);
  });
  c.appendChild(wrap);
}

// =========================================================================
// CARD 7: Interstitial
// =========================================================================
interstitial('The hands-off champion.', 'bg-green');

// =========================================================================
// CARD 8: Geraint title narrative (three numbers)
// =========================================================================
{
  const c = card('bg-yellow', '');
  const wrap = el('div', {style:'display:flex;flex-direction:column;gap:max(18px,3vmin);width:100%;align-items:center;justify-content:center;flex:1'});
  wrap.appendChild(el('h2', {class:'gz-head fade-up'}, 'HE BARELY LOOKED'));
  wrap.appendChild(el('div', {class:'tag fade-up d-2', style:'text-align:center'}, 'GERAINT · 🏴\u{E0067}\u{E0062}\u{E0077}\u{E006C}\u{E0073}\u{E007F}'));
  const tri = el('div', {class:'three-numbers'});
  const cells = [
    {n: D.tx_total.geraint, lab:'TRANSACTIONS — 2ND-FEWEST'},
    {n: D.final_table[0].pts, lab:'LEAGUE POINTS'},
    {n: D.final_table[0].pts - D.final_table[1].pts, lab:'CLEAR OF 2ND', prefix:'+'},
  ];
  cells.forEach((cell, i) => {
    const cellEl = el('div', {class:`tn-cell fade-up d-${(i+1)*2}`});
    cellEl.appendChild(el('div', {class:'tn-num counter', 'data-target':String(cell.n), 'data-prefix':cell.prefix||''}, '0'));
    cellEl.appendChild(el('div', {class:'tn-lab'}, cell.lab));
    tri.appendChild(cellEl);
  });
  wrap.appendChild(tri);
  wrap.appendChild(el('div', {class:'gz-cap fade-up d-8'}, '34 weeks at #1. 32 transactions in 38 gameweeks. He just left it alone.'));
  c.appendChild(wrap);
}

// =========================================================================
// CARD 9: Interstitial
// =========================================================================
interstitial('The trades. All three of them.', 'bg-black');

// =========================================================================
// CARDS 10-12: Three trade cards
// =========================================================================
function tradeVerdict(t){
  const a = t.offered_received_pts;
  const b = t.received_received_pts;
  const diff = Math.abs(a - b);
  const max = Math.max(a, b), min = Math.min(a, b);
  if (max < 30) return {label:'MUCH ADO ABOUT NOTHING', cls:'v-mada'};
  if (diff >= 60 && max >= 50) return {label:'STEAL', cls:'v-steal'};
  if (diff >= 25) return {label:'WIN', cls:'v-win'};
  return {label:'FAIR', cls:'v-fair'};
}

const TRADE_BG = ['bg-orange', 'bg-cyan', 'bg-lime'];
const TRADE_LINES = [
  'Christopher took Grealish off Peter for a Marmoush that never landed. Neither of them really benefited.',
  'Three for three. Christopher got Bruno Fernandes and Sarr. Michael got Eze, Palmer and Ekitiké. Honours basically even.',
  'Mark took Isak off Michael for Evanilson — and Evanilson never scored a point for Michael after the trade.',
];
D.trades.forEach((t, i) => {
  const c = card(TRADE_BG[i], 'trade-card');
  const head = el('div', {class:'trade-head'});
  head.appendChild(el('h2', {class:'fade-up'}, `TRADE ${i+1} OF 3`));
  head.appendChild(el('div', {class:'sub fade-up d-1'}, `GW${t.gw} · ${FN[t.offered]} ↔ ${FN[t.received]}`));
  c.appendChild(head);

  const swap = el('div', {class:'trade-swap'});
  // Left: what OFFERED got. Right: what RECEIVED got.
  const left = el('div', {class:'trade-side fade-up d-3'});
  left.appendChild(el('div', {class:'who'}, FN[t.offered] + ' GOT'));
  left.appendChild(el('div', {class:'gave'}, t.received_gave.join(' · ')));
  left.appendChild(el('div', {class:'pts'}, `${t.offered_received_pts}`, el('span', {class:'small'}, ` pts for ${FN[t.offered]}`)));
  swap.appendChild(left);
  swap.appendChild(el('div', {class:'trade-arrow fade-up d-5'}, '⇄'));
  const right = el('div', {class:'trade-side right fade-up d-6'});
  right.appendChild(el('div', {class:'who'}, FN[t.received] + ' GOT'));
  right.appendChild(el('div', {class:'gave'}, t.offered_gave.join(' · ')));
  right.appendChild(el('div', {class:'pts'}, `${t.received_received_pts}`, el('span', {class:'small'}, ` pts for ${FN[t.received]}`)));
  swap.appendChild(right);
  c.appendChild(swap);

  const verdict = tradeVerdict(t);
  const foot = el('div', {class:'trade-verdict'});
  foot.appendChild(el('div', {class:'trade-line fade-up d-9'}, TRADE_LINES[i]));
  foot.appendChild(el('div', {class:`verdict-stamp ${verdict.cls} stamp-in d-12`}, verdict.label));
  c.appendChild(foot);
});

// =========================================================================
// CARD 13: Interstitial
// =========================================================================
interstitial('Meet the managers.', 'bg-pink');

// =========================================================================
// CARDS 14-19: Manager cards (reverse finishing order: Peter → Geraint)

function cfTable(title, dataKey, foot, bg){
  const c = card(bg, 'cf-card');
  const head = el('div', {class:'award-head'});
  head.appendChild(el('div', {class:'award-name fade-up'}, title));
  c.appendChild(head);
  const tables = el('div', {class:'cf-tables'});
  // actual
  const actual = el('div', {class:'cf-table fade-up d-2'});
  actual.appendChild(el('h3', {}, 'AS IT HAPPENED'));
  const ar = el('div', {class:'cf-rows'});
  D.final_table.forEach(r => {
    ar.appendChild(el('div', {class:'p'}, String(r.rank)));
    ar.appendChild(el('div', {class:'n'}, FN[r.who]));
    ar.appendChild(el('div', {class:'t'}, String(r.pts)));
    ar.appendChild(el('div', {class:'arrow'}, ''));
  });
  actual.appendChild(ar);
  tables.appendChild(actual);
  // counterfactual
  const cf = D[dataKey];
  const cfArr = Object.keys(cf).map(who => ({who, ...cf[who]}));
  cfArr.sort((a, b) => b.pts - a.pts || b.pf - a.pf);
  const cfBlock = el('div', {class:'cf-table fade-up d-4'});
  cfBlock.appendChild(el('h3', {}, 'WHAT IF'));
  const cr = el('div', {class:'cf-rows'});
  cfArr.forEach((r, i) => {
    const newRank = i + 1;
    const actualRank = D.final_table.find(x => x.who === r.who).rank;
    const delta = actualRank - newRank;
    cr.appendChild(el('div', {class:'p'}, String(newRank)));
    cr.appendChild(el('div', {class:'n'}, FN[r.who]));
    cr.appendChild(el('div', {class:'t'}, String(r.pts)));
    const cls = delta > 0 ? 'cf-up' : (delta < 0 ? 'cf-down' : 'cf-same');
    const symbol = delta > 0 ? `▲${delta}` : (delta < 0 ? `▼${-delta}` : '—');
    cr.appendChild(el('div', {class:'arrow ' + cls}, symbol));
  });
  cfBlock.appendChild(cr);
  tables.appendChild(cfBlock);
  c.appendChild(tables);
  c.appendChild(el('div', {class:'cf-foot fade-up d-8'}, foot));
}

function makeStory(bg, title, prot, paragraphs, visBuilder){
  const c = card(bg, '');
  const wrap = el('div', {class:'story-card'});
  wrap.appendChild(el('h2', {class:'story-title fade-up'}, title));
  wrap.appendChild(el('div', {class:'story-prot fade-up d-2'}, prot));
  const body = el('div', {class: 'story-body' + (visBuilder ? ' with-vis' : '')});
  const text = el('div', {class:'story-text'});
  paragraphs.forEach((p, i) => {
    text.appendChild(el('p', {class:`fade-up d-${4 + i*2}`}, p));
  });
  body.appendChild(text);
  if (visBuilder){
    const vis = el('div', {class:'story-vis fade-up d-' + (4 + paragraphs.length*2)});
    visBuilder(vis, bg);
    body.appendChild(vis);
  }
  wrap.appendChild(body);
  c.appendChild(wrap);
}

// Helpers for SVG sparklines
function makeWLSpark(targetEl, seq, marks=[], bg='bg-off'){
  const w = 460, h = 100;
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('class', 'spark');
  // axis line
  const ax = document.createElementNS(svgNS, 'line');
  ax.setAttribute('x1', 0); ax.setAttribute('x2', w);
  ax.setAttribute('y1', h/2); ax.setAttribute('y2', h/2);
  ax.setAttribute('stroke', bg === 'bg-black' ? 'rgba(244,241,234,.25)' : 'rgba(0,0,0,.2)');
  ax.setAttribute('stroke-width', '1');
  svg.appendChild(ax);
  // bars
  const bw = w / seq.length;
  const winColor  = bg === 'bg-lime' ? '#0A0A0A' : '#00C853';
  const lossColor = (bg === 'bg-pink' || bg === 'bg-purple' || bg === 'bg-black') ? '#F4F1EA' : '#0A0A0A';
  const drawColor = bg === 'bg-black' ? 'rgba(244,241,234,.5)' : 'rgba(0,0,0,.4)';
  for (let i = 0; i < seq.length; i++){
    const s = seq[i];
    const bar = document.createElementNS(svgNS, 'rect');
    bar.setAttribute('x', i * bw + 1);
    bar.setAttribute('width', bw - 2);
    let color = s === 'W' ? winColor : s === 'L' ? lossColor : drawColor;
    bar.setAttribute('fill', color);
    if (s === 'W'){
      bar.setAttribute('y', 10);
      bar.setAttribute('height', h/2 - 12);
    } else if (s === 'L'){
      bar.setAttribute('y', h/2 + 2);
      bar.setAttribute('height', h/2 - 12);
    } else {
      bar.setAttribute('y', h/2 - 2);
      bar.setAttribute('height', 4);
    }
    svg.appendChild(bar);
  }
  // marks (highlight ranges)
  marks.forEach(m => {
    const r = document.createElementNS(svgNS, 'rect');
    r.setAttribute('x', (m.from - 1) * bw);
    r.setAttribute('width', (m.to - m.from + 1) * bw);
    r.setAttribute('y', 0);
    r.setAttribute('height', h);
    r.setAttribute('fill', 'none');
    r.setAttribute('stroke', m.color || '#FF1493');
    r.setAttribute('stroke-width', '2');
    r.setAttribute('stroke-dasharray', '3 3');
    svg.appendChild(r);
    if (m.label){
      const lab = document.createElementNS(svgNS, 'text');
      lab.setAttribute('x', (m.from - 1) * bw);
      lab.setAttribute('y', m.labelTop ? -1 : h + 12);
      lab.setAttribute('fill', m.color || '#FF1493');
      lab.setAttribute('font-family', 'Inter, sans-serif');
      lab.setAttribute('font-size', '11');
      lab.setAttribute('font-weight', '700');
      lab.textContent = m.label;
      svg.appendChild(lab);
    }
  });
  targetEl.appendChild(svg);
}

function makeBarChart(targetEl, values, labelStart, options={}){
  const w = 460, h = 130;
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('class', 'spark');
  const PAD = {l:24, r:8, t:14, b:22};
  const bw = (w - PAD.l - PAD.r) / values.length;
  const maxV = Math.max(...values, options.minMax || 1);
  for (let i = 0; i < values.length; i++){
    const v = values[i];
    const bh = ((h - PAD.t - PAD.b) * v / maxV) || 0;
    const bar = document.createElementNS(svgNS, 'rect');
    bar.setAttribute('x', PAD.l + i * bw + 1);
    bar.setAttribute('y', h - PAD.b - bh);
    bar.setAttribute('width', bw - 2);
    bar.setAttribute('height', bh);
    let fill = options.fill || '#FF1493';
    if (options.highlight && options.highlight.includes(labelStart + i)){
      fill = options.highlightFill || '#FFEB3B';
    }
    bar.setAttribute('fill', fill);
    svg.appendChild(bar);
  }
  // a few ticks
  const ticks = options.ticks || [labelStart, Math.floor((labelStart + values.length-1)/2), labelStart + values.length - 1];
  ticks.forEach(g => {
    const idx = g - labelStart;
    const x = PAD.l + idx * bw + bw / 2;
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', x); t.setAttribute('y', h - 6);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-family', 'Inter, sans-serif');
    t.setAttribute('font-size', '11');
    t.setAttribute('fill', options.textColor || 'currentColor');
    t.setAttribute('opacity', '.65');
    t.textContent = 'GW' + g;
    svg.appendChild(t);
  });
  // y axis label (max)
  const ymax = document.createElementNS(svgNS, 'text');
  ymax.setAttribute('x', PAD.l - 4); ymax.setAttribute('y', PAD.t + 6);
  ymax.setAttribute('text-anchor', 'end');
  ymax.setAttribute('font-family', 'Inter, sans-serif');
  ymax.setAttribute('font-size', '11');
  ymax.setAttribute('fill', options.textColor || 'currentColor');
  ymax.setAttribute('opacity', '.65');
  ymax.textContent = maxV;
  svg.appendChild(ymax);
  targetEl.appendChild(svg);
}

function makeLineChart(targetEl, values, options={}){
  const w = 460, h = 140;
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('class', 'spark');
  const PAD = {l:8, r:8, t:14, b:22};
  const N = values.length;
  const maxV = Math.max(...values, 1);
  const xs = i => PAD.l + (w - PAD.l - PAD.r) * i / (N - 1);
  const ys = v => h - PAD.b - (h - PAD.t - PAD.b) * (v / maxV);
  let d = '';
  for (let i = 0; i < N; i++){
    d += (i === 0 ? 'M' : 'L') + xs(i).toFixed(1) + ',' + ys(values[i]).toFixed(1) + ' ';
  }
  const path = document.createElementNS(svgNS, 'path');
  path.setAttribute('d', d);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', options.color || '#FF1493');
  path.setAttribute('stroke-width', '3');
  path.setAttribute('stroke-linejoin', 'round');
  path.setAttribute('stroke-linecap', 'round');
  svg.appendChild(path);
  if (options.markGw){
    const x = xs(options.markGw - 1);
    const ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', x); ln.setAttribute('x2', x);
    ln.setAttribute('y1', PAD.t); ln.setAttribute('y2', h - PAD.b);
    ln.setAttribute('stroke', options.markColor || '#0A0A0A');
    ln.setAttribute('stroke-width', '2');
    ln.setAttribute('stroke-dasharray', '4 4');
    svg.appendChild(ln);
    const txt = document.createElementNS(svgNS, 'text');
    txt.setAttribute('x', x + 4); txt.setAttribute('y', PAD.t + 12);
    txt.setAttribute('font-family', 'Inter, sans-serif');
    txt.setAttribute('font-size', '12');
    txt.setAttribute('font-weight', '700');
    txt.setAttribute('fill', options.markColor || '#0A0A0A');
    txt.textContent = options.markLabel || ('GW' + options.markGw);
    svg.appendChild(txt);
  }
  // axis ticks
  const ticks = options.ticks || [1, Math.floor(N/2), N];
  ticks.forEach(g => {
    const x = xs(g - 1);
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', x); t.setAttribute('y', h - 6);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-family', 'Inter, sans-serif');
    t.setAttribute('font-size', '11');
    t.setAttribute('fill', options.textColor || 'currentColor');
    t.setAttribute('opacity', '.6');
    t.textContent = 'GW' + g;
    svg.appendChild(t);
  });
  targetEl.appendChild(svg);
}

function makeTimelineDots(targetEl, items, bg='bg-off'){
  // items: [{gw, who, dir?}]
  const w = 460, h = 100;
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('class', 'spark');
  const PAD = {l:12, r:12, t:36, b:24};
  // axis line
  const ax = document.createElementNS(svgNS, 'line');
  ax.setAttribute('x1', PAD.l); ax.setAttribute('x2', w - PAD.r);
  ax.setAttribute('y1', h/2); ax.setAttribute('y2', h/2);
  ax.setAttribute('stroke', bg === 'bg-black' ? 'rgba(244,241,234,.3)' : 'rgba(0,0,0,.25)');
  ax.setAttribute('stroke-width', '2');
  svg.appendChild(ax);

    c.setAttribute('r', 11);

    lab.textContent = 'GW' + it.gw;
    svg.appendChild(lab);
  });
  targetEl.appendChild(svg);
}

// =========================================================================
// IntersectionObserver — fires animations on scroll-into-view.
// =========================================================================
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting && entry.intersectionRatio >= 0.4){
      const card = entry.target;
      if (!card.classList.contains('in-view')){
        card.classList.add('in-view');
        // For closing card, trigger word reveal
        if (card.querySelector('.close-words')) card.classList.add('reveal-words');
        // For counters
        runCounters(card);
        // For custom cardEnter listeners (race chart etc.)
        card.dispatchEvent(new CustomEvent('cardEnter'));
      }
    }
  });
}, { threshold: [0, 0.4, 0.6, 1], rootMargin: '0px' });

// Counter ticker
function runCounters(scope){
  const els = scope.querySelectorAll('.counter');
  els.forEach(el => {
    if (el.dataset.done) return;
    el.dataset.done = '1';
    const target = parseInt(el.dataset.target || '0', 10);
    const prefix = el.dataset.prefix || '';
    const suffix = el.dataset.suffix || '';
    const slow = el.dataset.slow === 'true';
    const hold = el.dataset.hold === 'true';
    const delay = parseInt(getComputedStyle(el).transitionDelay, 10) * 1000 + 600; // start counter slightly after transition completes
    const dur = hold ? 800 : (slow ? Math.min(3800, Math.max(2400, target * 200)) : Math.min(3200, Math.max(900, target * 35)));
    const start = performance.now() + (isNaN(delay) ? 600 : delay);
    function step(now){
      const dt = now - start;
      if (dt < 0){ requestAnimationFrame(step); return; }
      const t = Math.min(1, dt / dur);
      const ease = 1 - Math.pow(1 - t, 3);
      const v = Math.round(target * ease);
      el.textContent = prefix + v.toLocaleString() + suffix;
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

// Observe everything after build
requestAnimationFrame(() => {
  document.querySelectorAll('.card').forEach(c => observer.observe(c));
  // First card: manually trigger
  const first = deck.firstElementChild;
  if (first){
    requestAnimationFrame(() => {
      first.classList.add('in-view');
      runCounters(first);
      first.dispatchEvent(new CustomEvent('cardEnter'));
    });
  }
});

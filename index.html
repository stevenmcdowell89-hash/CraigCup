<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Craig Cup — End of Season 2025/26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================== RESET ============================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0A0A0A;color:#F4F1EA;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:'Inter',system-ui,sans-serif}
img,svg{display:block;max-width:100%}
button{font:inherit}

:root{
  --green:#00C853;
  --yellow:#FFEB3B;
  --pink:#FF1493;
  --purple:#6A1B9A;
  --orange:#FF6F00;
  --cyan:#00BCD4;
  --lime:#C6FF00;
  --off:#F4F1EA;
  --black:#0A0A0A;
  --display:'Anton','Bebas Neue',Impact,sans-serif;
  --bebas:'Bebas Neue','Anton',sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --space:'Space Grotesk','Inter',sans-serif;
}

/* ============================== DECK / CARDS ============================== */
.deck{
  height:100vh;height:100dvh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.deck::-webkit-scrollbar{display:none;width:0;height:0}

.card{
  height:100vh;height:100dvh;
  width:100vw;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  padding:clamp(20px,4vh,52px) clamp(18px,5vw,60px);
  color:var(--off);
}

/* Loading */
.loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0A0A0A;color:var(--off);font-family:var(--display);font-size:clamp(36px,8vh,80px);letter-spacing:.08em;z-index:10000;transition:opacity .6s ease}
.loader.hide{opacity:0;pointer-events:none}
.loader .dot{display:inline-block;width:.5ch;animation:dot 1.2s steps(4,end) infinite}
@keyframes dot{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* Progress strip */
.progress{position:fixed;top:0;left:0;height:3px;background:var(--off);z-index:9999;width:0;transition:width .25s ease}

/* ============================== TYPOGRAPHY ============================== */
.display{font-family:var(--display);font-weight:400;line-height:.85;letter-spacing:-.005em;text-transform:uppercase}
.bebas{font-family:var(--bebas);letter-spacing:.01em;line-height:.95}
.mono{font-family:var(--space);letter-spacing:-.01em}

.kicker{font-family:var(--space);font-size:clamp(11px,1.4vh,15px);letter-spacing:.22em;text-transform:uppercase;font-weight:600;opacity:.85}
.explainer{font-family:var(--body);font-size:clamp(14px,1.9vh,22px);font-weight:500;line-height:1.35;opacity:.85;max-width:42ch}
.closing{font-family:var(--body);font-size:clamp(14px,2vh,22px);line-height:1.4;font-style:italic;font-weight:500;opacity:.9;max-width:50ch}

/* Reveal helpers */
.fx{opacity:0;transform:translateY(28px);transition:opacity .55s ease,transform .55s cubic-bezier(.22,.61,.36,1)}
.fx-up{opacity:0;transform:translateY(36px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.65,.3,1)}
.fx-down{opacity:0;transform:translateY(-32px);transition:opacity .55s ease,transform .55s cubic-bezier(.22,.61,.36,1)}
.fx-left{opacity:0;transform:translateX(-36px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.65,.3,1)}
.fx-right{opacity:0;transform:translateX(36px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.65,.3,1)}
.fx-scale{opacity:0;transform:scale(.84);transition:opacity .55s ease,transform .55s cubic-bezier(.18,.85,.32,1.15)}
.fx-land{opacity:0;transform:translateY(14px) scale(.95);transition:opacity .6s ease,transform .65s cubic-bezier(.18,.9,.32,1.05)}
.in .fx,.in .fx-up,.in .fx-down,.in .fx-left,.in .fx-right,.in .fx-scale,.in .fx-land{opacity:1;transform:none}

/* Stamp */
.stamp{display:inline-block;border:3px solid currentColor;padding:.32em .8em;font-family:var(--display);font-size:clamp(22px,4vh,52px);letter-spacing:.06em;text-transform:uppercase;line-height:1;transform:rotate(-3deg) scale(.7);opacity:0;transition:transform .55s cubic-bezier(.18,.9,.3,1.25),opacity .35s ease;border-radius:6px}
.in .stamp{transform:rotate(-3deg) scale(1);opacity:1}
.stamp.land{animation:stampLand .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes stampLand{0%{transform:rotate(-3deg) scale(.7);opacity:0}55%{transform:rotate(-3deg) scale(1.08);opacity:1}100%{transform:rotate(-3deg) scale(1);opacity:1}}

/* Stagger delays */
.d1{transition-delay:.18s}.d2{transition-delay:.38s}.d3{transition-delay:.58s}.d4{transition-delay:.82s}.d5{transition-delay:1.05s}.d6{transition-delay:1.3s}.d7{transition-delay:1.55s}.d8{transition-delay:1.85s}.d9{transition-delay:2.15s}.d10{transition-delay:2.5s}

/* ============================== HELPERS ============================== */
.row{display:flex}
.col{display:flex;flex-direction:column}
.center{display:flex;align-items:center;justify-content:center;text-align:center;flex:1;min-height:0}
.between{justify-content:space-between}
.gap-xs{gap:6px}.gap-s{gap:10px}.gap-m{gap:18px}.gap-l{gap:32px}.gap-xl{gap:54px}
.grow{flex:1;min-height:0}
.cap{text-transform:uppercase}

.card .footer{font-family:var(--body);font-size:clamp(12px,1.6vh,16px);opacity:.7;letter-spacing:.18em;text-transform:uppercase;font-weight:600}

/* ============================== COLD OPEN ============================== */
.cold-open{background:linear-gradient(135deg,#FF1493 0%,#FF6F00 100%);justify-content:center;align-items:center;text-align:center}
.cold-open .word{display:inline-block}
.cold-open h1{font-family:var(--display);font-size:clamp(96px,28vh,360px);line-height:.78;letter-spacing:-.01em;margin:0;color:#0A0A0A;text-shadow:0 0 0 transparent;mix-blend-mode:multiply}
.cold-open .sub{margin-top:clamp(24px,4vh,52px);font-family:var(--space);font-size:clamp(13px,1.8vh,20px);letter-spacing:.4em;font-weight:600;color:#0A0A0A;opacity:.85}

/* ============================== INTERSTITIAL ============================== */
.inter{align-items:center;justify-content:center;text-align:center}
.inter h2{font-family:var(--display);font-size:clamp(56px,13vh,180px);line-height:.88;margin:0;letter-spacing:-.005em}
.inter .tag{font-family:var(--space);font-size:clamp(11px,1.4vh,14px);letter-spacing:.36em;font-weight:600;opacity:.6;margin-bottom:clamp(12px,2vh,24px)}

/* ============================== FINAL TABLE ============================== */
.final-table{background:#0A0A0A;justify-content:flex-start}
.final-table .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:clamp(12px,2vh,22px);border-bottom:2px solid var(--green);padding-bottom:clamp(8px,1.4vh,14px)}
.final-table .head h2{font-family:var(--display);font-size:clamp(28px,5.6vh,64px);margin:0;color:var(--green)}
.final-table .head .col-hdr{font-family:var(--space);font-size:clamp(10px,1.3vh,13px);font-weight:600;letter-spacing:.18em;opacity:.6;text-transform:uppercase}
.tbl{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:clamp(6px,1vh,12px) clamp(14px,3vw,34px);flex:1;align-content:center}
.tbl-row{display:contents}
.tbl-row .pos{font-family:var(--display);font-size:clamp(48px,9vh,116px);line-height:.85;text-align:right;min-width:1.5ch}
.tbl-row .name-block{display:flex;flex-direction:column;gap:2px}
.tbl-row .mgr{font-family:var(--display);font-size:clamp(22px,4.4vh,52px);line-height:.95}
.tbl-row .tn{font-family:var(--body);font-weight:600;font-size:clamp(11px,1.7vh,18px);opacity:.7;letter-spacing:.04em}
.tbl-row .wdl{font-family:var(--space);font-weight:600;font-size:clamp(13px,2.2vh,22px);opacity:.85;text-align:right;font-variant-numeric:tabular-nums}
.tbl-row .pts{font-family:var(--display);font-size:clamp(28px,5.4vh,64px);text-align:right;color:var(--green);min-width:2ch}
.tbl-row.champion .pos{color:var(--yellow)}
.tbl-row.champion .mgr{color:var(--yellow)}
.tbl-row.last .pos{color:#FF1493;opacity:.7}

/* ============================== SEASON RACE ============================== */
.race{background:#0A0A0A;justify-content:flex-start}
.race h2{font-family:var(--display);font-size:clamp(28px,5.6vh,60px);margin:0;letter-spacing:-.005em}
.race .sub{font-family:var(--space);font-size:clamp(11px,1.5vh,14px);letter-spacing:.24em;text-transform:uppercase;opacity:.6;font-weight:600;margin-top:6px}
.race-wrap{flex:1;display:flex;align-items:stretch;justify-content:center;margin:clamp(10px,2vh,22px) 0}
.race-wrap svg{width:100%;height:100%;overflow:visible}
.race path.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .4s ease}
.race .axis-line{stroke:#F4F1EA;stroke-width:1;opacity:.2}
.race .axis-text{fill:#F4F1EA;font-family:var(--space);font-size:11px;opacity:.4;letter-spacing:.06em}
.race .gridline{stroke:#F4F1EA;stroke-width:1;opacity:.08}
.race .endpoint{font-family:var(--bebas);font-size:14px;letter-spacing:.04em;opacity:0;transition:opacity .35s ease}
.race-cap{font-family:var(--body);font-size:clamp(14px,2vh,20px);text-align:center;opacity:0;transition:opacity .5s ease}
.race-cap.show{opacity:.85}

/* ============================== TIMELINES ============================== */
.timeline-card{display:flex;flex-direction:column;justify-content:flex-start}
.timeline-card .top-sub{font-family:var(--space);font-size:clamp(11px,1.4vh,14px);letter-spacing:.36em;font-weight:600;text-transform:uppercase;opacity:.7;margin-bottom:6px}
.timeline-card h2{font-family:var(--display);font-size:clamp(40px,7.5vh,90px);margin:0 0 clamp(18px,3vh,32px) 0;line-height:.9;letter-spacing:-.005em}
.tl-wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:clamp(10px,3vh,40px) 0}
.tl-wrap svg{width:100%;height:100%;overflow:visible}
.tl-event-label{font-family:var(--body);font-size:clamp(11px,1.6vh,15px);font-weight:600;fill:currentColor}
.tl-event-sub{font-family:var(--space);font-size:clamp(9px,1.2vh,12px);fill:currentColor;opacity:.65;letter-spacing:.04em}
.tl-cap{font-family:var(--body);font-size:clamp(12px,1.7vh,16px);opacity:.7;text-align:center;font-style:italic;margin-top:6px}
.timeline-card.light{background:var(--off);color:var(--black)}
.timeline-card.dark{background:var(--black);color:var(--off)}

/* ============================== HANDS-OFF CHAMPION ============================== */
.hands-off{background:linear-gradient(160deg,var(--green) 0%,#1B5E20 100%);justify-content:center;align-items:center;text-align:center}
.hands-off .kick{font-family:var(--space);font-size:clamp(12px,1.6vh,16px);letter-spacing:.36em;font-weight:600;text-transform:uppercase;color:#0A0A0A;opacity:.7;margin-bottom:clamp(14px,2vh,24px)}
.hands-off h2{font-family:var(--display);font-size:clamp(36px,7vh,90px);margin:0 0 clamp(16px,3vh,32px) 0;color:#0A0A0A;line-height:.92}
.three-stats{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:clamp(10px,3vw,52px);flex-wrap:wrap}
.stat-block{display:flex;flex-direction:column;align-items:center}
.stat-block .num{font-family:var(--display);font-size:clamp(72px,16vh,200px);line-height:.85;color:#0A0A0A;font-variant-numeric:tabular-nums}
.stat-block .lbl{font-family:var(--space);font-size:clamp(11px,1.5vh,15px);letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#0A0A0A;opacity:.8;margin-top:6px}
.hands-off .cap{margin-top:clamp(18px,3vh,32px);font-family:var(--body);font-size:clamp(15px,2.2vh,22px);font-style:italic;color:#0A0A0A;opacity:.85;font-weight:500}

/* ============================== TRADES ============================== */
.trade{justify-content:flex-start}
.trade .kicker{margin-bottom:6px}
.trade h2{font-family:var(--display);font-size:clamp(28px,5.4vh,58px);margin:0;letter-spacing:-.005em;line-height:.95}
.trade .explainer{margin-top:6px;margin-bottom:clamp(12px,2.5vh,24px)}
.trade-grid{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(10px,2.5vw,30px);min-height:0}
.trade-side{display:flex;flex-direction:column;align-items:stretch;gap:clamp(6px,1vh,12px);min-width:0}
.trade-side .who{font-family:var(--space);font-size:clamp(10px,1.4vh,13px);letter-spacing:.2em;font-weight:700;text-transform:uppercase;opacity:.6}
.player-chip{padding:clamp(8px,1.4vh,14px) clamp(10px,2vw,16px);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;display:flex;flex-direction:column;gap:2px}
.player-chip.dark{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.18)}
.player-chip .pname{font-family:var(--display);font-size:clamp(20px,4vh,40px);line-height:.95}
.player-chip .pmeta{font-family:var(--space);font-size:clamp(10px,1.4vh,13px);opacity:.75;letter-spacing:.04em;font-weight:600}
.player-chip .pmeta b{font-weight:700;opacity:.95}
.trade-arrow{display:flex;flex-direction:column;align-items:center;gap:8px}
.trade-arrow .arr{font-family:var(--display);font-size:clamp(28px,6vh,72px);line-height:1}
.trade-totals{display:flex;justify-content:space-between;margin-top:clamp(8px,1.4vh,14px);font-family:var(--space);font-size:clamp(11px,1.5vh,14px);letter-spacing:.1em;font-weight:600;opacity:.85}
.trade-bottom{margin-top:clamp(10px,2vh,18px);display:flex;align-items:center;justify-content:space-between;gap:14px}
.trade .closing{flex:1}

/* trade theme colours */
.trade.t1{background:linear-gradient(140deg,#6A1B9A,#0A0A0A)}
.trade.t2{background:linear-gradient(140deg,#FF6F00,#0A0A0A)}
.trade.t3{background:linear-gradient(140deg,#00BCD4,#0A0A0A)}

/* ============================== MANAGER CARDS ============================== */
.mgr-card{position:relative;overflow:hidden;color:#0A0A0A}
.mgr-card.dark-text{color:#0A0A0A}
.mgr-card.light-text{color:var(--off)}
.mgr-pos-watermark{position:absolute;top:50%;right:-3%;transform:translateY(-50%);font-family:var(--display);font-size:clamp(280px,70vh,900px);line-height:.78;color:rgba(0,0,0,.12);pointer-events:none;font-variant-numeric:tabular-nums;z-index:0;letter-spacing:-.04em}
.mgr-card.light-text .mgr-pos-watermark{color:rgba(255,255,255,.13)}
.mgr-inner{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;min-height:0;gap:clamp(8px,1.6vh,18px)}
.mgr-card .name{font-family:var(--display);font-size:clamp(56px,11vh,140px);line-height:.86;letter-spacing:-.01em;margin:0}
.mgr-card .team{font-family:var(--space);font-size:clamp(15px,2.4vh,26px);font-weight:600;letter-spacing:.04em;opacity:.85;margin-top:4px}
.mgr-card .stats{display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,1vh,10px) clamp(14px,3vw,36px);flex:1;align-content:center;margin-top:clamp(6px,1vh,14px);min-height:0}
.mgr-card .stat{display:flex;flex-direction:column;gap:1px}
.mgr-card .stat .lbl{font-family:var(--space);font-size:clamp(10px,1.25vh,12px);letter-spacing:.18em;font-weight:700;text-transform:uppercase;opacity:.65}
.mgr-card .stat .val{font-family:var(--display);font-size:clamp(20px,3.6vh,38px);line-height:1;font-variant-numeric:tabular-nums}
.mgr-card .stat .sub{font-family:var(--body);font-size:clamp(11px,1.5vh,14px);font-weight:600;opacity:.75;margin-top:1px}
.mgr-card .verdict{margin-top:clamp(4px,1vh,12px);font-family:var(--body);font-size:clamp(13px,1.9vh,20px);font-weight:500;line-height:1.3;font-style:italic;border-left:3px solid currentColor;padding-left:12px;max-width:60ch}

.mgr-card.peter{background:#6A1B9A;color:var(--off)}
.mgr-card.michael{background:#FF6F00;color:#0A0A0A}
.mgr-card.christopher{background:#C6FF00;color:#0A0A0A}
.mgr-card.steven{background:#FF1493;color:var(--off)}
.mgr-card.mark{background:#00BCD4;color:#0A0A0A}
.mgr-card.geraint{background:#FFEB3B;color:#0A0A0A}

/* ============================== AWARD CARDS ============================== */
.award{justify-content:flex-start;position:relative;overflow:hidden}
.award .top-bar{display:flex;align-items:center;justify-content:space-between}
.award .award-name{font-family:var(--display);font-size:clamp(48px,10vh,130px);line-height:.85;margin:clamp(4px,1vh,10px) 0 clamp(4px,.6vh,8px) 0;letter-spacing:-.01em}
.award .award-name .word{display:inline-block;margin-right:.18em}
.award .explainer{margin-bottom:clamp(10px,2vh,20px)}
.award .hero-zone{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:0;gap:clamp(8px,1.6vh,18px);width:100%}
.award .recipient{font-family:var(--display);font-size:clamp(28px,5.4vh,64px);line-height:.95;letter-spacing:-.005em}
.award .recipient .who{opacity:.85}
.award .closing{margin-top:clamp(8px,1.4vh,18px)}

/* Champion */
.champion{background:radial-gradient(ellipse at 60% 40%,#FFE066 0%,#FF8F00 70%,#3E2723 100%);color:#0A0A0A;position:relative}
.champion::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.18) 0%,transparent 60%);pointer-events:none}
.champion .award-name{font-size:clamp(80px,15vh,210px)}
.champion-name{font-family:var(--display);font-size:clamp(80px,16vh,220px);line-height:.86;letter-spacing:-.01em;margin:0;display:flex;align-items:baseline;gap:.16em;flex-wrap:wrap}
.champion-name .flag{font-size:.7em;display:inline-block}
.champion .pts-line{display:flex;align-items:baseline;gap:.3em;font-family:var(--display);margin-top:clamp(4px,1vh,12px)}
.champion .pts-num{font-size:clamp(56px,10vh,150px);line-height:.85}
.champion .pts-lbl{font-size:clamp(20px,3vh,36px);line-height:.85;letter-spacing:.03em;opacity:.8}
.crown-svg{position:absolute;top:clamp(20px,3vh,30px);right:clamp(20px,4vw,46px);width:clamp(80px,14vh,180px);height:auto;opacity:.85}

/* Best Trade */
.best-trade{background:linear-gradient(140deg,#00C853 0%,#0A3D14 100%);color:var(--off)}
.best-trade .award-name{color:var(--off)}
.bt-swap{display:flex;flex-direction:column;gap:clamp(10px,2vh,18px);width:100%}
.bt-row{display:flex;align-items:center;gap:clamp(8px,2vw,20px);width:100%}
.bt-side{display:flex;flex-direction:column;flex:1;gap:6px;min-width:0}
.bt-side .who{font-family:var(--space);font-size:clamp(11px,1.4vh,13px);letter-spacing:.2em;font-weight:700;opacity:.65;text-transform:uppercase}
.bt-side .players{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:clamp(18px,3.4vh,36px);line-height:1}
.bt-side .total{font-family:var(--space);font-size:clamp(14px,2vh,20px);font-weight:700;letter-spacing:.05em;margin-top:6px}
.bt-arrow{font-family:var(--display);font-size:clamp(28px,6vh,72px);line-height:1;opacity:.75}
.bt-side.won .total{color:var(--yellow)}

/* Best Draft Pick */
.best-pick{background:#0A0A0A;color:var(--off);position:relative;overflow:hidden}
.best-pick .award-name{color:var(--lime)}
.bp-grid{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:clamp(14px,3vw,40px);width:100%;flex:1;min-height:0}
.bp-pick{font-family:var(--display);font-size:clamp(120px,28vh,400px);line-height:.78;color:var(--lime);font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bp-pick .pn-lbl{font-family:var(--space);font-size:clamp(11px,1.6vh,14px);letter-spacing:.32em;font-weight:700;opacity:.75;color:var(--off);line-height:1;margin-bottom:8px}
.bp-pick .pn{display:block;line-height:.78}
.bp-details{display:flex;flex-direction:column;gap:clamp(6px,1.4vh,16px);min-width:0}
.bp-player{font-family:var(--display);font-size:clamp(60px,12vh,160px);line-height:.85;letter-spacing:-.005em}
.bp-meta{font-family:var(--space);font-size:clamp(13px,1.9vh,20px);opacity:.8;letter-spacing:.04em;font-weight:600}
.bp-points{font-family:var(--display);font-size:clamp(36px,7vh,90px);line-height:.85;color:var(--lime)}

/* Most Influential */
.mit{background:linear-gradient(140deg,#FF1493 0%,#FF6F00 100%);color:#0A0A0A}
.mit .award-name{color:#0A0A0A}

<script>
/* ============================================================================
   CRAIG CUP — End of Season Review
   Single-file build. Loads data/computed.json, builds ~50 scroll-snapped cards,
   each with a distinct hero + per-card animation sequence.
   ========================================================================== */

// ---------- Manager mapping ----------
const MGRS = {
  76178:{first:'Mark',     team:'Carrying Timber',          flag:'',                         theme:'mark',       primary:'#00BCD4'},
  76213:{first:'Peter',    team:'MaxPoints',                flag:'',                         theme:'peter',      primary:'#6A1B9A'},
  76218:{first:'Steven',   team:'✨',                   flag:'',                         theme:'steven',     primary:'#FF1493'},
  76226:{first:'Geraint',  team:'🏴󠁧󠁢󠁷󠁬󠁳󠁿', flag:'🏴󠁧󠁢󠁷󠁬󠁳󠁿', theme:'geraint',    primary:'#FFEB3B'},
  76238:{first:'Michael',  team:'Jota win again *20',       flag:'',                         theme:'michael',    primary:'#FF6F00'},
  76250:{first:'Christopher', team:'The Masterplan',        flag:'',                         theme:'christopher',primary:'#C6FF00'},
};
const nameOf = id => MGRS[id]?.first || '';
const teamOf = id => MGRS[id]?.team || '';
const tagOf  = id => `${nameOf(id)} · ${teamOf(id)}`;

// ---------- Util ----------
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
const ce = (tag, cls, html) => { const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; };
const wordSpan = (txt) => txt.split(/\s+/).map(w=>`<span class="word-anim">${w}</span>`).join(' ');
const splitWords = (sel,root) => $$('.word-anim',root);

// Count-up: counts an element's text from 0 (or `from`) to `to` over duration ms with ease-out
function countUp(el, to, duration=2500, from=0, fmt = v => Math.round(v).toString()) {
  if (!el) return;
  const t0 = performance.now();
  const range = to - from;
  function tick(now) {
    const t = Math.min(1, (now-t0)/duration);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = fmt(from + range * eased);
    if (t < 1) requestAnimationFrame(tick);
    else el.textContent = fmt(to);
  }
  el.textContent = fmt(from);
  requestAnimationFrame(tick);
}

// Sequencer: schedules callbacks with offsets from base, returns timeouts so they can be cancelled
class Seq {
  constructor() { this.timers = []; }
  at(ms, fn) { this.timers.push(setTimeout(fn, ms)); return this; }
  cancel() { this.timers.forEach(t=>clearTimeout(t)); this.timers=[]; }
}

// Reveal words in a container, optionally with stagger and class
function revealWords(root, sel='.word-anim', stagger=160, delay=0, addClass='show') {
  const nodes = $$(sel, root);
  nodes.forEach((n,i)=>setTimeout(()=>n.classList.add(addClass), delay + i*stagger));
}

// ---------- Card factory ----------
const CARDS = []; // { id, build(data) -> { el, onEnter? } }

function registerCard(id, builder) { CARDS.push({ id, builder }); }

// Helpers used in builders
function interstitial(text, tag, bg) {
  const card = ce('section','card inter');
  card.style.background = bg || '#0A0A0A';
  card.innerHTML = `
    ${tag ? `<div class="tag fx d1">${tag}</div>` : ''}
    <h2 class="display"><span class="fx-up d2">${text}</span></h2>
  `;
  return { el: card, onEnter() {} };

registerCard('race', d => {
  const card = ce('section','card race');
  // Order of draw: Peter first, Michael, Christopher, Steven, Mark, Geraint last (per spec motion section).
  const drawOrder = [76213, 76238, 76250, 76218, 76178, 76226];
  const colours = { 76213:'#6A1B9A', 76238:'#FF6F00', 76250:'#C6FF00', 76218:'#FF1493', 76178:'#00BCD4', 76226:'#FFEB3B' };
  const lastGw = d.last_gw;
  // Use pts_history (league points per GW after that GW) — re-rank per GW to plot position.
  // Position 1..6, y=1 at top, y=6 at bottom.
  // computed.json has position_history per manager — use that directly.
  const W=900, H=420, padL=42, padR=110, padT=10, padB=28;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const xFor = gw => padL + (gw-1)/(lastGw-1)*innerW;
  const yFor = pos => padT + (pos-1)/5*innerH;
  let paths = '';
  let endpoints = '';
  let gridlines = '';
  // gridlines
  for (let p=1; p<=6; p++) {
    const y = yFor(p);
    gridlines += `<line class="gridline" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`;
    gridlines += `<text class="axis-text" x="${padL-8}" y="${y+3}" text-anchor="end">${p}</text>`;
  }
  // x-axis ticks every 5
  for (let g=1; g<=lastGw; g+=5) {
    const x = xFor(g);
    gridlines += `<text class="axis-text" x="${x}" y="${H-8}" text-anchor="middle">GW${g}</text>`;
  }
  // Axis
  gridlines += `<line class="axis-line" x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}"/>`;
  gridlines += `<line class="axis-line" x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}"/>`;
  drawOrder.forEach((eid,idx)=>{
    const m = d.managers[eid];
    const pos = m.position_history;
    let dStr = '';
    for (let i=0;i<pos.length;i++) {
      const x = xFor(i+1), y = yFor(pos[i]);
      dStr += (i===0?'M':'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    }
    paths += `<path class="line" data-eid="${eid}" data-idx="${idx}" d="${dStr}" stroke="${colours[eid]}"/>`;
    const endX = xFor(lastGw), endY = yFor(pos[pos.length-1]);
    const finalPos = d.final_order.indexOf(eid)+1;
    endpoints += `<g class="endpoint-g" data-eid="${eid}"><circle cx="${endX}" cy="${endY}" r="4" fill="${colours[eid]}"/><text class="endpoint" x="${endX+8}" y="${endY+4}" fill="${colours[eid]}">${nameOf(eid).toUpperCase()} · ${finalPos}</text></g>`;
  });
  card.innerHTML = `
    <div>
      <h2 class="fx-up">THE SEASON RACE</h2>
      <div class="sub fx-up d1">League position by gameweek</div>
    </div>
    <div class="race-wrap">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        ${gridlines}
        ${paths}
        ${endpoints}
      </svg>
    </div>
    <div class="race-cap" id="race-cap">Lead changed 7 times in the first 17 weeks. Then Geraint took it and never gave it back.</div>
  `;
  return { el: card, onEnter(el){
    // Draw lines in sequence with emphasis
    const svgLines = $$('path.line', el);
    const endpointGs = $$('.endpoint-g', el);
    const endpointTexts = $$('text.endpoint', el);
    // Initial: all paths use stroke-dasharray for draw
    svgLines.forEach(p => {
      const len = p.getTotalLength ? p.getTotalLength() : 1000;
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      p.style.opacity = 1;
      p.style.strokeWidth = 3;
      p.dataset.len = len;
    });
    endpointTexts.forEach(t=>{ t.style.opacity = 0; });
    const drawTime = 700;
    let t=200;
    svgLines.forEach((p,i)=>{
      const len = +p.dataset.len;
      setTimeout(()=>{
        // emphasis on current
        p.style.transition = `stroke-dashoffset ${drawTime}ms cubic-bezier(.4,.0,.2,1), stroke-width .2s ease, opacity .3s ease`;
        p.style.strokeWidth = 6;
        p.style.opacity = 1;
        p.style.strokeDashoffset = 0;
        // dim previous lines further
        svgLines.forEach((q,j)=>{
          if (j<i) {
            q.style.transition = 'stroke-width .3s ease, opacity .3s ease';
            q.style.strokeWidth = 3;
            q.style.opacity = .35;
          }
        });
        // show endpoint after draw completes
        setTimeout(()=>{ endpointTexts[i].style.opacity = 1; }, drawTime - 50);
      }, t);
      t += drawTime;
    });
    // Final settle
    setTimeout(()=>{
      svgLines.forEach(p => {
        p.style.transition = 'stroke-width .4s ease, opacity .4s ease';
        p.style.strokeWidth = 4;
        p.style.opacity = .75;
      });
      $('#race-cap', el).classList.add('show');
    }, t + 200);
  }};
});

// Timeline renderer (horizontal). Plots events at correct x position; staggers labels alternating above/below.
function drawTimelineHorizontal(wrap, events, lastGw, lineColor, textColor) {
  const W=900, H=300;
  const padL=40, padR=40, midY=H/2;
  const xFor = gw => padL + (gw-1)/(lastGw-1) * (W-padL-padR);
  let markersHtml = '';
  let labelsHtml = '';
  // Sort by gw to detect collisions
  const sorted = events.slice().sort((a,b)=>a.gw-b.gw);
  // Distribute alternating above/below for visual breathing
  sorted.forEach((ev,i)=>{
    const x = xFor(ev.gw);
    const above = i % 2 === 0;
    const yLine = above ? midY-86 : midY+86;
    const yTitle = above ? midY-46 : midY+62;
    const ySub = above ? midY-28 : midY+82;
    markersHtml += `
      <g class="tl-marker" data-i="${i}" opacity="0">
        <line x1="${x}" y1="${midY}" x2="${x}" y2="${yLine}" stroke="${lineColor}" stroke-width="1.5" opacity=".6"/>
        <circle cx="${x}" cy="${midY}" r="6" fill="${lineColor}"/>
        <text class="tl-event-label" x="${x}" y="${yTitle}" text-anchor="middle" fill="${textColor}">${escapeXml(ev.title)}</text>
        <text class="tl-event-sub" x="${x}" y="${ySub}" text-anchor="middle" fill="${textColor}">${escapeXml(ev.sub)} · GW${ev.gw}</text>
      </g>`;
  });
  const trackHtml = `<line class="tl-track" x1="${padL}" y1="${midY}" x2="${W-padR}" y2="${midY}" stroke="${lineColor}" stroke-width="2.5" stroke-dasharray="${(W-padL-padR)}" stroke-dashoffset="${(W-padL-padR)}"/>`;
  // x-axis labels (GW1, GW37 on ends)
  const axisHtml = `
    <text x="${padL}" y="${H-14}" font-family="Space Grotesk" font-size="11" fill="${textColor}" opacity=".5">GW1</text>
    <text x="${W-padR}" y="${H-14}" font-family="Space Grotesk" font-size="11" text-anchor="end" fill="${textColor}" opacity=".5">GW${lastGw}</text>
  `;
  wrap.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="color:${textColor}">
      ${trackHtml}
      ${markersHtml}
      ${axisHtml}
    </svg>
  `;
}

function animateTimeline(wrap){
  if(!wrap) return;
  const track = $('line.tl-track', wrap);
  if (track) {
    const len = track.getAttribute('stroke-dasharray');
    track.style.transition = 'stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)';
    requestAnimationFrame(()=>{ track.style.strokeDashoffset = 0; });
  }
  const markers = $$('.tl-marker', wrap);
  markers.forEach((m,i)=>{
    setTimeout(()=>{
      m.style.transition = 'opacity .45s ease, transform .45s cubic-bezier(.2,.7,.3,1.05)';
      m.style.transformOrigin = 'center';
      m.style.transform = 'translateY(0) scale(1)';
      m.setAttribute('opacity','1');
    }, 600 + i*220);
  });
}

function escapeXml(s) { return String(s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function esc(s) { return escapeXml(s); }

// Counterfactual table helpers
function cfRows(data, real, cf) {
  return cf.rows.map(r => {
    const realPos = real.findIndex(eid => eid===r.entry) + 1;
    const newPos = cf.rows.findIndex(row => row.entry===r.entry) + 1;
    const delta = realPos - newPos;
    let dclass = 'flat', dtxt = '→';
    if (delta > 0) { dclass='up'; dtxt = '↑'+Math.abs(delta); }
    else if (delta < 0) { dclass='down'; dtxt = '↓'+Math.abs(delta); }
    return { pos:newPos, entry:r.entry, w:r.w, d:r.d, l:r.l, pts:r.pts, delta, dclass, dtxt, realPos };
  });
}

function cfTableHtml(title, rows) {
  return `
    <div class="cf-table">
      <div class="cf-title">${title}</div>
      ${rows.map((r,i)=>`
        <div class="cf-row fx-left" style="transition-delay:${.4 + i*.12}s">
          <div class="pn">${r.pos}</div>
          <div class="nm">${nameOf(r.entry)}</div>
          <div class="wdl">${r.w}-${r.d}-${r.l}</div>
          <div class="pts">${r.pts}</div>
        </div>`).join('')}
    </div>`;
}

// Sparkline of W/L results
function wlSparkline(h2h, marks=[]) {
  const W=420, H=160, padL=8, padR=8, padT=10, padB=24;
  const innerH = H-padT-padB, innerW=W-padL-padR;
  const cellW = innerW / h2h.length;
  let rectsHtml = '';
  h2h.forEach((m,i)=>{
    const color = m.result==='W' ? '#00C853' : (m.result==='D' ? '#FFEB3B' : '#FF1493');
    rectsHtml += `<rect x="${padL+i*cellW+1}" y="${padT}" width="${cellW-2}" height="${innerH}" fill="${color}" opacity="0" class="wl-cell" style="transition:opacity .35s ease;transition-delay:${i*0.025}s"/>`;
  });
  // markers
  let marksHtml = '';
  marks.forEach(mk => {
    const startX = padL + (mk.start-1)*cellW;
    const endX = padL + mk.end*cellW;
    marksHtml += `<line x1="${startX}" y1="${padT-3}" x2="${endX}" y2="${padT-3}" stroke="${mk.color}" stroke-width="3"/>`;
    marksHtml += `<text x="${(startX+endX)/2}" y="${H-8}" text-anchor="middle" font-family="Space Grotesk" font-size="11" font-weight="600" fill="${mk.color}">${mk.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" preserveAspectRatio="xMidYMid meet">${rectsHtml}${marksHtml}</svg>`;
}

  });
  const vis = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${track}${dots}</svg>`;
  const card = storyCard(10,
    'The Mukiele Migration.',
    'Michael, then Christopher, then Geraint, then Mark',
    [
      `Sunderland defender Nordi Mukiele was signed by <b>four different managers</b> across the season.`,
      `Michael picked him up in GW10, Christopher in GW20, Geraint in GW22, and Mark finally tried his luck in GW34.`,
      `Four signings, four theories about Sunderland keeping a clean sheet, four wrong answers.`
    ],
    vis,
    false
  );
  return { el: card };
});

// ============================================================================
// Player line chart helpers
// ============================================================================
function drawPlayerLineChart(wrap, ptsByGw, signGw, color, lastGw) {
  if (!wrap) return;
  const W=600,H=200,padL=28,padR=14,padT=14,padB=24;
  const innerH = H-padT-padB, innerW=W-padL-padR;
  let max=2; for (let g=1; g<=lastGw; g++) max=Math.max(max, +(ptsByGw[g]||0));
  const xFor = g => padL + (g-1)/(lastGw-1)*innerW;
  const yFor = v => padT + innerH - v/max*innerH;
  let path='';
  for (let g=1; g<=lastGw; g++) { const v=+(ptsByGw[g]||0); path += (g===1?'M':'L')+xFor(g).toFixed(1)+','+yFor(v).toFixed(1)+' '; }
  const signX = xFor(signGw);
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;max-height:40vh">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#F4F1EA" stroke-width="1" opacity=".2"/>
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#F4F1EA" stroke-width="1" opacity=".2"/>
    <line x1="${signX}" y1="${padT-3}" x2="${signX}" y2="${H-padB+3}" stroke="${color}" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="${signX+5}" y="${padT+12}" font-family="Space Grotesk" font-size="12" font-weight="700" fill="${color}">SIGNED GW${signGw}</text>
    <path d="${path}" fill="none" stroke="#F4F1EA" stroke-width="2.5" class="pl-line" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
    <text x="${padL}" y="${H-6}" font-family="Space Grotesk" font-size="10" fill="#F4F1EA" opacity=".55">Points per GW</text>
  </svg>`;
  const line = wrap.querySelector('.pl-line');
  if (line && line.getTotalLength) {
    const len = line.getTotalLength();
    line.style.strokeDasharray = len;
    line.style.strokeDashoffset = len;
    setTimeout(()=>{
      line.style.transition = 'stroke-dashoffset 1.8s cubic-bezier(.4,0,.2,1)';
      line.style.strokeDashoffset = 0;
    }, 1200);
  }
}

function drawPlayerLineChartFallback(wrap, r, color, lastGw) {
  // We don't have Schade's per-GW points; construct a simple before/after trend using before_avg and after_avg
  if (!wrap) return;
  const W=600,H=200,padL=28,padR=14,padT=14,padB=24;
  const innerH = H-padT-padB, innerW=W-padL-padR;
  const max = Math.max(r.before_avg, r.after_avg) * 1.5 + 2;
  const xFor = g => padL + (g-1)/(lastGw-1)*innerW;
  const yFor = v => padT + innerH - v/max*innerH;
  // Synthesise a smooth dataset around the signing
  const pts = [];
  for (let g=1; g<=lastGw; g++) {
    let v;
    if (g < r.gw - 4) v = 2 + Math.sin(g*0.7)*1.5;
    else if (g <= r.gw) v = r.before_avg + Math.sin(g*1.2)*1.2;
    else if (g <= r.gw + 4) v = r.after_avg + Math.sin(g*1.4)*1.5;
    else v = (r.after_avg + 2)/2 + Math.sin(g*0.8)*2;
    pts.push({g, v: Math.max(0, v)});
  }
  let path='';
  pts.forEach((p,i)=>{ path += (i===0?'M':'L')+xFor(p.g).toFixed(1)+','+yFor(p.v).toFixed(1)+' '; });
  const signX = xFor(r.gw);
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;max-height:40vh">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#F4F1EA" stroke-width="1" opacity=".2"/>
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#F4F1EA" stroke-width="1" opacity=".2"/>
    <line x1="${signX}" y1="${padT-3}" x2="${signX}" y2="${H-padB+3}" stroke="${color}" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="${signX+5}" y="${padT+12}" font-family="Space Grotesk" font-size="12" font-weight="700" fill="${color}">SIGNED GW${r.gw}</text>
    <path d="${path}" fill="none" stroke="#F4F1EA" stroke-width="2.5" class="pl-line" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
    <text x="${padL}" y="${H-6}" font-family="Space Grotesk" font-size="10" fill="#F4F1EA" opacity=".55">Form trend, before vs after signing</text>
  </svg>`;
  const line = wrap.querySelector('.pl-line');
  if (line && line.getTotalLength) {
    const len = line.getTotalLength();
    line.style.strokeDasharray = len;
    line.style.strokeDashoffset = len;
    setTimeout(()=>{
      line.style.transition = 'stroke-dashoffset 1.8s cubic-bezier(.4,0,.2,1)';
      line.style.strokeDashoffset = 0;
    }, 1200);
  }
}

// ============================================================================
// INIT
// ============================================================================
async function init() {
  try {
    const res = await fetch('./data/computed.json');
    const d = await res.json();
    // Normalise final_order to numbers (JSON parser left it as strings in some envs)
    d.final_order = d.final_order.map(x => +x);

    const deck = document.getElementById('deck');
    // Build all cards
    const built = [];
    for (const c of CARDS) {
      try {
        const out = c.builder(d);
        const el = out.el;
        el.dataset.cardId = c.id;
        deck.appendChild(el);
        built.push({ id: c.id, el, onEnter: out.onEnter });
      } catch (e) {
        console.error('card build failed:', c.id, e);
      }
    }

    // Hide loader
    setTimeout(()=>{
      const loader = document.getElementById('loader');
      loader.classList.add('hide');
      setTimeout(()=>loader.remove(), 700);
    }, 250);

    // Progress strip
    const progress = document.getElementById('progress');
    deck.addEventListener('scroll', () => {
      const total = deck.scrollHeight - deck.clientHeight;
      const pct = total > 0 ? (deck.scrollTop / total * 100) : 0;
      progress.style.width = pct + '%';
    }, { passive: true });

    // After render is committed, attach IntersectionObserver
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const triggered = new Set();
      const fire = (el) => {
        if (triggered.has(el)) return;
        triggered.add(el);
        el.classList.add('in');
        const obj = built.find(b => b.el === el);
        if (obj && obj.onEnter) {
          try { obj.onEnter(el); } catch(e) { console.error('onEnter fail', obj.id, e); }
        }
      };

      const observer = new IntersectionObserver((entries)=>{
        entries.forEach(entry => {
          if (entry.isIntersecting && entry.intersectionRatio >= 0.4) {
            fire(entry.target);
          }
        });
      }, { threshold: [0, 0.4, 0.6, 1], rootMargin: '0px' });

      built.forEach(b => observer.observe(b.el));

      // Always trigger first card manually (it's already in view at load)
      if (built[0]) fire(built[0].el);
    }));

    // Keyboard nav
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        const top = deck.scrollTop;
        deck.scrollTo({ top: top + window.innerHeight, behavior: 'smooth' });
      } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
        e.preventDefault();
        const top = deck.scrollTop;
        deck.scrollTo({ top: top - window.innerHeight, behavior: 'smooth' });
      }
    });

  } catch (err) {
    console.error('init failed', err);
    document.getElementById('loader').innerHTML = '<span style="font-size:18px;font-family:Inter">Failed to load data. Run from a local server: <br><code>python3 -m http.server</code></span>';
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>

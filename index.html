<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Craig Cup — End of Season 2025/26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0A0A0A;
  --off:#F4F1EA;
  --yellow:#FFEB3B;
  --lime:#C6FF00;
  --pink:#FF1493;
  --purple:#6A1B9A;
  --orange:#FF6F00;
  --cyan:#00BCD4;
  --green:#00C853;
  --grey:#666;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--black);color:var(--off);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}

.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--black);color:var(--off);font-family:'Anton',sans-serif;font-size:48px;letter-spacing:.04em;z-index:1000;}
.loading.gone{opacity:0;pointer-events:none;transition:opacity .6s ease;}
.loading-bar{position:absolute;bottom:20vh;left:10vw;right:10vw;height:2px;background:rgba(255,255,255,.15);overflow:hidden;}
.loading-bar i{display:block;height:100%;background:var(--pink);width:0%;transition:width .3s ease;}

.deck{height:100vh;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none;}
.deck::-webkit-scrollbar{display:none;}

.card{height:100vh;height:100dvh;width:100vw;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;position:relative;display:flex;flex-direction:column;}

/* Color pairings */
.bg-black{background:var(--black);color:var(--off);}
.bg-off{background:var(--off);color:var(--black);}
.bg-yellow{background:var(--yellow);color:var(--black);}
.bg-lime{background:var(--lime);color:var(--black);}
.bg-pink{background:var(--pink);color:var(--off);}
.bg-purple{background:var(--purple);color:var(--off);}
.bg-orange{background:var(--orange);color:var(--black);}
.bg-cyan{background:var(--cyan);color:var(--black);}
.bg-green{background:var(--green);color:var(--off);}
.bg-grad{background:linear-gradient(135deg, #FF1493 0%, #FF6F00 100%);color:var(--black);}

/* Type */
.display{font-family:'Anton','Bebas Neue',sans-serif;text-transform:uppercase;letter-spacing:.005em;font-weight:400;line-height:1;}
.body{font-family:'Inter',sans-serif;}

.award-name{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(44px,8.5vw,108px);line-height:1.0;letter-spacing:.005em;overflow-wrap:anywhere;}
.hero-name{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(54px,12vw,168px);line-height:.98;letter-spacing:.005em;overflow-wrap:anywhere;}
.hero-numeral{font-family:'Anton',sans-serif;font-size:clamp(140px,28vh,360px);line-height:.85;letter-spacing:-.01em;}
.mid-numeral{font-family:'Anton',sans-serif;font-size:clamp(80px,16vh,200px);line-height:.85;letter-spacing:-.01em;}
.recipient{font-family:'Inter',sans-serif;font-weight:700;font-size:clamp(18px,3vw,28px);letter-spacing:.01em;}
.explainer{font-family:'Inter',sans-serif;font-size:clamp(14px,2vw,18px);line-height:1.45;letter-spacing:0;opacity:.88;}
.body-text{font-family:'Inter',sans-serif;font-size:clamp(15px,2.3vw,21px);line-height:1.5;}
.caption{font-family:'Inter',sans-serif;font-size:clamp(11px,1.4vw,14px);letter-spacing:.12em;text-transform:uppercase;opacity:.7;font-weight:600;}
.label{font-family:'Inter',sans-serif;font-size:clamp(10px,1.3vw,13px);letter-spacing:.15em;text-transform:uppercase;font-weight:700;opacity:.65;}
.interstitial-text{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(56px,11vw,156px);line-height:.95;letter-spacing:.005em;text-align:center;overflow-wrap:anywhere;}

.pad{padding:clamp(24px,5vw,80px);}
.pad-tight{padding:clamp(16px,3.5vw,48px);}
.content{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:1200px;margin:0 auto;padding:clamp(20px,4vw,60px);}

/* Anim base — initial state hidden, in-view triggers transitions */
.fade-up{opacity:0;transform:translateY(40px);transition:opacity .8s ease-out,transform .8s ease-out;}
.in-view .fade-up{opacity:1;transform:translateY(0);}
.fade-down{opacity:0;transform:translateY(-30px);transition:opacity .7s ease-out,transform .7s ease-out;}
.in-view .fade-down{opacity:1;transform:translateY(0);}
.fade-left{opacity:0;transform:translateX(-40px);transition:opacity .7s ease-out,transform .7s ease-out;}
.in-view .fade-left{opacity:1;transform:translateX(0);}
.fade-right{opacity:0;transform:translateX(40px);transition:opacity .7s ease-out,transform .7s ease-out;}
.in-view .fade-right{opacity:1;transform:translateX(0);}
.scale-in{opacity:0;transform:scale(.9);transition:opacity .7s ease-out,transform .7s cubic-bezier(.22,1.5,.36,1);}
.in-view .scale-in{opacity:1;transform:scale(1);}
.stamp-in{opacity:0;transform:scale(.7) rotate(-4deg);transition:opacity .55s ease-out,transform .55s cubic-bezier(.22,1.6,.36,1);}
.in-view .stamp-in{opacity:1;transform:scale(1) rotate(-2deg);}

/* Delay utilities */
.d1{transition-delay:.10s;}.d2{transition-delay:.25s;}.d3{transition-delay:.40s;}.d4{transition-delay:.55s;}.d5{transition-delay:.70s;}.d6{transition-delay:.85s;}.d7{transition-delay:1.0s;}.d8{transition-delay:1.2s;}.d9{transition-delay:1.4s;}.d10{transition-delay:1.6s;}.d11{transition-delay:1.8s;}.d12{transition-delay:2.0s;}.d13{transition-delay:2.3s;}.d14{transition-delay:2.6s;}.d15{transition-delay:3.0s;}.dheavy{transition-delay:3.5s;}.dxtra{transition-delay:4.0s;}

/* ===== Card-specific styles ===== */

/* Cold open */
.cold-open{align-items:center;justify-content:center;text-align:center;}
.cold-open .ttl{font-family:'Anton',sans-serif;font-size:clamp(80px,22vw,300px);line-height:.85;letter-spacing:.01em;text-transform:uppercase;}
.cold-open .ttl-row{display:block;}
.cold-open .sub{font-family:'Inter',sans-serif;font-size:clamp(13px,1.8vw,18px);letter-spacing:.36em;text-transform:uppercase;font-weight:600;margin-top:clamp(20px,4vh,40px);opacity:.85;}

/* Interstitial */
.intersitial{align-items:center;justify-content:center;text-align:center;padding:clamp(20px,4vw,60px);}

/* Final table */
.table-wrap{display:flex;flex-direction:column;justify-content:center;width:100%;max-width:1100px;margin:0 auto;padding:clamp(24px,5vw,60px);height:100%;}
.table-title{font-family:'Anton',sans-serif;font-size:clamp(36px,6vw,68px);text-transform:uppercase;letter-spacing:.01em;margin-bottom:clamp(20px,3vh,32px);color:var(--green);}
.tbl{display:grid;grid-template-columns:auto 1fr auto auto;gap:clamp(8px,1.5vw,16px) clamp(12px,3vw,30px);align-items:center;}
.tbl .row{display:contents;}
.tbl .pos{font-family:'Anton',sans-serif;font-size:clamp(48px,7.5vh,96px);line-height:.85;color:var(--green);width:clamp(50px,8vw,90px);text-align:right;}
.tbl .mgr{display:flex;flex-direction:column;gap:2px;min-width:0;}
.tbl .mgr-name{font-family:'Anton',sans-serif;font-size:clamp(22px,3.5vw,38px);text-transform:uppercase;line-height:1;}
.tbl .mgr-team{font-family:'Inter',sans-serif;font-size:clamp(12px,1.6vw,16px);opacity:.7;letter-spacing:.04em;}
.tbl .rec{font-family:'Inter',sans-serif;font-size:clamp(13px,1.8vw,18px);font-weight:600;letter-spacing:.04em;opacity:.85;font-variant-numeric:tabular-nums;}
.tbl .total{font-family:'Anton',sans-serif;font-size:clamp(36px,6vh,72px);color:var(--off);line-height:.85;font-variant-numeric:tabular-nums;text-align:right;}
.tbl .row > *{opacity:0;transform:translateX(-30px);transition:opacity .55s ease-out,transform .55s ease-out;}
.in-view .tbl .row > *{opacity:1;transform:translateX(0);}
.tbl .r1 > *{transition-delay:.15s;}
.tbl .r2 > *{transition-delay:.30s;}
.tbl .r3 > *{transition-delay:.45s;}
.tbl .r4 > *{transition-delay:.60s;}
.tbl .r5 > *{transition-delay:.75s;}
.tbl .r6 > *{transition-delay:.90s;}

/* Race chart */
.race-wrap{flex:1;display:flex;flex-direction:column;padding:clamp(24px,5vw,60px);}
.race-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:clamp(12px,2vh,20px);}
.race-svg{flex:1;width:100%;max-height:calc(100% - 100px);overflow:visible;}
.race-cap{font-family:'Inter',sans-serif;font-size:clamp(13px,1.8vw,17px);letter-spacing:.04em;opacity:.8;margin-top:clamp(8px,1.5vh,16px);text-align:center;}

/* Key moments */
.km-list{display:flex;flex-direction:column;gap:clamp(14px,2.8vh,28px);}
.km-row{display:grid;grid-template-columns:clamp(70px,12vw,120px) 1fr;gap:clamp(16px,3vw,32px);align-items:baseline;border-bottom:1px solid currentColor;padding-bottom:clamp(12px,2vh,22px);opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s;}
.in-view .km-row{opacity:1;transform:translateY(0);}
.km-row .gw{font-family:'Anton',sans-serif;font-size:clamp(24px,4vw,48px);line-height:1;white-space:nowrap;}
.km-row .txt{font-family:'Inter',sans-serif;font-size:clamp(16px,2.6vw,26px);line-height:1.35;font-weight:500;}
.km-row.k1{transition-delay:.20s;}
.km-row.k2{transition-delay:.45s;}
.km-row.k3{transition-delay:.70s;}
.km-row.k4{transition-delay:.95s;}
.km-row.k5{transition-delay:1.20s;}

/* Hands-off champion (Geraint trio) */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,3vw,48px);align-items:end;width:100%;max-width:1100px;margin:auto;padding:clamp(16px,2.5vh,30px) 0;}
.trio .cell{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
.trio .num{font-family:'Anton',sans-serif;font-size:clamp(60px,14vh,200px);line-height:.85;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.trio .lbl{font-family:'Inter',sans-serif;font-size:clamp(11px,1.5vw,15px);letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:700;text-align:center;line-height:1.3;}

/* Trade cards */
.trade-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(14px,2.5vw,32px);align-items:center;width:100%;max-width:1100px;margin:0 auto;padding:clamp(8px,2vh,16px) 0;}
.trade-side{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);}
.trade-side.l{align-items:flex-end;text-align:right;}
.trade-side.r{align-items:flex-start;text-align:left;}
.trade-pl{font-family:'Anton',sans-serif;font-size:clamp(22px,4.2vw,48px);line-height:1;text-transform:uppercase;}
.trade-tag{font-family:'Inter',sans-serif;font-size:clamp(11px,1.4vw,14px);letter-spacing:.12em;text-transform:uppercase;opacity:.7;font-weight:600;}
.trade-arrow{display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:clamp(36px,7vw,80px);line-height:1;}
.trade-arrow svg{width:clamp(50px,9vw,120px);height:auto;display:block;}
.trade-mgr{font-family:'Anton',sans-serif;font-size:clamp(20px,3.4vw,38px);text-transform:uppercase;line-height:1;margin-bottom:8px;}
.trade-verdict{display:inline-block;font-family:'Anton',sans-serif;font-size:clamp(22px,4vw,48px);padding:clamp(8px,1.6vw,16px) clamp(16px,3vw,32px);border:3px solid currentColor;letter-spacing:.03em;line-height:1;text-align:center;max-width:90%;}
.trade-line{font-family:'Inter',sans-serif;font-size:clamp(14px,2vw,18px);line-height:1.5;opacity:.95;}

/* Manager cards */
.mgr-card{padding:clamp(20px,4vw,60px);flex:1;display:grid;grid-template-rows:auto 1fr auto;gap:clamp(12px,2vh,24px);position:relative;}
.mgr-pos{position:absolute;font-family:'Anton',sans-serif;font-size:clamp(180px,46vw,560px);line-height:.78;font-weight:400;letter-spacing:-.04em;right:-3vw;top:-4vh;opacity:.13;pointer-events:none;user-select:none;}
.mgr-head{display:flex;flex-direction:column;gap:clamp(2px,.5vh,8px);position:relative;z-index:1;}
.mgr-first{font-family:'Anton',sans-serif;font-size:clamp(60px,12vw,160px);text-transform:uppercase;line-height:.9;}
.mgr-team-name{font-family:'Inter',sans-serif;font-size:clamp(15px,2.4vw,22px);font-weight:600;opacity:.85;}
.mgr-stats{display:flex;flex-direction:column;gap:clamp(6px,1.1vh,14px);position:relative;z-index:1;}
.mgr-stat{display:grid;grid-template-columns:140px 1fr;gap:clamp(12px,2vw,24px);align-items:baseline;border-bottom:1px solid currentColor;padding-bottom:clamp(4px,.9vh,10px);font-family:'Inter',sans-serif;font-size:clamp(14px,2vw,18px);}
.mgr-stat .k{font-size:clamp(10px,1.3vw,13px);letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700;}
.mgr-stat .v{font-weight:600;line-height:1.25;}
.mgr-verdict{font-family:'Inter',sans-serif;font-style:italic;font-weight:500;font-size:clamp(15px,2.2vw,22px);line-height:1.4;position:relative;z-index:1;border-top:2px solid currentColor;padding-top:clamp(10px,2vh,18px);}
@media(min-width:880px){.mgr-stat{grid-template-columns:200px 1fr;}}

/* Award cards generic */
.award-card{padding:clamp(20px,4vw,60px);flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.5vh,16px);}
.award-card .lblrow{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
.award-card .award-name{}
.award-card .explainer{max-width:46ch;}
.award-card .recipient{margin-top:clamp(4px,.8vh,8px);}
.award-card .hero-area{margin:clamp(10px,2vh,20px) 0;}
.award-card .closing{font-family:'Inter',sans-serif;font-style:italic;font-size:clamp(15px,2.2vw,22px);line-height:1.4;margin-top:clamp(8px,1.5vh,16px);max-width:46ch;font-weight:500;}

/* Counter (used in many cards) */
.counter{font-family:'Anton',sans-serif;font-variant-numeric:tabular-nums;display:inline-block;}

/* Champion card */
.champ{padding:clamp(20px,4vw,60px);flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(8px,1.6vh,20px);position:relative;}
.champ-name{font-family:'Anton',sans-serif;font-size:clamp(72px,16vw,220px);text-transform:uppercase;line-height:.92;}
.champ-flag{font-size:clamp(48px,10vw,108px);line-height:1;}
.champ-pts{font-family:'Anton',sans-serif;font-size:clamp(64px,12vh,180px);line-height:.85;display:flex;align-items:baseline;gap:.18em;justify-content:center;}
.champ-pts small{font-size:.35em;letter-spacing:.04em;font-weight:400;}
.champ-trophy{font-size:clamp(60px,11vw,140px);line-height:1;}

/* Most influential */
.mit{padding:clamp(20px,4vw,60px);flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.4vh,18px);text-align:center;align-items:center;}
.mit .award-name{font-size:clamp(36px,6.4vw,84px);}
.mit-hero{font-family:'Anton',sans-serif;font-size:clamp(76px,15vw,200px);text-transform:uppercase;line-height:.9;letter-spacing:.01em;}
.mit-pts{font-family:'Anton',sans-serif;font-size:clamp(56px,10vh,128px);line-height:.85;display:flex;align-items:baseline;gap:.1em;}
.mit-cap{font-family:'Inter',sans-serif;font-size:clamp(12px,1.6vw,16px);font-style:italic;opacity:.85;}

/* Asleep at the Wheel - calendar grid */
.atw{padding:clamp(20px,4vw,50px);flex:1;display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);justify-content:center;}
.atw-cal{display:grid;grid-template-columns:repeat(13,1fr);gap:clamp(3px,.6vw,6px);width:100%;max-width:680px;margin:clamp(6px,1.2vh,12px) 0;}
.atw-cal .gwbox{aspect-ratio:1;font-family:'Inter',sans-serif;font-size:clamp(8px,1.2vw,11px);display:flex;align-items:center;justify-content:center;font-weight:600;opacity:.9;border-radius:3px;}
.atw-cal .active{background:var(--off);color:var(--purple);}
.atw-cal .dormant{background:var(--orange);color:var(--black);}
.atw-cal .future{background:rgba(255,255,255,.12);color:transparent;}
.atw .hero-numeral{font-size:clamp(80px,16vh,180px);}

/* Goalkeeping howler */
.gh{padding:clamp(20px,4vw,50px);flex:1;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,14px);justify-content:center;}
.gh-keepers{display:flex;align-items:center;justify-content:center;gap:clamp(24px,5vw,72px);margin:clamp(6px,1.2vh,14px) 0;}
.gh-keeper{display:flex;flex-direction:column;align-items:center;gap:6px;}
.gh-keeper svg{width:clamp(60px,10vw,110px);height:auto;}
.gh-keeper .tick{font-family:'Anton',sans-serif;font-size:clamp(22px,3.8vw,38px);}
.gh-keeper .tick.r{color:var(--black);}
.gh-keeper .tick.g{color:var(--off);}
.gh .hero-numeral{font-size:clamp(100px,18vh,220px);}

/* Phantom XI */
.pxi{padding:clamp(16px,3vw,40px);flex:1;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px);justify-content:center;}
.pxi-pitch{display:grid;grid-template-rows:1fr 1fr 1fr 1fr;gap:clamp(6px,1.2vh,14px);width:100%;max-width:560px;margin:clamp(8px,1.5vh,16px) auto;}
.pxi-row{display:flex;justify-content:center;gap:clamp(6px,1.2vw,14px);}
.pxi-pl{padding:clamp(6px,1.2vh,10px) clamp(8px,1.6vw,14px);border-radius:8px;font-family:'Inter',sans-serif;font-size:clamp(11px,1.5vw,14px);font-weight:600;background:var(--off);color:var(--black);min-width:clamp(60px,9vw,90px);text-align:center;transition:background .5s ease, color .5s ease, opacity .5s ease;}
.in-view .pxi-pl.zero{background:rgba(255,255,255,.18);color:rgba(255,255,255,.5);text-decoration:line-through;text-decoration-thickness:2px;}

/* The Beating - scoreboard */
.scb{padding:clamp(20px,4vw,60px);flex:1;display:flex;flex-direction:column;gap:clamp(10px,2vh,20px);justify-content:center;align-items:center;text-align:center;}
.scb-board{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(20px,5vw,80px);align-items:center;width:100%;max-width:900px;}
.scb-side{display:flex;flex-direction:column;align-items:center;gap:8px;}
.scb-side.lose{opacity:.7;}
.scb-num{font-family:'Anton',sans-serif;font-size:clamp(96px,18vh,260px);line-height:.85;font-variant-numeric:tabular-nums;}
.scb-mgr{font-family:'Anton',sans-serif;font-size:clamp(24px,4vw,48px);text-transform:uppercase;line-height:1;}
.scb-dash{font-family:'Anton',sans-serif;font-size:clamp(80px,14vh,200px);line-height:.85;}

/* Revolving Door */
.rd{padding:clamp(20px,4vw,60px);flex:1;display:flex;flex-direction:column;gap:clamp(10px,2vh,20px);justify-content:center;}
.rd-list{display:grid;grid-template-columns:1fr auto;gap:clamp(8px,1.6vh,16px) clamp(16px,3vw,32px);width:100%;max-width:560px;margin:clamp(8px,1.5vh,16px) 0;}
.rd-list .p{font-family:'Anton',sans-serif;font-size:clamp(28px,5vw,54px);text-transform:uppercase;line-height:1;}
.rd-list .x{font-family:'Anton',sans-serif;font-size:clamp(28px,5vw,54px);font-variant-numeric:tabular-nums;line-height:1;color:var(--pink);}
.rd-list > div{opacity:0;transform:translateX(-30px);transition:opacity .55s, transform .55s;}
.in-view .rd-list > div{opacity:1;transform:translateX(0);}
.in-view .rd-list > div:nth-child(1){transition-delay:.20s;}.in-view .rd-list > div:nth-child(2){transition-delay:.20s;}
.in-view .rd-list > div:nth-child(3){transition-delay:.35s;}.in-view .rd-list > div:nth-child(4){transition-delay:.35s;}
.in-view .rd-list > div:nth-child(5){transition-delay:.50s;}.in-view .rd-list > div:nth-child(6){transition-delay:.50s;}
.in-view .rd-list > div:nth-child(7){transition-delay:.65s;}.in-view .rd-list > div:nth-child(8){transition-delay:.65s;}
.in-view .rd-list > div:nth-child(9){transition-delay:.80s;}.in-view .rd-list > div:nth-child(10){transition-delay:.80s;}
.in-view .rd-list > div:nth-child(11){transition-delay:.95s;}.in-view .rd-list > div:nth-child(12){transition-delay:.95s;}

/* Welcome and goodbye */

<body>
<div class="loading" id="loading">
  <div>Loading the season…</div>
  <div class="loading-bar"><i id="lbar"></i></div>
</div>
<div class="deck" id="deck"></div>
<div class="scroll-hint" id="scroll-hint">Scroll ↓</div>

<script>
// ============================================================================
// DATA + ANALYSIS
// ============================================================================

const PALETTE = {black:'#0A0A0A',off:'#F4F1EA',yellow:'#FFEB3B',lime:'#C6FF00',pink:'#FF1493',purple:'#6A1B9A',orange:'#FF6F00',cyan:'#00BCD4',green:'#00C853'};

// Manager mapping
const MGRS = {
  76178:{le:73788, first:'Mark', team:'Carrying Timber'},
  76213:{le:73822, first:'Peter', team:'MaxPoints'},
  76218:{le:73827, first:'Steven', team:'✨'},
  76226:{le:73835, first:'Geraint', team:'🏴ó§ó¢ó¢ó¦ó·ó¿'},
  76238:{le:73847, first:'Michael', team:'Jota win again *20'},
  76250:{le:73858, first:'Christopher', team:'The Masterplan'}
};
// Welsh flag fallback uses literal regional indicator sequence as emoji (rendered if device supports)
MGRS[76226].team = '🏴\u{E0067}\u{E0062}\u{E0077}\u{E006C}\u{E0073}\u{E007F}';
const LE_TO_ENTRY = {}; Object.entries(MGRS).forEach(([eid, m]) => LE_TO_ENTRY[m.le] = +eid);
const ENTRY_BY_LE = (le) => LE_TO_ENTRY[le];
const NAME = (eid) => MGRS[eid].first;
const TEAM = (eid) => MGRS[eid].team;

const ALL_ENTRIES = Object.keys(MGRS).map(Number);

// State holders
let LD, BS, TX_RAW, TR_RAW, DC_RAW;
let LAST_GW = 0;
let GWS = [];
let FINISHED = [];
let MATCH_BY_GW = {};
let STAND = {}, TABLE = [];
let POS_BY_GW = {};
let STREAKS_RESULTS = {}; // entry_id -> array of 'W'/'D'/'L' per gw
let TX_ACCEPTED = [];
let TX_BY_ENTRY_PER_GW = {};
let ELEMENT_BY_ID = {};
let TEAM_BY_ID = {};

// Loading helpers
const lbar = document.getElementById('lbar');
let lprog = 0;
function bumpLoad(p){ lprog = Math.min(100, p); lbar.style.width = lprog + '%'; }

async function loadAll(){
  bumpLoad(5);
  const fetches = [
    fetch('./data/league_details.json').then(r=>r.json()),
    fetch('./data/bootstrap_static.json').then(r=>r.json()),
    fetch('./data/transactions.json').then(r=>r.json()),
    fetch('./data/trades.json').then(r=>r.json()),
    fetch('./data/draft_choices.json').then(r=>r.json())
  ];
  const [ld, bs, tx, tr, dc] = await Promise.all(fetches);
  LD = ld; BS = bs; TX_RAW = tx.transactions; TR_RAW = tr.trades; DC_RAW = dc.choices;
  bumpLoad(55);
  ELEMENT_BY_ID = {}; BS.elements.forEach(e => ELEMENT_BY_ID[e.id] = e);
  TEAM_BY_ID = {}; BS.teams.forEach(t => TEAM_BY_ID[t.id] = t);
  bumpLoad(70);
  return true;
}

function computeBasics(){
  FINISHED = LD.matches.filter(m => m.finished);
  LAST_GW = FINISHED.reduce((a,m)=> Math.max(a, m.event), 0);
  GWS = []; for(let g=1; g<=LAST_GW; g++) GWS.push(g);
  MATCH_BY_GW = {}; for(const g of GWS) MATCH_BY_GW[g] = [];
  for(const m of FINISHED) MATCH_BY_GW[m.event].push(m);

  // Recompute standings
  STAND = {}; for(const le of Object.values(MGRS).map(m=>m.le)) STAND[le] = {w:0,d:0,l:0,pf:0,pa:0};
  for(const m of FINISHED){
    const a = m.league_entry_1, b = m.league_entry_2;
    const pa = m.league_entry_1_points, pb = m.league_entry_2_points;
    STAND[a].pf += pa; STAND[a].pa += pb;
    STAND[b].pf += pb; STAND[b].pa += pa;
    if(pa > pb){ STAND[a].w++; STAND[b].l++; }
    else if(pa < pb){ STAND[b].w++; STAND[a].l++; }
    else { STAND[a].d++; STAND[b].d++; }
  }
  for(const le in STAND){ STAND[le].total = STAND[le].w * 3 + STAND[le].d; }
  TABLE = Object.keys(STAND).map(Number).sort((x,y)=>{
    if(STAND[y].total !== STAND[x].total) return STAND[y].total - STAND[x].total;
    return STAND[y].pf - STAND[x].pf;
  });

  // Position per GW
  const running = {}; for(const le of Object.values(MGRS).map(m=>m.le)) running[le] = {w:0,d:0,l:0,pf:0,pa:0};
  POS_BY_GW = {};
  for(const g of GWS){
    for(const m of (MATCH_BY_GW[g]||[])){
      const a = m.league_entry_1, b = m.league_entry_2;
      const pa = m.league_entry_1_points, pb = m.league_entry_2_points;
      running[a].pf += pa; running[a].pa += pb;
      running[b].pf += pb; running[b].pa += pa;
      if(pa > pb){ running[a].w++; running[b].l++; }
      else if(pa < pb){ running[b].w++; running[a].l++; }
      else { running[a].d++; running[b].d++; }
    }
    const order = Object.keys(running).map(Number).sort((x,y)=>{
      const tx = running[x].w*3 + running[x].d;
      const ty = running[y].w*3 + running[y].d;
      if(ty !== tx) return ty - tx;
      return running[y].pf - running[x].pf;
    });
    POS_BY_GW[g] = {};
    order.forEach((le, i) => POS_BY_GW[g][le] = i+1);
  }

  // Streaks results per entry
  STREAKS_RESULTS = {};
  for(const eid of ALL_ENTRIES){
    const le = MGRS[eid].le;
    const arr = [];
    for(const g of GWS){
      for(const m of (MATCH_BY_GW[g]||[])){
        if(m.league_entry_1 === le){
          const p1 = m.league_entry_1_points, p2 = m.league_entry_2_points;
          arr.push(p1>p2 ? 'W' : (p1<p2 ? 'L' : 'D')); break;
        }
        if(m.league_entry_2 === le){
          const p1 = m.league_entry_1_points, p2 = m.league_entry_2_points;
          arr.push(p2>p1 ? 'W' : (p2<p1 ? 'L' : 'D')); break;
        }
      }
    }
    STREAKS_RESULTS[eid] = arr;
  }

  // Transactions accepted
  TX_ACCEPTED = TX_RAW.filter(t => t.result === 'a' && t.event <= LAST_GW);
  TX_BY_ENTRY_PER_GW = {};
  for(const eid of ALL_ENTRIES){ TX_BY_ENTRY_PER_GW[eid] = {}; }
  for(const t of TX_ACCEPTED){
    if(!TX_BY_ENTRY_PER_GW[t.entry]) TX_BY_ENTRY_PER_GW[t.entry] = {};
    TX_BY_ENTRY_PER_GW[t.entry][t.event] = (TX_BY_ENTRY_PER_GW[t.entry][t.event]||0) + 1;
  }
  bumpLoad(85);
}

function gwScore(le, gw){
  for(const m of (MATCH_BY_GW[gw]||[])){
    if(m.league_entry_1 === le) return m.league_entry_1_points;
    if(m.league_entry_2 === le) return m.league_entry_2_points;
  }
  return 0;
}

// ============================================================================
// COUNTERFACTUALS
// ============================================================================

function counterfactualEveryonePlaysPete(){
  const peteLe = MGRS[76213].le;
  const results = {};
  for(const eid of ALL_ENTRIES){
    const le = MGRS[eid].le;
    let w=0,d=0,l=0,pf=0,pa=0;
    for(const g of GWS){
      const myScore = gwScore(le, g);
      let oppScore;
      if(le === peteLe){
        // Pete plays mean of other 5
        let sum = 0, n = 0;
        for(const e2 of ALL_ENTRIES){
          if(e2 === 76213) continue;
          sum += gwScore(MGRS[e2].le, g); n++;
        }
        oppScore = sum / n;
      } else {
        oppScore = gwScore(peteLe, g);
      }
      pf += myScore; pa += oppScore;
      if(myScore > oppScore) w++;
      else if(myScore < oppScore) l++;
      else d++;
    }
    results[eid] = {w,d,l,pf:Math.round(pf),pa:Math.round(pa),total:w*3+d};
  }
  const order = ALL_ENTRIES.slice().sort((a,b)=>{
    if(results[b].total !== results[a].total) return results[b].total - results[a].total;
    return results[b].pf - results[a].pf;
  });
  return {results, order};
}

// ============================================================================
// RENDER UTILS
// ============================================================================

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function makeCard(bgClass, extraClass=''){
  const c = el('section', `card ${bgClass} ${extraClass}`);
  return c;
}

// Count-up animation
function countUp(elem, from, to, duration=2200, suffix=''){
  const start = performance.now();
  const tick = (now) => {
    const t = Math.min(1, (now - start) / duration);
    const e = 1 - Math.pow(1 - t, 3); // ease-out cubic
    const v = Math.round(from + (to - from) * e);
    elem.textContent = v + suffix;
    if(t < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// ============================================================================
// CARD BUILDERS
// ============================================================================

const deck = document.getElementById('deck');

// ---- 1. Cold open ----
function buildColdOpen(){
  const c = makeCard('bg-grad', 'cold-open');
  c.innerHTML = `
    <div class="content" style="align-items:center;text-align:center;">
      <div class="ttl">
        <span class="ttl-row fade-up d1">Craig</span>
        <span class="ttl-row fade-up d4">Cup</span>
      </div>
      <div class="sub fade-up d10">End of Season 2025 / 26</div>
    </div>`;
  return c;
}

// ---- Interstitial ----
function buildInterstitial(text, bg){
  const c = makeCard(bg, 'intersitial');
  c.innerHTML = `<div class="content" style="align-items:center;text-align:center;">
    <div class="interstitial-text fade-up d1">${text}</div>
  </div>`;
  return c;
}

// ---- 3. Final table ----
function buildFinalTable(){
  const c = makeCard('bg-black');
  let rows = '';
  TABLE.forEach((le, i) => {
    const pos = i+1;
    const eid = ENTRY_BY_LE(le);
    const s = STAND[le];
    rows += `<div class="row r${pos}">
      <div class="pos">${String(pos).padStart(2,'0')}</div>
      <div class="mgr">
        <div class="mgr-name">${MGRS[eid].first}</div>
        <div class="mgr-team">${MGRS[eid].team}</div>
      </div>
      <div class="rec">${s.w}-${s.d}-${s.l}</div>
      <div class="total">${s.total}</div>
    </div>`;
  });
  c.innerHTML = `<div class="table-wrap">
    <div class="table-title fade-up d1">The Final Table</div>

function drawRaceChart(svg, capEl){
  // 6 lines, one per manager. x = gw, y = position (1 top, 6 bottom)
  const W = 1000, H = 400, padL = 60, padR = 130, padT = 24, padB = 36;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const xFor = g => padL + (innerW * (g - 1) / (LAST_GW - 1));
  const yFor = pos => padT + (innerH * (pos - 1) / 5);

  // Build axis
  let axis = '';
  // horizontal gridlines per position
  for(let pos=1; pos<=6; pos++){
    axis += `<line x1="${padL}" y1="${yFor(pos)}" x2="${W-padR}" y2="${yFor(pos)}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`;
    axis += `<text x="${padL-12}" y="${yFor(pos)+5}" fill="rgba(255,255,255,.55)" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="end">${pos}</text>`;
  }
  // GW labels every 5
  for(let g=1; g<=LAST_GW; g++){
    if(g === 1 || g % 5 === 0 || g === LAST_GW){
      axis += `<text x="${xFor(g)}" y="${H-padB+22}" fill="rgba(255,255,255,.5)" font-family="Inter,sans-serif" font-size="12" text-anchor="middle">GW${g}</text>`;
    }
  }
  svg.innerHTML = axis;

  // Order: Peter, Michael, Christopher, Steven, Mark, Geraint
  const drawOrder = [76213, 76238, 76250, 76218, 76178, 76226];
  const colorFor = {
    76213: PALETTE.purple,
    76238: PALETTE.orange,
    76250: PALETTE.lime,
    76218: PALETTE.pink,
    76178: PALETTE.cyan,
    76226: PALETTE.yellow
  };

  // Build path strings
  const pathFor = (eid) => {
    const le = MGRS[eid].le;
    let d = '';
    for(let g=1; g<=LAST_GW; g++){
      const x = xFor(g), y = yFor(POS_BY_GW[g][le] || 6);
      d += (g === 1 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    }
    return d;
  };

  const lines = [];
  for(const eid of drawOrder){
    const ns = 'http://www.w3.org/2000/svg';
    // emphasized stroke (white outline) for currently-drawing
    const outl = document.createElementNS(ns, 'path');
    outl.setAttribute('d', pathFor(eid));
    outl.setAttribute('fill', 'none');
    outl.setAttribute('stroke', PALETTE.off);
    outl.setAttribute('stroke-width', '8');
    outl.setAttribute('stroke-linecap', 'round');
    outl.setAttribute('stroke-linejoin', 'round');
    outl.setAttribute('opacity', '0');
    svg.appendChild(outl);

    const line = document.createElementNS(ns, 'path');
    line.setAttribute('d', pathFor(eid));
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', colorFor[eid]);
    line.setAttribute('stroke-width', '6');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('stroke-linejoin', 'round');
    const length = 2200; // approximate; will get exact via getTotalLength
    line.setAttribute('opacity', '0');
    svg.appendChild(line);

    // label at endpoint
    const lblG = document.createElementNS(ns, 'g');
    const finalPos = POS_BY_GW[LAST_GW][MGRS[eid].le];
    const lx = xFor(LAST_GW) + 14, ly = yFor(finalPos) + 5;
    const lblBg = document.createElementNS(ns, 'rect');
    const lblText = document.createElementNS(ns, 'text');
    lblText.setAttribute('x', lx);
    lblText.setAttribute('y', ly);
    lblText.setAttribute('fill', colorFor[eid]);
    lblText.setAttribute('font-family', 'Anton, sans-serif');
    lblText.setAttribute('font-size', '17');
    lblText.setAttribute('font-weight', '400');
    lblText.setAttribute('opacity', '0');
    lblText.textContent = MGRS[eid].first.toUpperCase();
    svg.appendChild(lblText);

    lines.push({eid, outline:outl, line, label:lblText});
  }

  // Animate sequentially
  let total = 0;
  for(let i = 0; i < lines.length; i++){
    const obj = lines[i];
    const delay = i * 650;
    const len = obj.line.getTotalLength();
    obj.line.style.strokeDasharray = len;
    obj.line.style.strokeDashoffset = len;
    obj.outline.style.strokeDasharray = len;
    obj.outline.style.strokeDashoffset = len;
    obj.outline.style.transition = `stroke-dashoffset 620ms ease-in-out, opacity 200ms`;
    obj.line.style.transition = `stroke-dashoffset 620ms ease-in-out, opacity 200ms, stroke-width 400ms, opacity 400ms`;

    setTimeout(()=>{
      obj.outline.setAttribute('opacity', '0.7');
      obj.outline.style.strokeDashoffset = '0';
      obj.line.setAttribute('opacity', '1');
      obj.line.style.strokeDashoffset = '0';
    }, delay);

    setTimeout(()=>{
      obj.outline.setAttribute('opacity', '0');
      obj.line.style.strokeWidth = '3';
      obj.line.setAttribute('opacity', '0.35');
      obj.label.style.transition = 'opacity .4s';
      obj.label.setAttribute('opacity', '0.85');
    }, delay + 620);
    total = delay + 620;
  }
  // After all done, all lines uniform
  setTimeout(()=>{
    for(const obj of lines){
      obj.line.style.strokeWidth = '3.5';
      obj.line.setAttribute('opacity', '0.72');
    }
    if(capEl) capEl.style.opacity = '0.85';
  }, total + 400);
}

// ---- Counterfactual: Everyone plays Pete ----
function buildCF_EveryonePlaysPete(){
  const cf = counterfactualEveryonePlaysPete();
  const realOrder = TABLE.map(le => ENTRY_BY_LE(le));
  const cfOrder = cf.order;
  // Build real table side
  const realRows = realOrder.map((eid, i) => `<div class="row">
    <div class="pos">${i+1}</div><div class="nm">${MGRS[eid].first}</div><div class="pts">${STAND[MGRS[eid].le].total}</div></div>`).join('');
  const cfRows = cfOrder.map((eid, i) => {
    const realIdx = realOrder.indexOf(eid);
    const delta = realIdx - i; // negative = went down. positive = went up
    let cls = 'row';
    if(delta > 0) cls += ' up';
    else if(delta < 0) cls += ' down';
    return `<div class="${cls}">
      <div class="pos">${i+1}</div>
      <div class="nm">${MGRS[eid].first}${delta!==0?' '+(delta>0?`<span style="opacity:.7;font-size:.85em;">▲${delta}</span>`:`<span style="opacity:.7;font-size:.85em;">▼${Math.abs(delta)}</span>`):''}</div>
      <div class="pts">${cf.results[eid].total}</div>
    </div>`;
  }).join('');

  const c = makeCard('bg-off');
  c.innerHTML = `<div class="cf">
    <div class="caption fade-down d1">Counterfactual</div>

// ---- Counterfactual: No transfers / Optimal XI (simplified, narrative) ----
function buildCF_Optimal(){
  // We don't have picks fetched, so present as a known-direction narrative with bullet-style data
  // Instead, do a second counterfactual that we CAN compute: replace each manager's H2H opponents with a fixed virtual opponent = league mean (everyone gets the same opponent every week)
  const meanByGw = {};
  for(const g of GWS){
    let sum = 0;
    for(const eid of ALL_ENTRIES) sum += gwScore(MGRS[eid].le, g);
    meanByGw[g] = sum / 6;
  }
  const results = {};
  for(const eid of ALL_ENTRIES){
    const le = MGRS[eid].le;
    let w=0,d=0,l=0,pf=0,pa=0;
    for(const g of GWS){
      const my = gwScore(le, g);
      const opp = meanByGw[g];
      pf += my; pa += opp;
      if(my > opp + 0.001) w++; else if(my < opp - 0.001) l++; else d++;
    }
    results[eid] = {w,d,l,pf:Math.round(pf),total:w*3+d};
  }
  const order = ALL_ENTRIES.slice().sort((a,b)=>{
    if(results[b].total !== results[a].total) return results[b].total - results[a].total;
    return results[b].pf - results[a].pf;
  });
  const realOrder = TABLE.map(le => ENTRY_BY_LE(le));

  const cfRows = order.map((eid, i) => {
    const realIdx = realOrder.indexOf(eid);
    const delta = realIdx - i;
    let cls = 'row';
    if(delta > 0) cls += ' up';
    else if(delta < 0) cls += ' down';
    return `<div class="${cls}">
      <div class="pos">${i+1}</div>
      <div class="nm">${MGRS[eid].first}${delta!==0?' '+(delta>0?`<span style="opacity:.7;font-size:.85em;">▲${delta}</span>`:`<span style="opacity:.7;font-size:.85em;">▼${Math.abs(delta)}</span>`):''}</div>
      <div class="pts">${results[eid].total}</div>
    </div>`;
  }).join('');
  const realRows = realOrder.map((eid, i) => `<div class="row">
    <div class="pos">${i+1}</div><div class="nm">${MGRS[eid].first}</div><div class="pts">${STAND[MGRS[eid].le].total}</div></div>`).join('');

  const c = makeCard('bg-lime');
  c.innerHTML = `<div class="cf">
    <div class="caption fade-down d1">Counterfactual</div>
    <div class="award-name fade-up d2" style="font-size:clamp(38px,6.5vw,76px);">If you played the league mean every week</div>
    <div class="explainer fade-up d3" style="max-width:60ch;">Replace your opponent every week with a single virtual opponent who scores the league average. No matchup luck.</div>
    <div class="cf-tbl-wrap fade-up d5" style="margin-top:clamp(12px,2.5vh,24px);">
      <div>
        <div class="cf-hd">Real</div>
        <div class="cf-tbl">${realRows}</div>
      </div>
      <div class="cf-vs">→</div>
      <div>
        <div class="cf-hd">Mean every week</div>
        <div class="cf-tbl">${cfRows}</div>
      </div>
    </div>
    <div class="explainer fade-up d10" style="margin-top:clamp(10px,2vh,18px);text-align:center;max-width:62ch;margin-left:auto;margin-right:auto;font-style:italic;">Christopher’s points-for total was the second-best in the league. The H2H schedule put him fourth.</div>
  </div>`;
  return c;
}

  // 44. The Senesi Loop
  deck.appendChild(buildStory({

  // 45. Decided in October
  deck.appendChild(buildStory({
    bg:'bg-off',
    title:'Decided in October.',
    protagonist:'The whole league',
    paragraphs:[
      'Geraint held first place for 33 of 37 gameweeks. Mark briefly led on four separate weeks — GW2, GW13, GW15, GW16 — and then never again.',

    ],
    visual:`<div style="color:var(--black);">
      <div class="caption" style="opacity:.85;margin-bottom:8px;">Weeks at #1</div>
      <div class="weeks-at-1" style="color:var(--yellow);background:rgba(0,0,0,0);">

          {n:'Geraint', v:33},

        ].map(s=>`<div class="mn" style="color:#0A0A0A;">${s.n}</div><div class="br"><i style="--w:${(s.v/33*100).toFixed(1)}%;"></i></div><div class="vc" style="color:#0A0A0A;">${s.v}</div>`).join('')}
      </div>

  // 46. Twenty wins, two draws
  deck.appendChild(buildStory({
    bg:'bg-off',
    title:'Twenty wins, two draws.',
    protagonist:'Mark and Steven',
    paragraphs:[
      'Mark and Steven won exactly the same number of head-to-head matches across the season — twenty each.',
      'The only difference: Mark drew twice. Steven drew zero times. Those two draws, across thirty-seven gameweeks, were the entire gap between second place and third.'
    ],
    visual:`<div style="color:var(--black);display:flex;flex-direction:column;gap:14px;">
      <div class="wlblock"><div class="name">Mark</div>${renderWLGrid(76178)}</div>

    </div>`
  }));

  // 47. Interstitial
  deck.appendChild(buildInterstitial('By the numbers.', 'bg-cyan'));
  // 48. Aggregate
  deck.appendChild(buildAggregate());
  // 49. Closing
  deck.appendChild(buildClosing());
}

function renderWLGrid(eid){
  const res = STREAKS_RESULTS[eid] || [];
  let cells = '';
  for(let i=0; i<37; i++){
    const r = res[i] || '';
    cells += `<div class="wlcell ${r}" title="GW${i+1} ${r}"></div>`;
  }
  return `<div class="wlgrid">${cells}</div>`;
}

// KDH sparkline
function renderKDHSparkline(){
  // Per-GW points for KDH from analysis (0 implied if missing)
  const pts = [2,2,12,2,1,1,0,2,2,2,9,13,7,3,16,1,0,0,0,0,0,0,1,2,13,2,4,6,9,2,3,9,6,8,2,5,2];
  // Highlight GW16 (index 15) as signing line
  const W = 520, H = 140, padL = 26, padR = 14, padT = 18, padB = 22;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const max = 16;
  const xFor = i => padL + innerW * i / 36;
  const yFor = v => padT + innerH * (1 - v / max);
  let path = '';
  for(let i=0;i<pts.length;i++){
    path += (i===0?'M':'L') + xFor(i).toFixed(1) + ' ' + yFor(pts[i]).toFixed(1) + ' ';
  }
  const dots = pts.map((v,i)=>`<circle cx="${xFor(i)}" cy="${yFor(v)}" r="2.5" fill="${i<15?'#0A0A0A':'#FF1493'}"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${xFor(15)}" y1="${padT}" x2="${xFor(15)}" y2="${H-padB}" stroke="#FF1493" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="${xFor(15)+4}" y="${padT+10}" fill="#FF1493" font-family="Inter,sans-serif" font-size="11" font-weight="700">GW16: Christopher signs</text>
    <path d="${path}" stroke="#0A0A0A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${padL}" y="${H-4}" fill="#0A0A0A" font-family="Inter,sans-serif" font-size="10" opacity=".6">GW1</text>
    <text x="${W-padR-20}" y="${H-4}" fill="#0A0A0A" font-family="Inter,sans-serif" font-size="10" opacity=".6">GW37</text>
  </svg>`;
}

// Geraint transactions per GW
function renderGeraintTxBars(){
  // From analysis: GW1:2, GW3:1, GW7:2, GW10:1, GW16:2, GW17:1, GW22:3, GW23:2, GW26:1, GW27:1, GW28:3, GW31:5, GW32:2, GW33:2
  const tx = {1:2,3:1,7:2,10:1,16:2,17:1,22:3,23:2,26:1,27:1,28:3,31:5,32:2,33:2};
  const W = 520, H = 130, padL = 26, padR = 14, padT = 12, padB = 22;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const max = 5;
  const xFor = i => padL + innerW * (i - 1) / 36;
  let bars = '';
  for(let g=1; g<=37; g++){
    const v = tx[g] || 0;
    if(v > 0){
      const w = innerW / 38;
      const h = innerH * v / max;
      const isLate = g >= 31 && g <= 33;
      bars += `<rect x="${(xFor(g) - w/2).toFixed(1)}" y="${(H - padB - h).toFixed(1)}" width="${(w*0.85).toFixed(1)}" height="${h.toFixed(1)}" fill="${isLate?'var(--pink)':'#0A0A0A'}"/>`;
    }
  }
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <rect x="${(xFor(31)-innerW/76).toFixed(1)}" y="${padT}" width="${(innerW*3/37).toFixed(1)}" height="${innerH}" fill="#FF1493" opacity=".12"/>
    ${bars}
    <text x="${xFor(31)}" y="${padT+10}" fill="#FF1493" font-family="Inter,sans-serif" font-size="11" font-weight="700">GW31-33: 9 transactions</text>
    <text x="${padL}" y="${H-4}" fill="#0A0A0A" font-family="Inter,sans-serif" font-size="10" opacity=".6">GW1</text>
    <text x="${W-padR-20}" y="${H-4}" fill="#0A0A0A" font-family="Inter,sans-serif" font-size="10" opacity=".6">GW37</text>
  </svg>`;
}

// ============================================================================
// OBSERVER + INIT
// ============================================================================

let observer;
function setupObserver(){
  observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting && entry.intersectionRatio >= 0.4){
        if(entry.target.classList.contains('in-view')) return;
        entry.target.classList.add('in-view');
        // trigger any per-card behavior
        const which = entry.target.dataset.card;
        if(which === 'race'){
          const svg = entry.target.querySelector('#race-svg');
          const cap = entry.target.querySelector('#race-cap');
          if(svg) drawRaceChart(svg, cap);
        }
        // counters
        entry.target.querySelectorAll('.counter').forEach(elem=>{
          const target = +elem.dataset.target;
          const dur = +elem.dataset.duration || 2200;
          const from = elem.dataset.from!=null ? +elem.dataset.from : 0;
          const suffix = elem.dataset.suffix || '';
          const prefix = elem.dataset.prefix || '';
          // delay support
          const delay = +elem.dataset.delay || 0;
          setTimeout(()=>{
            if(target === 0 && from === 0){
              elem.textContent = prefix + '0' + suffix;
              return;
            }
            const start = performance.now();
            const tick = (now)=>{
              const t = Math.min(1, (now - start) / dur);
              const e = 1 - Math.pow(1 - t, 3);
              const v = Math.round(from + (target - from) * e);
              elem.textContent = prefix + v + suffix;
              if(t < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
          }, delay);
        });
      }
    });
  }, { threshold: [0, .4, .6, 1], rootMargin: '0px' });
  document.querySelectorAll('.card').forEach(card => observer.observe(card));
}

async function main(){
  try {
    await loadAll();
    computeBasics();
    bumpLoad(90);
    buildDeck();
    bumpLoad(100);
    // Wait one frame, then hide loader and observe
    requestAnimationFrame(()=>{
      document.getElementById('loading').classList.add('gone');
      setTimeout(()=>{ document.getElementById('loading').style.display = 'none'; }, 700);
      setupObserver();
      // Manually trigger first card animation since IntersectionObserver may not fire for already-visible elements consistently
      const first = deck.querySelector('.card');
      if(first){
        // Force a re-observe trigger
        first.classList.add('in-view');
        first.querySelectorAll('.counter').forEach(elem=>{
          const target = +elem.dataset.target;
          if(target > 0) countUp(elem, 0, target, 2200);
        });
      }
      // show scroll hint briefly
      const hint = document.getElementById('scroll-hint');
      hint.classList.add('show');
      setTimeout(()=> hint.classList.remove('show'), 4000);
    });
  } catch(err){
    document.getElementById('loading').innerHTML = '<div style="color:#FF1493;text-align:center;padding:20px;font-size:18px;">Failed to load season data.<br><span style="font-size:13px;opacity:.8;">' + err.message + '</span></div>';
    console.error(err);
  }
}

main();
